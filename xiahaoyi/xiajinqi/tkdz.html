// ==================== 2. 工具函数 ====================
const TAU = Math.PI * 2;
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function lerp(a, b, t) { return a + (b - a) * t; }

// ==================== 3. 对象池 ====================
class ObjectPool {
  constructor(createFn, resetFn) {
    this.pool = [];
    this.createFn = createFn;
    this.resetFn = resetFn;
  }
  get() {
    return this.pool.length > 0 ? this.pool.pop() : this.createFn();
  }
  release(obj) {
    this.resetFn(obj);
    this.pool.push(obj);
  }
}

// ==================== 3.5 军备背包 ====================
class Inventory {
  constructor() {
    this.parts = 0;
    this.coins = 0;
    this.weapons = {};
    this.shopSkills = {};     // 商店技能 { skillId: count }
    this.aircraft = {};       // 拥有的飞机 { interceptor: 1, ... }
    this.equipped = 'fighter'; // 当前装备的飞机
    // 段位与关卡
    this.rankScore = 0;       // 累计积分（用于段位晋升）
    this.bossStage = 1;       // 当前 Boss 关卡
    this.highestStage = 1;    // 最高通关关卡
    this.stageStars = {};     // 星级评分 { stageId: stars(1-3) }
    this.unlockedSkills = []; // 已解锁技能ID列表
    this._load();
  }

  addParts(n) { this.parts += n; this._save(); }
  addCoins(n) { this.coins += n; this._save(); }
  addWeapon(id) {
    this.weapons[id] = (this.weapons[id] || 0) + 1;
    this._save();
  }

  // 段位系统
  addRankScore(n) {
    this.rankScore += n;
    this._save();
  }
  getRank() {
    let rank = CONFIG.RANKS[0];
    for (const r of CONFIG.RANKS) {
      if (this.rankScore >= r.threshold) rank = r;
    }
    return rank;
  }
  getRankIndex() {
    let idx = 0;
    for (let i = 0; i < CONFIG.RANKS.length; i++) {
      if (this.rankScore >= CONFIG.RANKS[i].threshold) idx = i;
    }
    return idx;
  }

  // Boss 关卡
  clearBossStage(stageId, stars = 1) {
    if (stageId >= this.highestStage) {
      this.highestStage = stageId;
      this.bossStage = Math.min(stageId + 1, CONFIG.BOSS_STAGES.length);
    }
    // 保留最高星级
    const prev = this.stageStars[stageId] || 0;
    this.stageStars[stageId] = Math.max(prev, stars);
    this._save();
  }
  getStageStars(stageId) {
    return this.stageStars[stageId] || 0;
  }
  getBossStageConfig() {
    const idx = Math.min(this.bossStage - 1, CONFIG.BOSS_STAGES.length - 1);
    return CONFIG.BOSS_STAGES[idx];
  }

  // 技能系统
  unlockSkill(skillId) {
    if (!this.unlockedSkills.includes(skillId)) {
      this.unlockedSkills.push(skillId);
    }
    this._save();
  }
  hasSkill(skillId) {
    return this.unlockedSkills.includes(skillId);
  }

  buyShopSkill(id) {
    const cfg = CONFIG.SHOP_SKILLS[id];
    if (!cfg) return false;
    if (this.coins < cfg.cost) return false;
    this.coins -= cfg.cost;
    this.shopSkills[id] = (this.shopSkills[id] || 0) + 1;
    this._save();
    return true;
  }
  hasShopSkill(id) {
    return (this.shopSkills[id] || 0) > 0;
  }
  getShopSkillCount(id) {
    return this.shopSkills[id] || 0;
  }

  // 用零件购买飞机
  buyAircraftWithParts(id) {
    const cfg = CONFIG.AIRCRAFT[id];
    if (!cfg || cfg.parts === undefined) return false;
    if (this.parts < cfg.parts) return false;
    this.parts -= cfg.parts;
    this.aircraft[id] = 1;
    this._save();
    return true;
  }

  equipAircraft(id) {
    if (id === 'fighter' || (this.aircraft[id] || 0) > 0) {
      this.equipped = id;
      this._save();
      return true;
    }
    return false;
  }

  getCurrentBonus() {
    const cfg = CONFIG.AIRCRAFT[this.equipped];
    return cfg ? cfg.bonus : {};
  }

  getUpgrades() {
    // 兼容旧接口，返回当前装备飞机的加成
    return this.getCurrentBonus();
  }

  _save() {
    try {
      localStorage.setItem('planeInventory', JSON.stringify({
        parts: this.parts, coins: this.coins, weapons: this.weapons,
        shopSkills: this.shopSkills,
        aircraft: this.aircraft, equipped: this.equipped,
        rankScore: this.rankScore, bossStage: this.bossStage,
        highestStage: this.highestStage, stageStars: this.stageStars,
        unlockedSkills: this.unlockedSkills,
      }));
    } catch (e) { /* ignore */ }
  }

  _load() {
    try {
      const raw = localStorage.getItem('planeInventory');
      if (raw) {
        const data = JSON.parse(raw);
        this.parts = data.parts || 0;
        this.coins = data.coins || 0;
        this.weapons = data.weapons || {};
        this.shopSkills = data.shopSkills || {};
        this.aircraft = data.aircraft || {};
        this.equipped = data.equipped || 'fighter';
        this.rankScore = data.rankScore || 0;
        this.bossStage = data.bossStage || 1;
        this.highestStage = data.highestStage || 1;
        this.stageStars = data.stageStars || {};
        this.unlockedSkills = data.unlockedSkills || [];
      }
    } catch (e) { /* ignore */ }
  }
}

// ==================== 4. 音频管理 ====================
class AudioManager {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.musicGain = null;
    this.musicOsc = null;
    this.musicPlaying = false;
  }

  init() {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      this.enabled = false;
    }
  }

  ensureCtx() {
    if (!this.ctx) this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }

  playTone(freq, type, duration, vol = 0.1, rampDown = true) {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    if (rampDown) gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + duration);
  }

  playNoise(duration, vol = 0.08) {
    if (!this.enabled || !this.ctx) return;
    const bufferSize = this.ctx.sampleRate * duration;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const source = this.ctx.createBufferSource();
    source.buffer = buffer;
    const gain = this.ctx.createGain();
    const t = this.ctx.currentTime;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2000, t);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    source.start(t);
  }

  // 攻击音效 - 激光发射感
  sfx_shoot() {
    this.playTone(800, 'square', 0.06, 0.06);
  }

  // 爆炸音效
  sfx_explosion() {
    this.playNoise(0.25, 0.08);
  }

  // Boss爆炸
  sfx_bossExplosion() {
    this.playTone(60, 'sawtooth', 0.8, 0.15);
    this.playNoise(0.6, 0.12);
    // 低频冲击波
    if (this.enabled && this.ctx) {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(30, t);
      osc.frequency.linearRampToValueAtTime(10, t + 0.8);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.8);
    }
  }

  // 拾取道具
  sfx_powerup() {
    this.playTone(600, 'sine', 0.08, 0.08);
    setTimeout(() => this.playTone(900, 'sine', 0.08, 0.08), 60);
    setTimeout(() => this.playTone(1200, 'sine', 0.1, 0.08), 120);
  }

  // 玩家受击
  sfx_hit() {
    this.playTone(150, 'square', 0.2, 0.12);
  }

  // 敌人受击
  sfx_enemyHit() {
    this.playTone(400, 'square', 0.06, 0.06);
    this.playNoise(0.04, 0.04);
  }

  // 玩家死亡
  sfx_playerDie() {
    this.playTone(200, 'sawtooth', 0.3, 0.15);
    this.playTone(80, 'square', 0.5, 0.12);
    this.playNoise(0.3, 0.1);
  }

  // 敌机射击
  sfx_enemyFire() {
    this.playTone(300, 'square', 0.05, 0.04);
  }

  // Boss射击
  sfx_bossFire() {
    this.playTone(100, 'sawtooth', 0.15, 0.08);
    this.playTone(200, 'square', 0.08, 0.05);
  }

  // 炸弹清屏
  sfx_bomb() {
    this.playTone(50, 'sawtooth', 0.5, 0.2);
    this.playNoise(0.4, 0.15);
  }

  // Boss警告
  sfx_bossWarning() {
    for (let i = 0; i < 3; i++) {
      setTimeout(() => this.playTone(100, 'square', 0.3, 0.15), i * 400);
    }
  }

  // 僚机射击
  sfx_droneShoot() {
    this.playTone(1000, 'square', 0.04, 0.04);
  }

  // 游戏开始 - 上升琶音
  sfx_gameStart() {
    const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
    notes.forEach((freq, i) => {
      setTimeout(() => this.playTone(freq, 'sine', 0.18, 0.06, true), i * 80);
    });
    if (this.enabled && this.ctx) {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(65.41, t);
      gain.gain.setValueAtTime(0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.6);
    }
  }

  // 游戏结束
  sfx_gameOver() {
    const notes = [392.00, 349.23, 329.63, 261.63];
    notes.forEach((freq, i) => {
      setTimeout(() => this.playTone(freq, 'sawtooth', 0.3, 0.08, true), i * 200);
    });
  }

  // 连击
  sfx_combo() {
    this.playTone(523.25, 'sine', 0.1, 0.06);
    setTimeout(() => this.playTone(659.25, 'sine', 0.1, 0.06), 80);
  }

  // UI 点击
  sfx_click() {
    this.playTone(800, 'sine', 0.04, 0.04);
  }

  startMusic() {
    if (!this.enabled || !this.ctx || this.musicPlaying) return;
    this.musicPlaying = true;
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.setValueAtTime(0.03, this.ctx.currentTime);
    this.musicGain.connect(this.ctx.destination);
    this._musicLoop();
  }

  stopMusic() {
    this.musicPlaying = false;
    if (this.musicOsc) { try { this.musicOsc.stop(); } catch(e){} this.musicOsc = null; }
  }

  _musicLoop() {
    if (!this.musicPlaying || !this.enabled || !this.ctx) return;
    const notes = [130.81, 164.81, 196.00, 220.00, 261.63, 220.00, 196.00, 164.81];
    const t = this.ctx.currentTime;
    const noteIdx = Math.floor(t / 0.25) % notes.length;
    try { if (this.musicOsc) this.musicOsc.stop(); } catch(e){}
    this.musicOsc = this.ctx.createOscillator();
    this.musicOsc.type = 'triangle';
    this.musicOsc.frequency.setValueAtTime(notes[noteIdx], t);
    this.musicOsc.connect(this.musicGain);
    this.musicOsc.start(t);
    this.musicOsc.stop(t + 0.25);
    setTimeout(() => this._musicLoop(), 200);
  }
}

// ==================== 5. 输入管理 ====================
class InputManager {
  constructor() {
    this.keys = {};
    this.codes = {};
    this.mouse = { x: 0, y: 0, down: false, clicked: false, clickX: 0, clickY: 0, wheelDelta: 0, wheelConsumed: false };
    this.touch = { active: false, x: 0, y: 0, offsetX: 0, offsetY: 0, clicked: false, clickX: 0, clickY: 0 };
    this._canvas = null;
    this._onKeyDown = this._onKeyDown.bind(this);
    this._onKeyUp = this._onKeyUp.bind(this);
    this._onMouseMove = this._onMouseMove.bind(this);
    this._onMouseDown = this._onMouseDown.bind(this);
    this._onMouseUp = this._onMouseUp.bind(this);
    this._onMouseClick = this._onMouseClick.bind(this);
    this._onWheel = this._onWheel.bind(this);
    this._onTouchStart = this._onTouchStart.bind(this);
    this._onTouchMove = this._onTouchMove.bind(this);
    this._onTouchEnd = this._onTouchEnd.bind(this);
  }

  init(canvas) {
    this._canvas = canvas;
    window.addEventListener('keydown', this._onKeyDown);
    window.addEventListener('keyup', this._onKeyUp);
    window.addEventListener('mousemove', this._onMouseMove);
    window.addEventListener('mousedown', this._onMouseDown);
    window.addEventListener('mouseup', this._onMouseUp);
    window.addEventListener('click', this._onMouseClick);
    canvas.addEventListener('wheel', this._onWheel, { passive: false });
    canvas.addEventListener('touchstart', this._onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', this._onTouchMove, { passive: false });
    canvas.addEventListener('touchend', this._onTouchEnd);
  }

  _getCanvasPos(e) {
    if (!this._canvas) return { x: e.clientX, y: e.clientY };
    const rect = this._canvas.getBoundingClientRect();
    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    return {
      x: (e.clientX - rect.left) * (this._canvas.width / rect.width) / pixelRatio,
      y: (e.clientY - rect.top) * (this._canvas.height / rect.height) / pixelRatio
    };
  }

  _onKeyDown(e) { this.keys[e.key] = true; this.codes[e.code] = true; e.preventDefault(); }
  _onKeyUp(e) { this.keys[e.key] = false; this.codes[e.code] = false; e.preventDefault(); }
  _onMouseMove(e) {
    const pos = this._getCanvasPos(e);
    this.mouse.x = pos.x;
    this.mouse.y = pos.y;
  }
  _onMouseDown(e) { this.mouse.down = true; }
  _onMouseUp(e) { this.mouse.down = false; }
  _onMouseClick(e) {
    const pos = this._getCanvasPos(e);
    this.mouse.clicked = true;
    this.mouse.clickX = pos.x;
    this.mouse.clickY = pos.y;
  }
  _onTouchStart(e) {
    e.preventDefault();
    this.touch.active = true;
    const t = e.touches[0];
    this.touch.x = t.clientX;
    this.touch.y = t.clientY;
    this.touch.offsetX = 0;
    this.touch.offsetY = 0;
    // 记录触摸点击
    const rect = e.target.getBoundingClientRect();
    this.touch.clicked = true;
    this.touch.clickX = t.clientX - rect.left;
    this.touch.clickY = t.clientY - rect.top;
  }
  _onTouchMove(e) {
    e.preventDefault();
    if (!this.touch.active) return;
    const t = e.touches[0];
    this.touch.offsetX = t.clientX - this.touch.x;
    this.touch.offsetY = t.clientY - this.touch.y;
    this.touch.x = t.clientX;
    this.touch.y = t.clientY;
  }
  _onTouchEnd(e) { this.touch.active = false; }

  _onWheel(e) {
    e.preventDefault();
    this.mouse.wheelDelta += e.deltaY > 0 ? 1 : -1;
  }

  getWheelDelta() {
    const d = this.mouse.wheelDelta;
    this.mouse.wheelDelta = 0;
    return d;
  }

  isDown(key) { return !!this.keys[key]; }
  isCode(code) { return !!this.codes[code]; }
  isAnyDown(...keys) { return keys.some(k => this.keys[k]); }

  // P1: WASD
  getDirection() {
    let dx = 0, dy = 0;
    if (this.isAnyDown('a', 'A')) dx = -1;
    if (this.isAnyDown('d', 'D')) dx = 1;
    if (this.isAnyDown('w', 'W')) dy = -1;
    if (this.isAnyDown('s', 'S')) dy = 1;
    if (this.touch.active) {
      dx = clamp(this.touch.offsetX / 5, -1, 1);
      dy = clamp(this.touch.offsetY / 5, -1, 1);
      this.touch.offsetX *= 0.5;
      this.touch.offsetY *= 0.5;
    }
    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }
    return { dx, dy };
  }

  isFire() {
    return this.isAnyDown(' ', 'j', 'J') || this.mouse.down || this.touch.active;
  }
  isBomb() {
    return this.isAnyDown('k', 'K');
  }
  isBombKey() { return this.isAnyDown('b', 'B'); }
  isBoost() { return this.isAnyDown('z', 'Z'); }
  isEnter() {
    return this.isAnyDown('Enter');
  }
  isPause() {
    return this.isAnyDown('Escape');
  }
  isUp() { return this.isAnyDown('ArrowUp', 'w', 'W'); }
  isDown_() { return this.isAnyDown('ArrowDown', 's', 'S'); }

  // 技能快捷键
  isSkillKey(key) { return this.isAnyDown(key); }
  // 商店技能快捷键（数字键1-5）
  isShopSkillKey(key) { return this.isAnyDown(key); }

  getClick() {
    if (this.mouse.clicked) return { x: this.mouse.clickX, y: this.mouse.clickY };
    if (this.touch.clicked) return { x: this.touch.clickX, y: this.touch.clickY };
    return null;
  }
  consumeClick() {
    this.mouse.clicked = false;
    this.touch.clicked = false;
  }
}

// ==================== 6. 粒子系统 ====================
class Particle {
  constructor() { this.reset(); }
  reset() { this.alive = false; this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.life = 0; this.maxLife = 0; this.color = '#fff'; this.size = 2; }
  init(x, y, vx, vy, life, color, size = 2) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life; this.color = color; this.size = size;
    this.alive = true;
  }
  update(dt) {
    this.life -= dt;
    if (this.life <= 0) { this.alive = false; return; }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vx *= 0.98;
    this.vy *= 0.98;
  }
  draw(ctx) {
    const alpha = this.life / this.maxLife;
    const s = this.size * alpha;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = s * 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, s, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

// ==================== 7. 实体基类 ====================
class Entity {
  constructor() {
    this.x = 0; this.y = 0; this.w = 0; this.h = 0;
    this.vx = 0; this.vy = 0;
    this.hp = 1; this.maxHp = 1;
    this.alive = false;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }
  draw(ctx) {}
  takeDamage(dmg) {
    this.hp -= dmg;
    if (this.hp <= 0) { this.hp = 0; this.alive = false; }
  }
  collidesWith(other) {
    return aabb(
      { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h },
      { x: other.x - other.w / 2, y: other.y - other.h / 2, w: other.w, h: other.h }
    );
  }
}

// ==================== 8. 子弹 ====================
class Bullet extends Entity {
  constructor() {
    super();
    this.isPlayer = true;
    this.tracking = false;
    this.trackingLife = 0;
    this.laser = false;
    this.laserEndX = 0;
    this.laserEndY = 0;
    this.damage = 1;
  }
  reset() {
    this.alive = false;
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
    this.w = 4; this.h = 8;
    this.isPlayer = true;
    this.tracking = false;
    this.trackingLife = 0;
    this.laser = false;
    this.damage = 1;
  }
  init(x, y, vx, vy, isPlayer = true, damage = 1, tracking = false, w = 4, h = 8) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.w = w; this.h = h;
    this.isPlayer = isPlayer;
    this.damage = damage;
    this.tracking = tracking;
    this.trackingLife = CONFIG.BULLET_TRACKING_LIFE;
    this.alive = true;
  }
  update(dt) {
    if (this.tracking && this.trackingLife > 0) {
      this.trackingLife -= dt;
      const target = this._trackTarget;
      if (target && target.alive) {
        const angle = Math.atan2(target.y - this.y, target.x - this.x);
        const currentAngle = Math.atan2(this.vy, this.vx);
        let diff = angle - currentAngle;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const maxTurn = 3 * Math.PI / 180;
        const newAngle = currentAngle + clamp(diff, -maxTurn, maxTurn);
        const speed = Math.hypot(this.vx, this.vy);
        this.vx = Math.cos(newAngle) * speed;
        this.vy = Math.sin(newAngle) * speed;
      }
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.x < -20 || this.x > CONFIG.WIDTH + 20 || this.y < -20 || this.y > CONFIG.HEIGHT - 72 - (this.h || 5)) {
      this.alive = false;
    }
  }
  draw(ctx) {
    if (this.isPlayer) {
      ctx.fillStyle = '#00d4ff';
      ctx.shadowColor = '#00d4ff';
      ctx.shadowBlur = 8;
      ctx.fillRect(this.x - this.w / 2, this.y - this.h / 2, this.w, this.h);
      ctx.shadowBlur = 0;
    } else if (this.tracking) {
      ctx.fillStyle = '#b44dff';
      ctx.shadowColor = '#b44dff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.w, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = '#ff2d55';
      ctx.shadowColor = '#ff2d55';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.w / 2, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
}

    this.drones += this.upgradeDrone;
    this.maxHp += this.upgradeHp;
    this.hp = Math.min(this.hp + this.upgradeHp, this.maxHp);
    // 飞机皮肤
    const acCfg = CONFIG.AIRCRAFT[inventory.equipped];
    this.skin = acCfg ? acCfg.skin : 'fighter';
    // 段位加成
    const rank = inventory.getRank();
    this.rankFireRate = rank.bonus.fireRate || 0;
    this.rankBulletCount = rank.bonus.bulletCount || 0;
    this.rankDamage = rank.bonus.damage || 0;
  }

  get totalFireRate() { return this.upgradeFireRate + this.rankFireRate; }
  get totalBulletCount() { return this.upgradeBulletCount + this.rankBulletCount; }
  get totalDamage() { return this.upgradeDamage + this.rankDamage; }

  isInvincible() { return this.invincibleTimer > 0 || this.shieldHp > 0; }

  tryUseSkill(skillId, inventory, audio) {
    if (!inventory || !inventory.hasSkill(skillId)) return false;
    const cfg = CONFIG.SKILLS[skillId];
    if (!cfg) return false;
    // 检查冷却
    if (this.skillCooldowns[skillId] && this.skillCooldowns[skillId] > 0) return false;
    // 检查是否已有技能激活
    if (this.skillActive) return false;
    // 激活技能
    this.skillCooldowns[skillId] = cfg.cooldown;
    if (cfg.duration > 0) {
      this.skillActive = skillId;
      this.skillTimer = cfg.duration;
    }
    // 即时效果
    switch (skillId) {
      case 'shield':   this.shieldHp = 3; break;
      case 'slow':     this.slowActive = true; break;
      case 'repair':   this.hp = Math.min(this.hp + 2, this.maxHp); break;
      case 'power':    this.powerMultiplier = 2; break;
      case 'ultimate': this.shieldHp = 5; this.slowActive = true; this.powerMultiplier = 2; break;
      case 'magnet':   this.magnetActive = true; break;
      case 'dash':     this.y = Math.max(this.y - 60, this.h / 2); this.invincibleTimer = 0.5; break;
      case 'crit':     this.critChance = 0.3; this.critMultiplier = 3; break;
      case 'clone':    this.cloneX = this.x + rand(-40, 40); this.cloneY = this.y; this.cloneTimer = cfg.duration; break;
      case 'nuke':     this._nukeTriggered = true; break;
    }
    if (audio) audio.sfx_powerup();
    return true;
  }

  tryUseShopSkill(skillId, inventory, audio) {
    if (!inventory || !inventory.hasShopSkill(skillId)) return false;
    const cfg = CONFIG.SHOP_SKILLS[skillId];
    if (!cfg) return false;
    // 消耗一次使用次数
    inventory.shopSkills[skillId] = Math.max(0, (inventory.shopSkills[skillId] || 0) - 1);
    if (cfg.duration > 0) {
      this.shopSkillActive = skillId;
      this.shopSkillTimer = cfg.duration;
    }
    // 效果
    switch (skillId) {
      case 'slowdown':  this.slowActive = true; break;
      case 'shield':    this.shieldHp = 3; break;
      case 'firepower': this.powerMultiplier = 2; break;
      case 'spread':    this._spreadActive = true; break;
      case 'clear':     this._nukeTriggered = true; break;
    }
    if (audio) audio.sfx_powerup();
    return true;
  }

  update(dt, input) {
    const { dx, dy } = input.getDirection();
    let speed = CONFIG.PLAYER_SPEED + (this.upgradeSpeed || 0) * 60;
    if (input.isBoost()) speed *= 1.5; // 按住Shift加速
    this.boostActive = input.isBoost();
    this.vx = dx * speed;
    this.vy = dy * speed;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.x = clamp(this.x, this.w / 2, CONFIG.WIDTH - this.w / 2);
    this.y = clamp(this.y, this.h / 2, CONFIG.HEIGHT - this.h / 2);

    if (this.invincibleTimer > 0) this.invincibleTimer -= dt;
    if (this.fireTimer > 0) this.fireTimer -= dt;

    // 更新技能冷却
    for (const key of Object.keys(this.skillCooldowns)) {
      if (this.skillCooldowns[key] > 0) this.skillCooldowns[key] -= dt;
    }
    // 更新技能持续时间
    if (this.skillActive) {
      this.skillTimer -= dt;
      if (this.skillTimer <= 0) {
        this._deactivateSkill();
        this.skillActive = null;
      }
    }
    // 分身计时
    if (this.cloneTimer > 0) this.cloneTimer -= dt;
    // 更新商店技能持续时间
    if (this.shopSkillActive) {
      this.shopSkillTimer -= dt;
      if (this.shopSkillTimer <= 0) {
        this._deactivateShopSkill();
        this.shopSkillActive = null;
      }
    }
  }

  _deactivateSkill() {
    this.powerMultiplier = 1;
    this.slowActive = false;
    this.magnetActive = false;
    this.critChance = 0;
    this.critMultiplier = 1;
  }

  _deactivateShopSkill() {
    this.powerMultiplier = 1;
    this.slowActive = false;
    this._spreadActive = false;
  }

  canFire() { return this.fireTimer <= 0; }
  resetFireTimer() { this.fireTimer = Math.max(0.05, CONFIG.PLAYER_FIRE_INTERVAL - this.totalFireRate); }

  takeDamage(dmg) {
    if (this.invincibleTimer > 0) return;
    if (this.shieldHp > 0) {
      this.shieldHp -= dmg;
      if (this.shieldHp < 0) this.shieldHp = 0;
      return;
    }
    this.hp -= dmg;
    this.invincibleTimer = CONFIG.PLAYER_INVINCIBLE_TIME;
    if (this.hp <= 0) { this.hp = 0; this.alive = false; }
  }

  draw(ctx, time) {
    if (!this.alive) return;
    // 闪烁无敌
    if (this.invincibleTimer > 0 && Math.floor(time * 10) % 2 === 0) return;

    ctx.save();
    ctx.translate(this.x, this.y);

    const hw = this.w / 2, hh = this.h / 2;
    const flicker = Math.sin(time * 30) * 0.3 + 0.7;

    switch (this.skin) {
      case 'interceptor':
        this._drawInterceptor(ctx, time, hw, hh, flicker);
        break;
      case 'bomber':
        this._drawBomber(ctx, time, hw, hh, flicker);
        break;
      case 'sentinel':
        this._drawSentinel(ctx, time, hw, hh, flicker);
        break;
      case 'shadow':
        this._drawShadow(ctx, time, hw, hh, flicker);
        break;
      case 'destroyer':
        this._drawDestroyer(ctx, time, hw, hh, flicker);
        break;
      case 'starlight':
        this._drawStarlight(ctx, time, hw, hh, flicker);
        break;
      case 'voidwing':
        this._drawVoidwing(ctx, time, hw, hh, flicker);
        break;
      case 'titan':
        this._drawTitan(ctx, time, hw, hh, flicker);
        break;
      default:
        this._drawFighter(ctx, time, hw, hh, flicker);
        break;
    }

    // 护盾
    if (this.shieldHp > 0) {
      ctx.strokeStyle = this.skillActive === 'ultimate' ? '#ffd700' : this.shopSkillActive === 'shield' ? '#ffd700' : '#00ffcc';
      ctx.shadowColor = this.skillActive === 'ultimate' ? '#ffd700' : this.shopSkillActive === 'shield' ? '#ffd700' : '#00ffcc';
      ctx.shadowBlur = 16;
      ctx.lineWidth = 2.5;
      const pulse = Math.sin(time * 5) * 3 + 22;
      ctx.beginPath();
      ctx.arc(0, 0, pulse, 0, TAU);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // 技能激活效果
    if (this.skillActive || this.shopSkillActive) {
      const active = this.skillActive || this.shopSkillActive;
      const cfg = CONFIG.SKILLS[active] || CONFIG.SHOP_SKILLS[active];
      const timer = this.skillActive ? this.skillTimer : this.shopSkillTimer;
      ctx.fillStyle = active === 'ultimate' ? '#ffd700' : active === 'power' || active === 'firepower' ? '#ff4444' : '#00ffcc';
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 20;
      ctx.font = 'bold 10px "Courier New"';
      ctx.textAlign = 'center';
      const label = cfg?.name || '';
      const remain = Math.ceil(timer);
      ctx.fillText(`${label} ${remain}s`, 0, -hh - 12);
      ctx.shadowBlur = 0;
      ctx.textAlign = 'start';
    }

    // 加速效果
    if (this.boostActive) {
      ctx.strokeStyle = 'rgba(0,255,200,0.5)';
      ctx.shadowColor = '#00ffc8';
      ctx.shadowBlur = 15;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, hw + 6, 0, TAU);
      ctx.stroke();
      // 加速尾焰
      ctx.fillStyle = 'rgba(0,255,200,0.3)';
      ctx.shadowColor = '#00ffc8';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(-6, hh);
      ctx.lineTo(0, hh + 18);
      ctx.lineTo(6, hh);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }

  // 战斗机 - 标准蓝色三角
  _drawFighter(ctx, time, hw, hh, flicker) {
    // 引擎尾焰
    ctx.fillStyle = '#00d4ff';
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 12 * flicker;
    ctx.beginPath();
    ctx.moveTo(0, hh - 2);
    ctx.lineTo(-6, hh + 8);
    ctx.lineTo(6, hh + 8);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // 机体
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#0a0a2e';
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -hh);
    ctx.lineTo(-hw, hh - 4);
    ctx.lineTo(-hw / 2, hh / 2);
    ctx.lineTo(hw / 2, hh / 2);
    ctx.lineTo(hw, hh - 4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 驾驶舱
    ctx.fillStyle = '#80f0ff';
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(0, -2, 5, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 拦截机 - 锐利窄三角，青色
  _drawInterceptor(ctx, time, hw, hh, flicker) {
    // 引擎尾焰（双引擎）
    ctx.fillStyle = '#00e5ff';
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 10 * flicker;
    [-hw * 0.3, hw * 0.3].forEach(ex => {
      ctx.beginPath();
      ctx.moveTo(ex - 3, hh);
      ctx.lineTo(ex + 3, hh);
      ctx.lineTo(ex + 1, hh + 10);
      ctx.lineTo(ex - 1, hh + 10);
      ctx.closePath();
      ctx.fill();
    });
    ctx.shadowBlur = 0;

    // 锐利三角机身
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#0a0a2e';
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -hh - 4);
    ctx.lineTo(-hw * 0.3, -hh * 0.5);
    ctx.lineTo(-hw * 0.2, -hh * 0.2);
    ctx.lineTo(-hw * 0.9, hh * 0.15);
    ctx.lineTo(-hw * 0.35, hh * 0.55);
    ctx.lineTo(-hw * 0.1, hh * 0.25);
    ctx.lineTo(0, hh);
    ctx.lineTo(hw * 0.1, hh * 0.25);
    ctx.lineTo(hw * 0.35, hh * 0.55);
    ctx.lineTo(hw * 0.9, hh * 0.15);
    ctx.lineTo(hw * 0.2, -hh * 0.2);
    ctx.lineTo(hw * 0.3, -hh * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 驾驶舱（长条形）
    ctx.fillStyle = '#80f0ff';
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.ellipse(0, -hh * 0.3, hw * 0.12, hh * 0.22, 0, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 轰炸机 - 宽大笨重，橙色
  _drawBomber(ctx, time, hw, hh, flicker) {
    // 引擎尾焰（宽大）
    ctx.fillStyle = '#ff8c00';
    ctx.shadowColor = '#ff8c00';
    ctx.shadowBlur = 14 * flicker;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.5, hh);
    ctx.lineTo(hw * 0.5, hh);
    ctx.lineTo(hw * 0.3, hh + 12);
    ctx.lineTo(-hw * 0.3, hh + 12);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // 宽大机身
    ctx.shadowColor = '#ff8c00';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#1a0a00';
    ctx.strokeStyle = '#ff8c00';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, -hh);
    ctx.lineTo(-hw * 0.4, -hh * 0.6);
    ctx.lineTo(-hw * 0.25, -hh * 0.3);
    ctx.lineTo(-hw, hh * 0.1);
    ctx.lineTo(-hw * 0.8, hh * 0.5);
    ctx.lineTo(-hw * 0.3, hh * 0.3);
    ctx.lineTo(-hw * 0.15, hh * 0.6);
    ctx.lineTo(hw * 0.15, hh * 0.6);
    ctx.lineTo(hw * 0.3, hh * 0.3);
    ctx.lineTo(hw * 0.8, hh * 0.5);
    ctx.lineTo(hw, hh * 0.1);
    ctx.lineTo(hw * 0.25, -hh * 0.3);
    ctx.lineTo(hw * 0.4, -hh * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 驾驶舱
    ctx.fillStyle = '#ffcc66';
    ctx.shadowColor = '#ff8c00';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(0, -hh * 0.25, hw * 0.2, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 歼星舰 - 圆形发光环，金色
  _drawDestroyer(ctx, time, hw, hh, flicker) {
    // 引擎光环
    ctx.strokeStyle = '#ffd700';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 18 * flicker;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, hh * 0.2, hw * 0.6, 0, TAU);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 圆形机身
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#0a0a00';
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, hw * 0.9, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 内环
    ctx.strokeStyle = '#ffd700';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, hw * 0.5, 0, TAU);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 驾驶舱
    ctx.fillStyle = '#ffe080';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, -3, hw * 0.2, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 引擎尾焰
    ctx.fillStyle = '#ff6644';
    ctx.shadowColor = '#ff4400';
    ctx.shadowBlur = 10 * flicker;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.25, hh * 0.7);
    ctx.lineTo(hw * 0.25, hh * 0.7);
    ctx.lineTo(hw * 0.15, hh * 1.1);
    ctx.lineTo(-hw * 0.15, hh * 1.1);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 虚空之翼 - 攻击性翼焰，紫色
  _drawVoidwing(ctx, time, hw, hh, flicker) {
    // 翼焰
    ctx.fillStyle = '#b44dff';
    ctx.shadowColor = '#b44dff';
    ctx.shadowBlur = 16 * flicker;
    // 左翼焰
    ctx.beginPath();
    ctx.moveTo(-hw * 0.3, hh * 0.3);
    ctx.lineTo(-hw * 0.9, hh * 0.1);
    ctx.lineTo(-hw * 0.7, hh * 0.7);
    ctx.lineTo(-hw * 0.4, hh * 0.5);
    ctx.closePath();
    ctx.fill();
    // 右翼焰
    ctx.beginPath();
    ctx.moveTo(hw * 0.3, hh * 0.3);
    ctx.lineTo(hw * 0.9, hh * 0.1);
    ctx.lineTo(hw * 0.7, hh * 0.7);
    ctx.lineTo(hw * 0.4, hh * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // 引擎尾焰
    ctx.fillStyle = '#b44dff';
    ctx.shadowColor = '#b44dff';
    ctx.shadowBlur = 12 * flicker;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.15, hh);
    ctx.lineTo(hw * 0.15, hh);
    ctx.lineTo(hw * 0.08, hh + 14);
    ctx.lineTo(-hw * 0.08, hh + 14);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // 攻击性机身
    ctx.shadowColor = '#b44dff';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#0a0020';
    ctx.strokeStyle = '#b44dff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -hh - 2);
    ctx.lineTo(-hw * 0.25, -hh * 0.5);
    ctx.lineTo(-hw * 0.15, -hh * 0.2);
    ctx.lineTo(-hw * 0.8, hh * 0.1);
    ctx.lineTo(-hw * 0.5, hh * 0.55);
    ctx.lineTo(-hw * 0.15, hh * 0.3);
    ctx.lineTo(0, hh);
    ctx.lineTo(hw * 0.15, hh * 0.3);
    ctx.lineTo(hw * 0.5, hh * 0.55);
    ctx.lineTo(hw * 0.8, hh * 0.1);
    ctx.lineTo(hw * 0.15, -hh * 0.2);
    ctx.lineTo(hw * 0.25, -hh * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 驾驶舱（紫色发光）
    ctx.fillStyle = '#d4a0ff';
    ctx.shadowColor = '#b44dff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, -hh * 0.25, hw * 0.15, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 铁壁守卫 - 深蓝色厚重三角 + 盾牌纹理
  _drawSentinel(ctx, time, hw, hh, flicker) {
    // 引擎尾焰
    ctx.fillStyle = '#1a5276';
    ctx.shadowColor = '#1a5276';
    ctx.shadowBlur = 12 * flicker;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.3, hh);
    ctx.lineTo(hw * 0.3, hh);
    ctx.lineTo(hw * 0.15, hh + 10);
    ctx.lineTo(-hw * 0.15, hh + 10);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // 厚重大三角机身
    ctx.fillStyle = '#0a1628';
    ctx.strokeStyle = '#1a5276';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#1a5276';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.moveTo(0, -hh);
    ctx.lineTo(-hw * 0.5, -hh * 0.4);
    ctx.lineTo(-hw * 0.7, hh * 0.1);
    ctx.lineTo(-hw, hh * 0.5);
    ctx.lineTo(-hw * 0.4, hh * 0.55);
    ctx.lineTo(-hw * 0.15, hh * 0.3);
    ctx.lineTo(0, hh * 0.7);
    ctx.lineTo(hw * 0.15, hh * 0.3);
    ctx.lineTo(hw * 0.4, hh * 0.55);
    ctx.lineTo(hw, hh * 0.5);
    ctx.lineTo(hw * 0.7, hh * 0.1);
    ctx.lineTo(hw * 0.5, -hh * 0.4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 盾牌纹理
    ctx.strokeStyle = '#2980b9';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -hh * 0.4);
    ctx.lineTo(0, hh * 0.4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-hw * 0.3, -hh * 0.1);
    ctx.lineTo(hw * 0.3, -hh * 0.1);
    ctx.stroke();

    // 驾驶舱
    ctx.fillStyle = '#5dade2';
    ctx.shadowColor = '#2980b9';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(0, -hh * 0.2, hw * 0.15, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 暗影突袭者 - 暗紫色+锋利三角，速度型
  _drawShadow(ctx, time, hw, hh, flicker) {
    // 引擎尾焰
    ctx.fillStyle = '#7b1fa2';
    ctx.shadowColor = '#7b1fa2';
    ctx.shadowBlur = 14 * flicker;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.25, hh);
    ctx.lineTo(hw * 0.25, hh);
    ctx.lineTo(hw * 0.1, hh + 12);
    ctx.lineTo(-hw * 0.1, hh + 12);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // 锋利三角机身
    ctx.fillStyle = '#1a0a2e';
    ctx.strokeStyle = '#7b1fa2';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#9c27b0';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(0, -hh * 1.1);
    ctx.lineTo(-hw * 0.3, -hh * 0.3);
    ctx.lineTo(-hw * 0.8, hh * 0.2);
    ctx.lineTo(-hw, hh * 0.7);
    ctx.lineTo(-hw * 0.3, hh * 0.55);
    ctx.lineTo(0, hh * 0.8);
    ctx.lineTo(hw * 0.3, hh * 0.55);
    ctx.lineTo(hw, hh * 0.7);
    ctx.lineTo(hw * 0.8, hh * 0.2);
    ctx.lineTo(hw * 0.3, -hh * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 暗影纹路
    ctx.strokeStyle = '#e040fb';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.5, hh * 0.1);
    ctx.lineTo(0, -hh * 0.3);
    ctx.lineTo(hw * 0.5, hh * 0.1);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-hw * 0.2, hh * 0.4);
    ctx.lineTo(0, hh * 0.6);
    ctx.lineTo(hw * 0.2, hh * 0.4);
    ctx.stroke();

    // 驾驶舱 - 紫色
    ctx.fillStyle = '#ce93d8';
    ctx.shadowColor = '#e040fb';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.ellipse(0, -hh * 0.1, hw * 0.12, hh * 0.2, 0, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 星辉光翼 - 金色+白色光翼，华丽型
  _drawStarlight(ctx, time, hw, hh, flicker) {
    // 光翼尾焰
    const wingGlow = Math.sin(time * 6) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255, 215, 0, ${0.5 * flicker})`;
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 18 * flicker;
    // 左翼
    ctx.beginPath();
    ctx.moveTo(-hw * 0.3, hh * 0.1);
    ctx.quadraticCurveTo(-hw * 1.5, hh * 0.3, -hw * 0.4, hh * 0.7);
    ctx.quadraticCurveTo(-hw * 0.2, hh * 0.5, -hw * 0.1, hh * 0.3);
    ctx.closePath();
    ctx.fill();
    // 右翼
    ctx.beginPath();
    ctx.moveTo(hw * 0.3, hh * 0.1);
    ctx.quadraticCurveTo(hw * 1.5, hh * 0.3, hw * 0.4, hh * 0.7);
    ctx.quadraticCurveTo(hw * 0.2, hh * 0.5, hw * 0.1, hh * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // 主体机身
    ctx.fillStyle = '#fff8e1';
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, -hh);
    ctx.lineTo(-hw * 0.35, -hh * 0.2);
    ctx.lineTo(-hw * 0.6, hh * 0.15);
    ctx.lineTo(-hw * 0.8, hh * 0.6);
    ctx.lineTo(-hw * 0.25, hh * 0.5);
    ctx.lineTo(0, hh * 0.75);
    ctx.lineTo(hw * 0.25, hh * 0.5);
    ctx.lineTo(hw * 0.8, hh * 0.6);
    ctx.lineTo(hw * 0.6, hh * 0.15);
    ctx.lineTo(hw * 0.35, -hh * 0.2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 金色星纹
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    // 中央星
    const cx = 0, cy = -hh * 0.1;
    for (let i = 0; i < 5; i++) {
      const angle = (i * TAU / 5) - Math.PI / 2;
      const outerR = hw * 0.12;
      const innerR = hw * 0.04;
      const ox = cx + Math.cos(angle) * outerR;
      const oy = cy + Math.sin(angle) * outerR;
      const ix = cx + Math.cos(angle + TAU / 10) * innerR;
      const iy = cy + Math.sin(angle + TAU / 10) * innerR;
      if (i === 0) ctx.moveTo(ox, oy);
      else ctx.lineTo(ox, oy);
      ctx.lineTo(ix, iy);
    }
    ctx.closePath();
    ctx.fill();

    // 驾驶舱
    ctx.fillStyle = '#ffecb3';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(0, -hh * 0.35, hw * 0.13, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 泰坦之怒 - 金色+红色火焰，最大最威猛
  _drawTitan(ctx, time, hw, hh, flicker) {
    // 双引擎火焰
    ctx.fillStyle = '#ff4444';
    ctx.shadowColor = '#ff2200';
    ctx.shadowBlur = 20 * flicker;
    [-hw * 0.4, hw * 0.4].forEach(ex => {
      ctx.beginPath();
      ctx.moveTo(ex - 4, hh * 0.7);
      ctx.lineTo(ex + 4, hh * 0.7);
      ctx.lineTo(ex + 2, hh * 1.2);
      ctx.lineTo(ex - 2, hh * 1.2);
      ctx.closePath();
      ctx.fill();
    });
    ctx.shadowBlur = 0;

    // 金色光环
    ctx.strokeStyle = '#ffd700';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 20;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, hw * 0.95, 0, TAU);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 大型机身
    ctx.fillStyle = '#1a1500';
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.moveTo(0, -hh - 4);
    ctx.lineTo(-hw * 0.35, -hh * 0.5);
    ctx.lineTo(-hw * 0.25, -hh * 0.2);
    ctx.lineTo(-hw * 0.9, hh * 0.15);
    ctx.lineTo(-hw * 0.7, hh * 0.6);
    ctx.lineTo(-hw * 0.2, hh * 0.4);
    ctx.lineTo(0, hh * 0.8);
    ctx.lineTo(hw * 0.2, hh * 0.4);
    ctx.lineTo(hw * 0.7, hh * 0.6);
    ctx.lineTo(hw * 0.9, hh * 0.15);
    ctx.lineTo(hw * 0.25, -hh * 0.2);
    ctx.lineTo(hw * 0.35, -hh * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 内环
    ctx.strokeStyle = '#ff6600';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, -hh * 0.05, hw * 0.5, 0, TAU);
    ctx.stroke();

    // 驾驶舱（金色发光）
    ctx.fillStyle = '#ffe680';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(0, -hh * 0.25, hw * 0.18, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  getBulletSpawnPoints() {
    const points = [];
    const cx = this.x, cy = this.y - this.h / 2;
    switch (this.fireLevel) {
      case 1: points.push([cx, cy]); break;
      case 2: points.push([cx - 6, cy], [cx + 6, cy]); break;
      case 3: points.push([cx, cy - 4], [cx - 8, cy], [cx + 8, cy]); break;
      case 4: points.push([cx, cy - 4], [cx - 10, cy], [cx + 10, cy], [cx - 5, cy + 2], [cx + 5, cy + 2]); break;
      case 5: points.push([cx, cy - 4], [cx - 12, cy], [cx + 12, cy], [cx - 6, cy + 2], [cx + 6, cy + 2]); break;
    }
    return points;
  }

  getDronePositions() {
    if (this.drones === 0) return [];
    const offset = 30;
    if (this.drones === 1) return [[this.x - offset, this.y]];
    return [[this.x - offset, this.y - 10], [this.x + offset, this.y - 10]];
  }
}

// ==================== 10. 敌机 ====================
class Enemy extends Entity {
  constructor() {
    super();
    this.type = 'small';
    this.score = 100;
    this.color = '#ff2d55';
    this.fireTimer = 0;
    this.fireInterval = 2;
    this.movePattern = 'straight';
    this.moveTimer = 0;
    this.moveAmplitude = 0;
    this.startX = 0;
    this.phase = 0;
    this.isBoss = false;
    this.guardAngle = 0;
    this.guardBoss = null;
    this.isSplitter = false;
    this.splitsOnDeath = false;
    this.splitCount = 0;
    this.splitType = 'normal';
    this.zigzagBase = 0;
    this.zigzagAmp = 0;
    this.zigzagFreq = 0;
  }

  reset() {
    this.alive = false;
    this.x = 0; this.y = -50;
    this.vx = 0; this.vy = 0;
    this.hp = 1; this.maxHp = 1;
    this.type = 'small';
    this.score = 100;
    this.color = '#ff2d55';
    this.fireTimer = 0;
    this.fireInterval = 2;
    this.movePattern = 'straight';
    this.moveTimer = 0;
    this.moveAmplitude = 0;
    this.phase = 0;
    this.isBoss = false;
    this.guardAngle = 0;
    this.guardBoss = null;
    this.isSplitter = false;
    this.splitsOnDeath = false;
    this.splitCount = 0;
    this.splitType = 'normal';
    this.zigzagBase = 0;
    this.zigzagAmp = 0;
    this.zigzagFreq = 0;
  }

  init(x, y, difficulty, type, vx, vy) {
    this.type = type;
    this.x = x;
    this.y = y;
    this.difficulty = difficulty;
    this.alive = true;
    this.isBoss = false;
    this.isSplitter = false;
    this.splitsOnDeath = false;
    this.fireTimer = 0;
    this.moveTimer = 0;
    this.movePattern = 'straight';
    this.w = 30; this.h = 30;
    this.score = 100;

    if (type === 'normal') {
      this.radius = 14;
      this.color = '#ff2d55';
      this.damage = 1;
      this.speed = 120;
      this.fireInterval = 2.5 / (1 + (difficulty || 1) * 0.15);
      this.vx = vx || 0;
      this.vy = vy || this.speed;
      this.hp = 2 + this.difficulty * 0.15;
      this.score = 100;
      this.movePattern = Math.random() < 0.3 ? 'sine' : 'straight';
      this.moveAmplitude = rand(30, 80);
      this.phase = rand(0, TAU);
      this.startX = x;
    } else if (type === 'fast') {
      this.radius = 10;
      this.hp = (1) + (difficulty || 1) * 0.15;
      this.damage = 0.5;
      this.speed = 220;
      this.color = '#ffaa00';
      this.fireInterval = 3 / (1 + (difficulty || 1) * 0.15);
      this.vx = vx || (Math.random() - 0.5) * this.speed * 0.3;
      this.vy = vy || this.speed;
      this.movePattern = 'straight';
      this.w = 20; this.h = 20;
      this.score = 150;
    } else if (type === 'tank') {
      this.radius = 22;
      this.hp = 8 + this.difficulty * 0.4;
      this.damage = 2;
      this.speed = 60;
      this.color = '#555';
      this.fireInterval = 3 / (1 + (difficulty || 1) * 0.15);
      this.vx = vx || (Math.random() - 0.5) * this.speed * 0.5;
      this.vy = vy || this.speed * 0.4;
      this.movePattern = 'straight';
      this.w = 44; this.h = 44;
      this.score = 300;
    } else if (type === 'zigzag') {
      this.radius = 12;
      this.hp = (2) + (difficulty || 1) * 0.2;
      this.damage = 0.8;
      this.speed = 180;
      this.color = '#ff6b9d';
      this.fireInterval = 2 / (1 + (difficulty || 1) * 0.15);
      this.vx = vx || (Math.random() - 0.5) * this.speed * 0.3;
      this.vy = vy || this.speed * 0.7;
      this.movePattern = 'zigzag';
      this.zigzagAmp = 80 + Math.random() * 60;
      this.zigzagFreq = 2 + Math.random() * 2;
      this.zigzagBase = x;
      this.w = 24; this.h = 24;
      this.score = 200;
    } else if (type === 'drone') {
      const cfg = CONFIG.ENEMY_TYPES.drone;
      this.w = cfg.w; this.h = cfg.h;
      this.hp = cfg.hp;
      this.damage = 1;
      this.color = cfg.color;
      this.score = cfg.score;
      this.vy = cfg.speed;
      this.vx = 0;
      this.fireInterval = 2.5 / (1 + (difficulty || 1) * 0.15);
      this.movePattern = 'drone';
    }
    this.maxHp = this.hp;
    this.fireTimer = this.fireInterval * 0.5;
    this.moveTimer = 0;
  }

  update(dt, player) {
    this.moveTimer += dt;
    this.fireTimer -= dt;

    switch (this.movePattern) {
      case 'straight':
        this.y += this.vy * dt;
        this.x += this.vx * dt;
        break;
      case 'sine':
        this.y += this.vy * dt;
        this.x = this.startX + Math.sin(this.moveTimer * 3 + this.phase) * this.moveAmplitude;
        break;
      case 'rush':
        if (this.y < CONFIG.HEIGHT * 0.35) {
          this.y += this.vy * dt;
        } else {
          this.y += this.vy * 0.3 * dt;
          this.vy -= 60 * dt;
          if (this.moveTimer > 2.5) {
            this.vy = -CONFIG.ENEMY_TYPES.rusher.speed * this.speedMult;
          }
        }
        break;
      case 'patrol':
        this.x += this.vx * dt;
        if (this.x < 40 || this.x > CONFIG.WIDTH - 40) this.vx *= -1;
        break;
      case 'guard':
        if (this.guardBoss && this.guardBoss.alive) {
          this.guardAngle += 1.5 * dt;
          this.x = this.guardBoss.x + Math.cos(this.guardAngle) * 60;
          this.y = this.guardBoss.y + Math.sin(this.guardAngle) * 60;
        } else {
          this.vy = 200;
          this.y += this.vy * dt;
          this.movePattern = 'straight';
        }
        break;
      case 'drone':
        if (player && player.alive) {
          const angle = Math.atan2(player.y - this.y, player.x - this.x);
          this.vx = Math.cos(angle) * this.vy;
          this.x += this.vx * dt;
          this.y += Math.sin(angle) * this.vy * dt;
        } else {
          this.y += this.vy * dt;
        }
        break;
      case 'zigzag':
        this.y += this.vy * dt;
        this.x = this.zigzagBase + Math.sin(this.y * 0.01 * this.zigzagFreq) * this.zigzagAmp;
        break;
    }

    if (this.y > CONFIG.HEIGHT - 72 - this.h) {
      this.y = CONFIG.HEIGHT - 72 - this.h;
      if (this.movePattern === 'straight' || this.movePattern === 'rush') {
        this.alive = false;
      }
    }
    if (this.x < -30 || this.x > CONFIG.WIDTH + 30) {
      if (this.type === 'patrol') this.vx *= -1;
    }
  }

  canFire() { return this.fireTimer <= 0; }
  resetFireTimer() { this.fireTimer = this.fireInterval; }

  draw(ctx, time) {
    if (!this.alive) return;

    // 分裂敌机专用绘制
    if (this.isSplitter) {
      ctx.save();
      ctx.translate(this.x, this.y);
      // 主体
      ctx.fillStyle = '#5a0000';
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, TAU);
      ctx.fill();
      // 外环
      ctx.strokeStyle = '#8B0000';
      ctx.lineWidth = 3;
      ctx.stroke();
      // 发光核心
      const pulse = Math.sin(time * 5) * 0.3 + 0.7;
      ctx.fillStyle = `rgba(255, 100, 0, ${pulse})`;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 0.4, 0, TAU);
      ctx.fill();
      // 环形装饰
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 0.6, 0, TAU);
      ctx.stroke();
      // 标签
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 8px "Courier New"';
      ctx.textAlign = 'center';
      ctx.fillText('SPLIT', 0, 4);
      ctx.restore();
      return;
    }

    // 坦克类型专用绘制
    if (this.type === 'tank') {
      ctx.save();
      ctx.translate(this.x, this.y);
      // 坦克 - 方形厚重
      ctx.fillStyle = '#555';
      ctx.fillRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 2;
      ctx.strokeRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(-6, -6, 12, 12);
      ctx.restore();
      // 血条
      if (this.hp < this.maxHp) {
        const barW = this.w, barH = 4;
        const bx = this.x - barW / 2, by = this.y - this.radius - 10;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(bx, by, barW, barH);
        ctx.fillStyle = this.color;
        ctx.fillRect(bx, by, barW * (this.hp / this.maxHp), barH);
      }
      return;
    }

    ctx.save();
    ctx.translate(this.x, this.y);

    const hw = this.w / 2, hh = this.h / 2;
    const bodyColor = 'rgba(20,22,35,0.92)';
    const accentColor = this.color;
    const darkColor = 'rgba(10,12,20,0.95)';

    ctx.shadowColor = accentColor;
    ctx.shadowBlur = 10;

    if (this.type === 'normal' || this.type === 'small') {
      this._drawFighter(ctx, hw, hh, bodyColor, accentColor, darkColor, time, false);
    } else if (this.type === 'fast' || this.type === 'rusher') {
      this._drawInterceptor(ctx, hw, hh, bodyColor, accentColor, darkColor, time);
    } else if (this.type === 'zigzag') {
      this._drawZigzag(ctx, hw, hh, bodyColor, accentColor, darkColor, time);
    } else {
      switch (this.type) {
        case 'elite':
          this._drawHeavyFighter(ctx, hw, hh, bodyColor, accentColor, darkColor, time);
          break;
        case 'guard':
          this._drawEscortFighter(ctx, hw, hh, bodyColor, accentColor, darkColor, time);
          break;
        case 'drone':
          this._drawFighter(ctx, hw, hh, bodyColor, accentColor, darkColor, time, true);
          break;
      }
    }

    ctx.shadowBlur = 0;
    ctx.restore();

    // 血条
    if ((this.type === 'elite' || this.type === 'guard') && this.hp < this.maxHp) {
      const barW = this.w, barH = 4;
      const bx = this.x - barW / 2, by = this.y - this.h / 2 - 10;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bx, by, barW, barH);
      ctx.fillStyle = this.color;
      ctx.fillRect(bx, by, barW * (this.hp / this.maxHp), barH);
    }
  }

  // ---- 小兵：轻型战斗机 ----
  _drawFighter(ctx, hw, hh, body, accent, dark, time, hasEngine = true) {
    const engineFlicker = 0.6 + 0.4 * Math.sin(time * 25 + this.x * 0.1);

    // 机身主体
    ctx.fillStyle = body;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -hh);           // 机头
    ctx.lineTo(-hw * 0.25, -hh * 0.5);
    ctx.lineTo(-hw * 0.18, -hh * 0.2);
    ctx.lineTo(-hw, hh * 0.3);    // 左翼尖
    ctx.lineTo(-hw * 0.5, hh * 0.5);
    ctx.lineTo(-hw * 0.2, hh * 0.35);
    ctx.lineTo(0, hh);            // 机尾
    ctx.lineTo(hw * 0.2, hh * 0.35);
    ctx.lineTo(hw * 0.5, hh * 0.5);
    ctx.lineTo(hw, hh * 0.3);     // 右翼尖
    ctx.lineTo(hw * 0.18, -hh * 0.2);
    ctx.lineTo(hw * 0.25, -hh * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 机翼内部线条
    ctx.strokeStyle = accent;
    ctx.lineWidth = 0.8;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.55, hh * 0.4);
    ctx.lineTo(-hw * 0.15, hh * 0.1);
    ctx.moveTo(hw * 0.55, hh * 0.4);
    ctx.lineTo(hw * 0.15, hh * 0.1);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 驾驶舱
    ctx.fillStyle = accent;
    ctx.shadowColor = accent;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.ellipse(0, -hh * 0.25, hw * 0.15, hh * 0.2, 0, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 10;

    // 引擎喷口
    if (hasEngine) {
      ctx.fillStyle = '#ff6633';
      ctx.shadowColor = '#ff4400';
      ctx.shadowBlur = 8 * engineFlicker;
      ctx.beginPath();
      ctx.moveTo(-hw * 0.12, hh * 0.6);
      ctx.lineTo(hw * 0.12, hh * 0.6);
      ctx.lineTo(hw * 0.08, hh * 1.05);
      ctx.lineTo(-hw * 0.08, hh * 1.05);
      ctx.closePath();
      ctx.fill();
    }
  }

  // ---- 突击兵：截击机（后掠翼+双引擎） ----
  _drawInterceptor(ctx, hw, hh, body, accent, dark, time) {
    const flicker = 0.6 + 0.4 * Math.sin(time * 30);

    // 机身
    ctx.fillStyle = body;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -hh);           // 尖锐机头
    ctx.lineTo(-hw * 0.2, -hh * 0.6);
    ctx.lineTo(-hw * 0.15, -hh * 0.3);
    ctx.lineTo(-hw * 0.9, hh * 0.15);  // 后掠左翼
    ctx.lineTo(-hw * 0.35, hh * 0.55);
    ctx.lineTo(-hw * 0.12, hh * 0.25);
    ctx.lineTo(0, hh);            // 机尾
    ctx.lineTo(hw * 0.12, hh * 0.25);
    ctx.lineTo(hw * 0.35, hh * 0.55);
    ctx.lineTo(hw * 0.9, hh * 0.15);   // 后掠右翼
    ctx.lineTo(hw * 0.15, -hh * 0.3);
    ctx.lineTo(hw * 0.2, -hh * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 翼面装甲线
    ctx.strokeStyle = accent;
    ctx.lineWidth = 0.6;
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.6, hh * 0.35);
    ctx.lineTo(-hw * 0.1, hh * 0.05);
    ctx.moveTo(hw * 0.6, hh * 0.35);
    ctx.lineTo(hw * 0.1, hh * 0.05);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 驾驶舱（长条形）
    ctx.fillStyle = accent;
    ctx.shadowColor = accent;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.ellipse(0, -hh * 0.35, hw * 0.12, hh * 0.25, 0, 0, TAU);
    ctx.fill();

    // 双引擎喷口
    ctx.fillStyle = '#ff5533';
    ctx.shadowColor = '#ff3300';
    ctx.shadowBlur = 10 * flicker;
    [-hw * 0.2, hw * 0.2].forEach(ex => {
      ctx.beginPath();
      ctx.moveTo(ex - hw * 0.07, hh * 0.5);
      ctx.lineTo(ex + hw * 0.07, hh * 0.5);
      ctx.lineTo(ex + hw * 0.05, hh * 1.05);
      ctx.lineTo(ex - hw * 0.05, hh * 1.05);
      ctx.closePath();
      ctx.fill();
    });
  }

  // ---- 精英：重型战斗机（双发、宽翼展） ----
  _drawHeavyFighter(ctx, hw, hh, body, accent, dark, time) {
    const flicker = 0.5 + 0.5 * Math.sin(time * 20);

    // 机身
    ctx.fillStyle = body;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -hh);           // 机头
    ctx.lineTo(-hw * 0.3, -hh * 0.65);
    ctx.lineTo(-hw * 0.22, -hh * 0.35);
    ctx.lineTo(-hw * 0.85, -hh * 0.1);  // 前掠翼尖
    ctx.lineTo(-hw, hh * 0.15);   // 左翼展
    ctx.lineTo(-hw * 0.65, hh * 0.55);
    ctx.lineTo(-hw * 0.3, hh * 0.3);
    ctx.lineTo(-hw * 0.15, hh * 0.6);
    ctx.lineTo(0, hh);            // 机尾
    ctx.lineTo(hw * 0.15, hh * 0.6);
    ctx.lineTo(hw * 0.3, hh * 0.3);
    ctx.lineTo(hw * 0.65, hh * 0.55);
    ctx.lineTo(hw, hh * 0.15);    // 右翼展
    ctx.lineTo(hw * 0.85, -hh * 0.1);
    ctx.lineTo(hw * 0.22, -hh * 0.35);
    ctx.lineTo(hw * 0.3, -hh * 0.65);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 装甲板线
    ctx.strokeStyle = accent;
    ctx.lineWidth = 0.8;
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.7, hh * 0.35);
    ctx.lineTo(-hw * 0.15, -hh * 0.1);
    ctx.moveTo(hw * 0.7, hh * 0.35);
    ctx.lineTo(hw * 0.15, -hh * 0.1);
    ctx.moveTo(-hw * 0.5, hh * 0.45);
    ctx.lineTo(hw * 0.5, hh * 0.45);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 驾驶舱
    ctx.fillStyle = accent;
    ctx.shadowColor = accent;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.ellipse(0, -hh * 0.3, hw * 0.16, hh * 0.22, 0, 0, TAU);
    ctx.fill();

    // 双引擎（大型）
    ctx.fillStyle = '#ff5522';
    ctx.shadowColor = '#ff3300';
    ctx.shadowBlur = 14 * flicker;
    [-hw * 0.35, hw * 0.35].forEach(ex => {
      ctx.beginPath();
      ctx.moveTo(ex - hw * 0.1, hh * 0.4);
      ctx.lineTo(ex + hw * 0.1, hh * 0.4);
      ctx.lineTo(ex + hw * 0.07, hh * 1.0);
      ctx.lineTo(ex - hw * 0.07, hh * 1.0);
      ctx.closePath();
      ctx.fill();
    });

    // 中央能量核心
    ctx.fillStyle = accent;
    ctx.shadowColor = accent;
    ctx.shadowBlur = 12;
    const corePulse = Math.sin(time * 5) * 1.5 + 4;
    ctx.beginPath();
    ctx.arc(0, hh * 0.1, corePulse, 0, TAU);
    ctx.fill();
  }

  // ---- 护卫：护航战斗机（流线型） ----
  _drawEscortFighter(ctx, hw, hh, body, accent, dark, time) {
    const flicker = 0.55 + 0.45 * Math.sin(time * 22);

    // 机身
    ctx.fillStyle = body;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(0, -hh);           // 机头
    ctx.lineTo(-hw * 0.3, -hh * 0.55);
    ctx.lineTo(-hw * 0.2, -hh * 0.25);
    ctx.lineTo(-hw * 0.75, hh * 0.15);  // 左翼
    ctx.lineTo(-hw * 0.55, hh * 0.6);
    ctx.lineTo(-hw * 0.15, hh * 0.25);
    ctx.lineTo(0, hh);            // 机尾
    ctx.lineTo(hw * 0.15, hh * 0.25);
    ctx.lineTo(hw * 0.55, hh * 0.6);
    ctx.lineTo(hw * 0.75, hh * 0.15);   // 右翼
    ctx.lineTo(hw * 0.2, -hh * 0.25);
    ctx.lineTo(hw * 0.3, -hh * 0.55);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 翼面条纹
    ctx.strokeStyle = accent;
    ctx.lineWidth = 0.7;
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.5, hh * 0.4);
    ctx.lineTo(-hw * 0.12, hh * 0.0);
    ctx.moveTo(hw * 0.5, hh * 0.4);
    ctx.lineTo(hw * 0.12, hh * 0.0);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 驾驶舱
    ctx.fillStyle = accent;
    ctx.shadowColor = accent;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.ellipse(0, -hh * 0.3, hw * 0.14, hh * 0.22, 0, 0, TAU);
    ctx.fill();

    // 引擎
    ctx.fillStyle = '#ff5522';
    ctx.shadowColor = '#ff3300';
    ctx.shadowBlur = 10 * flicker;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.1, hh * 0.55);
    ctx.lineTo(hw * 0.1, hh * 0.55);
    ctx.lineTo(hw * 0.07, hh * 1.05);
    ctx.lineTo(-hw * 0.07, hh * 1.05);
    ctx.closePath();
    ctx.fill();
  }

  // ---- zigzag：粉色快速蛇形 ----
  _drawZigzag(ctx, hw, hh, body, accent, dark, time) {
    const engineFlicker = 0.6 + 0.4 * Math.sin(time * 25 + this.x * 0.1);
    // 引擎尾焰
    ctx.fillStyle = '#ff6b9d';
    ctx.shadowColor = '#ff6b9d';
    ctx.shadowBlur = 8 * engineFlicker;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.2, hh);
    ctx.lineTo(hw * 0.2, hh);
    ctx.lineTo(hw * 0.1, hh + 8);
    ctx.lineTo(-hw * 0.1, hh + 8);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // 机身
    ctx.fillStyle = body;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -hh);
    ctx.lineTo(-hw * 0.4, -hh * 0.4);
    ctx.lineTo(-hw * 0.5, hh * 0.2);
    ctx.lineTo(-hw * 0.2, hh * 0.4);
    ctx.lineTo(0, hh * 0.2);
    ctx.lineTo(hw * 0.2, hh * 0.4);
    ctx.lineTo(hw * 0.5, hh * 0.2);
    ctx.lineTo(hw * 0.4, -hh * 0.4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 驾驶舱
    ctx.fillStyle = '#ffb6d0';
    ctx.shadowColor = '#ff6b9d';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(0, -hh * 0.15, hw * 0.15, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  initAsSplitter(x, y, difficulty) {
    const cfg = CONFIG.SPLITTER_CONFIG;
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * cfg.speed * 0.5;
    this.vy = cfg.speed * 0.3;
    this.radius = cfg.radius;
    this.w = cfg.radius * 2;
    this.h = cfg.radius * 2;
    this.hp = cfg.hp + cfg.hpScale * (difficulty - 1);
    this.maxHp = this.hp;
    this.damage = cfg.damage;
    this.score = cfg.score;
    this.color = cfg.color;
    this.type = 'splitter';
    this.alive = true;
    this.entered = false;
    this.fireTimer = cfg.fireRate;
    this.fireInterval = cfg.fireRate;
    this.isSplitter = true;
    this.splitsOnDeath = true;
    this.splitCount = cfg.splitCount;
    this.splitType = cfg.splitType;
    this.movePattern = 'straight';
  }
}

// ==================== 11. Boss ====================
class Boss extends Enemy {
  constructor() {
    super();
    this.isBoss = true;
    this.phase = 1;
    this.phaseChangeTimer = 0;
    this.flashTimer = 0;
    this.w = CONFIG.BOSS_W;
    this.h = CONFIG.BOSS_H;
    this.entering = true;
    this.enterTimer = 0;
    this.enterDelay = 0;
    this.bossIndex = 0;
    this.bossCount = 1;
    this.spawnTimer = 0;
    this.spawnInterval = 8; // 每8秒生小兵
  }

  init() {
    this.x = CONFIG.WIDTH / 2;
    this.y = -80;
    this.w = CONFIG.BOSS_W;
    this.h = CONFIG.BOSS_H;
    this.hp = CONFIG.BOSS_HP;
    this.maxHp = CONFIG.BOSS_HP;
    this.score = 5000;
    this.color = '#b44dff';
    this.alive = true;
    this.isBoss = true;
    this.phase = 1;
    this.phaseChangeTimer = 0;
    this.flashTimer = 0;
    this.fireTimer = 1;
    this.fireInterval = 2.5;
    this.entering = true;
    this.enterTimer = 0;
    this.enterDelay = 0;
    this.bossIndex = 0;
    this.bossCount = 1;
    this.vx = 60;
    this.vy = 0;
    this.movePattern = 'boss';
    this.spawnTimer = 0;
    this.spawnInterval = 8;
  }

  update(dt, player) {
    if (this.enterDelay > 0) {
      this.enterDelay -= dt;
      return;
    }
    if (this.entering) {
      this.enterTimer += dt;
      this.y = lerp(-80, 60, Math.min(this.enterTimer / 2, 1));
      if (this.enterTimer >= 2) this.entering = false;
      return;
    }

    // 阶段切换
    const hpRatio = this.hp / this.maxHp;
    const newPhase = hpRatio > 0.66 ? 1 : hpRatio > 0.33 ? 2 : 3;
    if (newPhase !== this.phase) {
      this.phase = newPhase;
      this.flashTimer = 0.5;
      this.fireInterval = this.phase === 3 ? 1.5 : this.phase === 2 ? 2.0 : 2.5;
      this.spawnInterval = this.phase === 3 ? 4 : this.phase === 2 ? 6 : 8;
    }
    if (this.flashTimer > 0) this.flashTimer -= dt;

    // 移动
    this.x += this.vx * dt;
    if (this.x < 80 || this.x > CONFIG.WIDTH - 80) this.vx *= -1;
    this.fireTimer -= dt;

    // 生小兵计时器
    this.spawnTimer -= dt;
  }

  canSpawnMinion() { return this.spawnTimer <= 0 && !this.entering && this.enterDelay <= 0; }
  resetSpawnTimer() { this.spawnTimer = this.spawnInterval; }

  canFire() { return this.fireTimer <= 0 && !this.entering && this.enterDelay <= 0; }
  resetFireTimer() { this.fireTimer = this.fireInterval; }

  draw(ctx, time) {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.x, this.y);

    if (this.flashTimer > 0 && Math.floor(time * 20) % 2 === 0) {
      ctx.globalAlpha = 0.5;
    }

    const color = this.phase === 3 ? '#ff2d55' : this.phase === 2 ? '#ff6b35' : this.color;
    const glowColor = this.phase === 3 ? '#ff4444' : this.phase === 2 ? '#ff8800' : this.color;
    const accent2 = this.phase === 3 ? '#ff6666' : this.phase === 2 ? '#ffaa44' : this.color;
    const bodyColor = 'rgba(12,14,28,0.95)';
    const darkColor = 'rgba(6,8,18,0.97)';

    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 20;

    const shape = this.shape || 'guardian';
    switch (shape) {
      case 'guardian': this._drawGuardian(ctx, color, glowColor, accent2, bodyColor, darkColor, time); break;
      case 'lord':     this._drawLord(ctx, color, glowColor, accent2, bodyColor, darkColor, time); break;
      case 'beast':    this._drawBeast(ctx, color, glowColor, accent2, bodyColor, darkColor, time); break;
      case 'void':     this._drawVoid(ctx, color, glowColor, accent2, bodyColor, darkColor, time); break;
      case 'dragon':   this._drawDragon(ctx, color, glowColor, accent2, bodyColor, darkColor, time); break;
      case 'phoenix':  this._drawPhoenix(ctx, color, glowColor, accent2, bodyColor, darkColor, time); break;
      case 'titan':    this._drawTitan(ctx, color, glowColor, accent2, bodyColor, darkColor, time); break;
      case 'crystal':  this._drawCrystal(ctx, color, glowColor, accent2, bodyColor, darkColor, time); break;
      case 'wraith':   this._drawWraith(ctx, color, glowColor, accent2, bodyColor, darkColor, time); break;
      case 'overlord': this._drawOverlord(ctx, color, glowColor, accent2, bodyColor, darkColor, time); break;
    }

    ctx.shadowBlur = 0;
    ctx.restore();
  }

  _drawCore(ctx, color, accent2, time) {
    const corePulse = Math.sin(time * 3) * 4 + 12;
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, corePulse);
    grad.addColorStop(0, accent2);
    grad.addColorStop(0.5, color);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.shadowColor = color;
    ctx.shadowBlur = 22;
    ctx.beginPath();
    ctx.arc(0, 0, corePulse, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(0, 0, corePulse * 0.4, 0, TAU);
    ctx.fill();
  }

  _drawEngines(ctx, color, time, count = 2) {
    for (let i = 0; i < count; i++) {
      const side = i === 0 ? -45 : 45;
      const flicker = 0.5 + 0.5 * Math.sin(time * 15 + i * 0.5);
      ctx.fillStyle = 'rgba(6,8,18,0.97)';
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(side * 0.85, 10);
      ctx.lineTo(side * 0.95, 25);
      ctx.lineTo(side * 0.9, 45);
      ctx.lineTo(side * 0.7, 55);
      ctx.lineTo(side * 0.5, 58);
      ctx.lineTo(side * 0.3, 50);
      ctx.lineTo(side * 0.3, 25);
      ctx.lineTo(side * 0.45, 10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ff5522';
      ctx.shadowColor = '#ff3300';
      ctx.shadowBlur = 16 * flicker;
      ctx.beginPath();
      ctx.moveTo(side * 0.4, 54);
      ctx.lineTo(side * 0.7, 54);
      ctx.lineTo(side * 0.65, 64);
      ctx.lineTo(side * 0.45, 64);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffcc00';
      ctx.shadowColor = '#ffaa00';
      ctx.shadowBlur = 10 * flicker;
      ctx.beginPath();
      ctx.moveTo(side * 0.48, 56);
      ctx.lineTo(side * 0.62, 56);
      ctx.lineTo(side * 0.6, 62);
      ctx.lineTo(side * 0.5, 62);
      ctx.closePath();
      ctx.fill();
    }
  }

  // 第1关：远古守卫（经典战舰）
  _drawGuardian(ctx, color, glowColor, accent2, bodyColor, darkColor, time) {
    ctx.fillStyle = bodyColor;
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -65);
    ctx.lineTo(-18, -55); ctx.lineTo(-25, -40);
    ctx.lineTo(-40, -15); ctx.lineTo(-55, 0);
    ctx.lineTo(-60, 20); ctx.lineTo(-55, 40);
    ctx.lineTo(-40, 55); ctx.lineTo(-20, 60);
    ctx.lineTo(-15, 63); ctx.lineTo(-8, 65);
    ctx.lineTo(8, 65); ctx.lineTo(15, 63);
    ctx.lineTo(20, 60); ctx.lineTo(40, 55);
    ctx.lineTo(55, 40); ctx.lineTo(60, 20);
    ctx.lineTo(55, 0); ctx.lineTo(40, -15);
    ctx.lineTo(25, -40); ctx.lineTo(18, -55);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.globalAlpha = 0.35;
    [-30, -10, 15, 35, 50].forEach(yy => { ctx.beginPath(); ctx.moveTo(-50, yy); ctx.lineTo(50, yy); ctx.stroke(); });
    ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(0, 60); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = darkColor; ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -50); ctx.lineTo(-12, -42); ctx.lineTo(-15, -30);
    ctx.lineTo(-12, -10); ctx.lineTo(-5, -5); ctx.lineTo(5, -5);
    ctx.lineTo(12, -10); ctx.lineTo(15, -30); ctx.lineTo(12, -42);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = accent2; ctx.shadowColor = accent2; ctx.shadowBlur = 6;
    [-8, 0, 8].forEach(ox => { ctx.beginPath(); ctx.arc(ox, -28, 3, 0, TAU); ctx.fill(); });
    ctx.shadowColor = glowColor; ctx.shadowBlur = 20;
    this._drawEngines(ctx, color, time);
    this._drawCore(ctx, color, accent2, time);
  }

  // 第2关：暗影领主（大翼展战机）
  _drawLord(ctx, color, glowColor, accent2, bodyColor, darkColor, time) {
    ctx.fillStyle = bodyColor;
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -70);
    ctx.lineTo(-15, -58); ctx.lineTo(-22, -45);
    ctx.lineTo(-50, -25); ctx.lineTo(-70, 0);
    ctx.lineTo(-65, 15); ctx.lineTo(-48, 30);
    ctx.lineTo(-25, 45); ctx.lineTo(-15, 55);
    ctx.lineTo(-8, 62); ctx.lineTo(8, 62);
    ctx.lineTo(15, 55); ctx.lineTo(25, 45);
    ctx.lineTo(48, 30); ctx.lineTo(65, 15);
    ctx.lineTo(70, 0); ctx.lineTo(50, -25);
    ctx.lineTo(22, -45); ctx.lineTo(15, -58);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = accent2; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.4;
    [-25, 0, 25].forEach(oy => { ctx.beginPath(); ctx.moveTo(-60, oy); ctx.lineTo(60, oy); ctx.stroke(); });
    ctx.globalAlpha = 1;
    ctx.fillStyle = darkColor; ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -55); ctx.lineTo(-14, -45); ctx.lineTo(-16, -30);
    ctx.lineTo(-10, -10); ctx.lineTo(-4, -2); ctx.lineTo(4, -2);
    ctx.lineTo(10, -10); ctx.lineTo(16, -30); ctx.lineTo(14, -45);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = accent2; ctx.shadowColor = accent2; ctx.shadowBlur = 8;
    [-10, 0, 10].forEach(ox => { ctx.beginPath(); ctx.arc(ox, -28, 4, 0, TAU); ctx.fill(); });
    ctx.shadowColor = glowColor; ctx.shadowBlur = 20;
    this._drawEngines(ctx, color, time);
    this._drawCore(ctx, color, accent2, time);
  }

  // 第3关：深渊巨兽（有机体/触手形态）
  _drawBeast(ctx, color, glowColor, accent2, bodyColor, darkColor, time) {
    ctx.fillStyle = bodyColor;
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -68);
    ctx.bezierCurveTo(-30, -60, -55, -30, -62, 0);
    ctx.bezierCurveTo(-68, 20, -58, 45, -40, 55);
    ctx.lineTo(-20, 62); ctx.lineTo(-8, 58);
    ctx.lineTo(0, 65); ctx.lineTo(8, 58);
    ctx.lineTo(20, 62); ctx.lineTo(40, 55);
    ctx.bezierCurveTo(58, 45, 68, 20, 62, 0);
    ctx.bezierCurveTo(55, -30, 30, -60, 0, -68);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 触手
    const tentacles = [[-55, 10], [-50, 30], [50, 10], [55, 30]];
    tentacles.forEach(([tx, ty]) => {
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.beginPath();
      const wave = Math.sin(time * 4 + tx) * 12;
      ctx.moveTo(tx * 0.7, ty);
      ctx.quadraticCurveTo(tx * 0.9 + wave, ty + 15, tx * 0.8 + wave, ty + 28);
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(tx * 0.8 + wave, ty + 28, 4, 0, TAU); ctx.fill();
    });
    // 眼球
    ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12;
    [-12, 12].forEach(ox => { ctx.beginPath(); ctx.arc(ox, -25, 8, 0, TAU); ctx.fill(); });
    ctx.fillStyle = darkColor; ctx.shadowBlur = 0;
    [-12, 12].forEach(ox => { ctx.beginPath(); ctx.arc(ox, -25, 4, 0, TAU); ctx.fill(); });
    ctx.shadowColor = glowColor; ctx.shadowBlur = 20;
    this._drawCore(ctx, color, accent2, time);
  }

  // 第4关：虚空霸主（六边形几何体）
  _drawVoid(ctx, color, glowColor, accent2, bodyColor, darkColor, time) {
    const r = 60;
    ctx.fillStyle = bodyColor;
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = TAU * i / 6 - Math.PI / 2;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 内层六边形
    ctx.strokeStyle = accent2; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.5;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = TAU * i / 6 - Math.PI / 2;
      const x = Math.cos(a) * 38, y = Math.sin(a) * 38;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.stroke();
    ctx.globalAlpha = 1;
    // 外围旋转环
    const rotAngle = time * 0.8;
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 52, rotAngle, rotAngle + TAU * 0.65);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, 52, rotAngle + Math.PI, rotAngle + Math.PI + TAU * 0.65);
    ctx.stroke();
    // 角点
    ctx.fillStyle = accent2; ctx.shadowColor = accent2; ctx.shadowBlur = 10;
    for (let i = 0; i < 6; i++) {
      const a = TAU * i / 6 - Math.PI / 2;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 5, 0, TAU); ctx.fill();
    }
    ctx.shadowColor = glowColor; ctx.shadowBlur = 20;
    this._drawCore(ctx, color, accent2, time);
  }

  // 第5关：终焉之龙（龙头+双翼）
  _drawDragon(ctx, color, glowColor, accent2, bodyColor, darkColor, time) {
    ctx.fillStyle = bodyColor;
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    // 龙头
    ctx.beginPath();
    ctx.moveTo(0, -75);
    ctx.bezierCurveTo(-20, -70, -35, -50, -38, -25);
    ctx.lineTo(-42, -10); ctx.lineTo(-35, 0);
    ctx.lineTo(-30, 15); ctx.lineTo(-22, 25);
    ctx.lineTo(-15, 35); ctx.lineTo(-8, 42);
    ctx.lineTo(0, 48); ctx.lineTo(8, 42);
    ctx.lineTo(15, 35); ctx.lineTo(22, 25);
    ctx.lineTo(30, 15); ctx.lineTo(35, 0);
    ctx.lineTo(42, -10); ctx.lineTo(38, -25);
    ctx.bezierCurveTo(35, -50, 20, -70, 0, -75);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 龙角
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    [-18, 18].forEach(side => {
      ctx.beginPath();
      ctx.moveTo(side * 1.5, -55);
      ctx.lineTo(side * 1.3, -80);
      ctx.lineTo(side * 0.6, -65);
      ctx.stroke();
    });
    // 龙眼
    ctx.fillStyle = '#ff4444'; ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 14;
    [-14, 14].forEach(ox => { ctx.beginPath(); ctx.arc(ox, -30, 6, 0, TAU); ctx.fill(); });
    ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#ffffff';
    [-14, 14].forEach(ox => { ctx.beginPath(); ctx.arc(ox, -30, 2.5, 0, TAU); ctx.fill(); });
    ctx.shadowColor = glowColor; ctx.shadowBlur = 20;
    // 龙翼
    const wingFlap = Math.sin(time * 3) * 5;
    [-1, 1].forEach(side => {
      ctx.fillStyle = 'rgba(12,14,28,0.8)';
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(side * 28, -10 + wingFlap);
      ctx.lineTo(side * 55, -45 + wingFlap);
      ctx.lineTo(side * 62, -20 + wingFlap * 0.5);
      ctx.lineTo(side * 30, 0 + wingFlap * 0.3);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    });
    this._drawCore(ctx, color, accent2, time);
  }

  // 第6关：烈焰凤凰（鸟形+火焰羽翼）
  _drawPhoenix(ctx, color, glowColor, accent2, bodyColor, darkColor, time) {
    ctx.fillStyle = bodyColor; ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -70);
    ctx.bezierCurveTo(-18, -65, -30, -40, -25, -15);
    ctx.lineTo(-35, -5); ctx.lineTo(-30, 15);
    ctx.lineTo(-20, 30); ctx.lineTo(-10, 45);
    ctx.lineTo(0, 55); ctx.lineTo(10, 45);
    ctx.lineTo(20, 30); ctx.lineTo(30, 15);
    ctx.lineTo(35, -5); ctx.lineTo(25, -15);
    ctx.bezierCurveTo(30, -40, 18, -65, 0, -70);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 火焰羽翼 (左右)
    const wingFlame = Math.sin(time * 5) * 8;
    [-1, 1].forEach(side => {
      ctx.fillStyle = 'rgba(255,102,0,0.3)'; ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(side * 20, wingFlame - 20);
      ctx.lineTo(side * 50, wingFlame - 45);
      ctx.lineTo(side * 55, wingFlame);
      ctx.lineTo(side * 45, wingFlame + 20);
      ctx.lineTo(side * 25, wingFlame + 5);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // 火焰粒子
      for (let i = 0; i < 3; i++) {
        const fx = side * 40 + Math.sin(time * 8 + i) * 10;
        const fy = wingFlame + i * 12 - 30;
        ctx.fillStyle = '#ffcc00'; ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(fx, fy, 3, 0, TAU); ctx.fill();
      }
    });
    ctx.fillStyle = '#ff4444'; ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 12;
    [-8, 8].forEach(ox => { ctx.beginPath(); ctx.arc(ox, -25, 5, 0, TAU); ctx.fill(); });
    ctx.shadowColor = glowColor; ctx.shadowBlur = 20;
    this._drawCore(ctx, color, accent2, time);
  }

  // 第7关：泰坦巨像（人形机甲）
  _drawTitan(ctx, color, glowColor, accent2, bodyColor, darkColor, time) {
    ctx.fillStyle = bodyColor; ctx.strokeStyle = color; ctx.lineWidth = 3;
    // 头部
    ctx.beginPath(); ctx.arc(0, -50, 16, 0, TAU); ctx.fill(); ctx.stroke();
    // 身体
    ctx.beginPath();
    ctx.moveTo(-20, -35); ctx.lineTo(-30, -10); ctx.lineTo(-25, 20);
    ctx.lineTo(-15, 45); ctx.lineTo(-5, 55); ctx.lineTo(5, 55);
    ctx.lineTo(15, 45); ctx.lineTo(25, 20); ctx.lineTo(30, -10);
    ctx.lineTo(20, -35); ctx.closePath(); ctx.fill(); ctx.stroke();
    // 肩甲
    [-35, 35].forEach(side => {
      ctx.fillStyle = darkColor; ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(side * 0.9, -20, 12, 0, TAU); ctx.fill(); ctx.stroke();
    });
    // 手臂
    [-28, 28].forEach(side => {
      ctx.strokeStyle = color; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(side * 0.9, -10); ctx.lineTo(side * 1.8, 25); ctx.stroke();
      ctx.fillStyle = darkColor; ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(side * 1.8, 25, 8, 0, TAU); ctx.fill(); ctx.stroke();
    });
    ctx.fillStyle = accent2; ctx.shadowColor = accent2; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(-6, -52, 3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -52, 3, 0, TAU); ctx.fill();
    ctx.shadowColor = glowColor; ctx.shadowBlur = 20;
    this._drawCore(ctx, color, accent2, time);
  }

  // 第8关：水晶女王（钻石晶体）
  _drawCrystal(ctx, color, glowColor, accent2, bodyColor, darkColor, time) {
    ctx.fillStyle = bodyColor; ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -70); ctx.lineTo(-20, -45); ctx.lineTo(-35, -20);
    ctx.lineTo(-45, 10); ctx.lineTo(-35, 35); ctx.lineTo(-20, 50);
    ctx.lineTo(0, 60); ctx.lineTo(20, 50); ctx.lineTo(35, 35);
    ctx.lineTo(45, 10); ctx.lineTo(35, -20); ctx.lineTo(20, -45);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 内层晶体反射
    ctx.strokeStyle = accent2; ctx.lineWidth = 1; ctx.globalAlpha = 0.4;
    ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(0, 50); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-30, -10); ctx.lineTo(30, -10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-20, 25); ctx.lineTo(20, 25); ctx.stroke();
    ctx.globalAlpha = 1;
    // 棱角光点
    const points = [[0, -70], [-35, -20], [-45, 10], [0, 60], [35, -20], [45, 10]];
    points.forEach(([px, py]) => {
      const sparkle = 0.5 + 0.5 * Math.sin(time * 4 + px);
      ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 10 * sparkle;
      ctx.beginPath(); ctx.arc(px, py, 3, 0, TAU); ctx.fill();
    });
