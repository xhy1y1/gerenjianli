  _getBossIntroButtonRect() {
    const pw = 440, ph = 260;
    const py = (CONFIG.HEIGHT - ph) / 2;
    const btnW = 220, btnH = 44;
    const btnX = (CONFIG.WIDTH - btnW) / 2;
    return { x: btnX, y: py + 190, w: btnW, h: btnH };
  }

  _getBriefingConfirmRect() {
    const bx = (CONFIG.WIDTH - 200) / 2;
    return { x: bx, y: 294, w: 200, h: 50 };
  }

  _drawBossBriefing(ctx) {
    const stageCfg = this.inventory ? this.inventory.getBossStageConfig() : CONFIG.BOSS_STAGES[0];
    if (!stageCfg) return;

    // 半透明背景
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

    const iy = 48;
    // 标题
    ctx.fillStyle = stageCfg.color;
    ctx.font = 'bold 22px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(`第 ${stageCfg.id} 关 — ${stageCfg.name}`, CONFIG.WIDTH / 2, iy);
    ctx.textAlign = 'left';

    // 攻击模式介绍
    const attacks = this._getBossAttackDesc(stageCfg);
    if (attacks.length > 0) {
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 14px "Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.fillText('⚔  攻击模式', CONFIG.WIDTH / 2, iy + 27);
      ctx.textAlign = 'left';

      attacks.forEach((a, i) => {
        ctx.fillStyle = a.color || '#ccc';
        ctx.font = '13px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.fillText(`${a.icon} ${a.text}`, CONFIG.WIDTH / 2, iy + 45 + i * 17);
      });
    }

    // 基本信息
    const infoY = iy + 45 + attacks.length * 17 + 12;
    ctx.fillStyle = '#aaa';
    ctx.font = '12px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(`HP: ${stageCfg.hp.toLocaleString()}  |  BOSS数量: ${stageCfg.bosses || 1}`, CONFIG.WIDTH / 2, infoY);

    // 奖励
    const baseCoins = stageCfg.id * 50;
    const baseParts = stageCfg.id * 3;
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 13px "Microsoft YaHei"';
    ctx.fillText(`通关奖励: 💰 +${baseCoins * 3}金币  🔩 +${baseParts * 3}零件 (3星)`, CONFIG.WIDTH / 2, infoY + 15);
    ctx.fillStyle = '#aaa';
    ctx.font = '11px "Microsoft YaHei"';
    ctx.fillText(`1星: 💰${baseCoins} 🔩${baseParts}  |  2星: 💰${baseCoins * 2} 🔩${baseParts * 2}  |  3星: 💰${baseCoins * 3} 🔩${baseParts * 3}`, CONFIG.WIDTH / 2, infoY + 29);

    // 确认按钮
    const btn = this._getBriefingConfirmRect();
    const pulse = Math.sin(performance.now() * 0.003) * 0.4 + 0.6;
    // 按钮外发光
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 20 * pulse;
    ctx.fillStyle = 'rgba(0,212,255,0.15)';
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 2;
    this._roundRect(ctx, btn.x, btn.y, btn.w, btn.h, 8);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    // 按钮文字
    ctx.fillStyle = '#00d4ff';
    ctx.font = 'bold 18px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('确认挑战', CONFIG.WIDTH / 2, btn.y + 33);
    ctx.textAlign = 'left';

    // 提示
    ctx.fillStyle = 'rgba(224,232,255,0.5)';
    ctx.font = '11px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('点击按钮 或 按 ENTER 开始战斗', CONFIG.WIDTH / 2, btn.y + btn.h + 10);
    ctx.textAlign = 'left';
  }

  _getBossAttackDesc(stageCfg) {
    const id = stageCfg.id;
    const bosses = stageCfg.bosses || 1;
    const attacks = [];

    // 基础攻击（所有BOSS都有）
    if (id <= 5) {
      attacks.push({ icon: '🔵', text: '扇形弹幕（3-5颗子弹）', color: '#00d4ff' });
      attacks.push({ icon: '🟡', text: '追踪弹（锁定玩家位置）', color: '#ffd700' });
    } else if (id <= 10) {
      attacks.push({ icon: '🔵', text: '扇形弹幕（5-7颗子弹）', color: '#00d4ff' });
      attacks.push({ icon: '🟡', text: '追踪弹 ×2', color: '#ffd700' });
      if (id >= 7) attacks.push({ icon: '🟣', text: '激光扫射', color: '#b44dff' });
    } else if (id <= 15) {
      attacks.push({ icon: '🔴', text: '密集弹幕（7-10颗子弹）', color: '#ff4444' });
      attacks.push({ icon: '🟡', text: '追踪弹 ×3', color: '#ffd700' });
      attacks.push({ icon: '🟣', text: '激光扫射 + 散射弹', color: '#b44dff' });
    } else if (id <= 20) {
      attacks.push({ icon: '🔴', text: '密集弹幕（10-12颗子弹）', color: '#ff4444' });
      attacks.push({ icon: '🟡', text: '追踪弹风暴', color: '#ffd700' });
      attacks.push({ icon: '🟣', text: '激光交叉扫射', color: '#b44dff' });
      if (bosses >= 2) attacks.push({ icon: '👥', text: '双BOSS同场攻击', color: '#ff8c00' });
    } else if (id <= 25) {
      attacks.push({ icon: '🔴', text: '超密集弹幕（12-15颗子弹）', color: '#ff4444' });
      attacks.push({ icon: '🟡', text: '追踪弹弹幕', color: '#ffd700' });
      attacks.push({ icon: '🟣', text: '激光网 + 交叉扫射', color: '#b44dff' });
      if (bosses >= 3) attacks.push({ icon: '👥', text: '三BOSS合击', color: '#ff8c00' });
    } else {
      attacks.push({ icon: '💀', text: '终极弹幕（15-20颗子弹）', color: '#ff0000' });
      attacks.push({ icon: '🔥', text: '追踪弹海', color: '#ff6600' });
      attacks.push({ icon: '🟣', text: '全屏激光网', color: '#b44dff' });
      attacks.push({ icon: '💥', text: '弹幕+激光+追踪混合攻击', color: '#ffd700' });
    }

    // BOSS生小兵
    if (id >= 3) {
      attacks.push({ icon: '🛸', text: `每${id >= 15 ? '4-5' : '6-8'}秒生成小飞机`, color: '#00ff88' });
    }

    return attacks;
  }

  _drawBossArrival(ctx, time) {
    const t = this._bossArrivalTimer;
    const stageCfg = this.inventory ? this.inventory.getBossStageConfig() : CONFIG.BOSS_STAGES[0];
    
    // 第一阶段：红色闪烁警告 (0-0.5秒)
    if (t < 0.5) {
      const flashAlpha = Math.abs(Math.sin(t * 20)) * 0.6;
      ctx.fillStyle = `rgba(255, 0, 0, ${flashAlpha})`;
      ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
    }
    
    // 第二阶段：警告文字 + 屏幕震动 (0.5-2秒)
    if (t >= 0.3 && t < 2.0) {
      const alpha = Math.min(1, (t - 0.3) / 0.3);
      const pulse = Math.sin(time * 8) * 0.3 + 0.7;
      
      // 警告背景条纹
      ctx.fillStyle = `rgba(255, 0, 0, ${alpha * 0.15})`;
      ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
      
      // 顶部和底部警示条
      ctx.fillStyle = `rgba(255, 50, 50, ${alpha * 0.5 * pulse})`;
      ctx.fillRect(0, 0, CONFIG.WIDTH, 4);
      ctx.fillRect(0, CONFIG.HEIGHT - 4, CONFIG.WIDTH, 4);
      
      // 警告文字
      ctx.fillStyle = `rgba(255, 50, 50, ${alpha})`;
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 30 * pulse;
      ctx.font = 'bold 28px "Courier New"';
      ctx.textAlign = 'center';
      ctx.fillText('⚠ WARNING ⚠', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 - 18);
      
      // Boss名称
      ctx.fillStyle = stageCfg.color;
      ctx.shadowColor = stageCfg.color;
      ctx.shadowBlur = 20 * pulse;
      ctx.font = 'bold 20px "Microsoft YaHei"';
      ctx.fillText(stageCfg.name + ' 降临！', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 + 12);
      
      // 多Boss提示
      if (stageCfg.bosses > 1) {
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 14px "Microsoft YaHei"';
        ctx.fillText(`×${stageCfg.bosses}  BOSS`, CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 + 30);
      }
      
      ctx.shadowBlur = 0;
      ctx.textAlign = 'left';
    }
    
    // 阶段三：淡出 (2-2.5秒)
    if (t >= 2.0) {
      const fadeAlpha = Math.max(0, (2.5 - t) / 0.5);
      ctx.fillStyle = `rgba(255, 0, 0, ${fadeAlpha * 0.1})`;
      ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
    }
  }

  // === 退出确认弹窗 ===
  _drawQuitConfirm(ctx) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

    const pw = 360, ph = 140;
    const px = (CONFIG.WIDTH - pw) / 2, py = (CONFIG.HEIGHT - ph) / 2;
    ctx.fillStyle = 'rgba(10,12,25,0.95)';
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 10;
    this._roundRect(ctx, px, py, pw, ph, 12);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 20px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('退出确认', CONFIG.WIDTH / 2, py + 28);

    ctx.fillStyle = '#e0e8ff';
    ctx.font = '13px "Microsoft YaHei"';
    ctx.fillText('确定要退出本局游戏吗？', CONFIG.WIDTH / 2, py + 52);

    ctx.fillStyle = '#ffaa00';
    ctx.font = 'bold 12px "Microsoft YaHei"';
    ctx.fillText('本局获得的物资将全部丢失！', CONFIG.WIDTH / 2, py + 68);

    const now = performance.now() / 1000;
    const pulse = Math.sin(now * 3) * 0.3 + 0.7;

    // 继续游戏按钮（左侧）
    const contBtnW = 140, contBtnH = 38;
    const contBtnX = px + 20, contBtnY = py + 90;
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 8 * pulse;
    ctx.fillStyle = 'rgba(0,255,204,0.1)';
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    this._roundRect(ctx, contBtnX, contBtnY, contBtnW, contBtnH, 8);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#00ffcc';
    ctx.fillText('继续游戏', contBtnX + contBtnW / 2, contBtnY + 27);

    // 放弃退出按钮（右侧）
    const quitBtnW = 140, quitBtnH = 38;
    const quitBtnX = px + 200, quitBtnY = py + 90;
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 8 * pulse;
    ctx.fillStyle = 'rgba(255,68,68,0.1)';
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth = 2;
    this._roundRect(ctx, quitBtnX, quitBtnY, quitBtnW, quitBtnH, 8);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff4444';
    ctx.fillText('放弃退出', quitBtnX + quitBtnW / 2, quitBtnY + 27);

    ctx.textAlign = 'left';
  }

  _getQuitContinueRect() {
    const pw = 360, ph = 140;
    const px = (CONFIG.WIDTH - pw) / 2;
    const py = (CONFIG.HEIGHT - ph) / 2;
    return { x: px + 20, y: py + 90, w: 140, h: 38 };
  }

  _getQuitAbandonRect() {
    const pw = 360, ph = 140;
    const px = (CONFIG.WIDTH - pw) / 2;
    const py = (CONFIG.HEIGHT - ph) / 2;
    return { x: px + 200, y: py + 90, w: 140, h: 38 };
  }

  // === 暂停菜单 ===
  _drawPauseMenu(ctx) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

    const pw = 280, ph = 160;
    const px = (CONFIG.WIDTH - pw) / 2, py = (CONFIG.HEIGHT - ph) / 2;
    ctx.fillStyle = 'rgba(10,12,25,0.95)';
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 15;
    this._roundRect(ctx, px, py, pw, ph, 12);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#00d4ff';
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 10;
    ctx.font = 'bold 24px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('暂停', CONFIG.WIDTH / 2, py + 35);
    ctx.shadowBlur = 0;

    const now = performance.now() / 1000;
    const pulse = Math.sin(now * 3) * 0.3 + 0.7;

    // 继续按钮
    const resBtnW = 180, resBtnH = 36;
    const resBtnX = (CONFIG.WIDTH - resBtnW) / 2, resBtnY = py + 65;
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 10 * pulse;
    ctx.fillStyle = 'rgba(0,212,255,0.1)';
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 2;
    this._roundRect(ctx, resBtnX, resBtnY, resBtnW, resBtnH, 8);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#00d4ff';
    ctx.font = 'bold 16px "Microsoft YaHei"';
    ctx.fillText('继续游戏', CONFIG.WIDTH / 2, resBtnY + 24);

    // 退出按钮
    const quitBtnW = 140, quitBtnH = 32;
    const quitBtnX = (CONFIG.WIDTH - quitBtnW) / 2, quitBtnY = py + 115;
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 8 * pulse;
    ctx.fillStyle = 'rgba(255,68,68,0.1)';
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth = 1.5;
    this._roundRect(ctx, quitBtnX, quitBtnY, quitBtnW, quitBtnH, 8);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 14px "Microsoft YaHei"';
    ctx.fillText('退出游戏', CONFIG.WIDTH / 2, quitBtnY + 22);

    ctx.textAlign = 'left';
  }

  _getPauseResumeRect() {
    const pw = 280, ph = 160;
    const py = (CONFIG.HEIGHT - ph) / 2;
    const resBtnW = 180, resBtnH = 36;
    const resBtnX = (CONFIG.WIDTH - resBtnW) / 2;
    return { x: resBtnX, y: py + 65, w: resBtnW, h: resBtnH };
  }

  _getPauseQuitRect() {
    const pw = 280, ph = 160;
    const py = (CONFIG.HEIGHT - ph) / 2;
    const quitBtnW = 140, quitBtnH = 32;
    const quitBtnX = (CONFIG.WIDTH - quitBtnW) / 2;
    return { x: quitBtnX, y: py + 115, w: quitBtnW, h: quitBtnH };
  }

  // === 下一关按钮 ===
  _getNextStageButtonRect() {
    const bw = 220, bh = 44;
    const bx = (CONFIG.WIDTH - bw) / 2;
    const by = 330;
    return { x: bx, y: by, w: bw, h: bh };
  }

  _drawNextStageButton(ctx) {
    const r = this._getNextStageButtonRect();
    const now = performance.now() / 1000;
    const pulse = Math.sin(now * 3) * 0.3 + 0.7;
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 15 * pulse;
    ctx.fillStyle = 'rgba(255,215,0,0.15)';
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    this._roundRect(ctx, r.x, r.y, r.w, r.h, 8);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 18px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('下一关', r.x + r.w / 2, r.y + 29);
    ctx.textAlign = 'left';
  }

  _getReturnButtonSmallRect() {
    const bw = 160, bh = 36;
    const bx = (CONFIG.WIDTH - bw) / 2;
    const by = 390;
    return { x: bx, y: by, w: bw, h: bh };
  }

  _drawReturnButtonSmall(ctx) {
    const r = this._getReturnButtonSmallRect();
    const now = performance.now() / 1000;
    const pulse = Math.sin(now * 3) * 0.3 + 0.7;
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 10 * pulse;
    ctx.fillStyle = 'rgba(0,212,255,0.1)';
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 1.5;
    this._roundRect(ctx, r.x, r.y, r.w, r.h, 8);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#00d4ff';
    ctx.font = 'bold 16px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('返回主界面', r.x + r.w / 2, r.y + 25);
    ctx.textAlign = 'left';
  }

  _roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
}

class StartScene {
  constructor() {
    this.background = new Background();
    this.titleAlpha = 0;
    this.titleDir = 1;
    this.selectedMode = 0;
    this.modes = [
      { id: 'endless', name: '无尽模式', desc: '存活越久分数越高，挑战极限', icon: '∞', color: '#00d4ff' },
      { id: 'timed',   name: '限时挑战', desc: '2分钟内尽可能获得高分', icon: '⏱', color: '#ffaa00' },
      { id: 'boss',    name: 'Boss 关卡', desc: '挑战关卡 Boss，解锁技能', icon: '👾', color: '#b44dff' },
    ];
    this.prevUp = false;
    this.prevDown = false;
    this.startClicked = false;
    this.goToArmory = false;
    this.confirmMode = null;        // 确认弹窗：null | 'endless' | 'timed'
    this._confirmEnterBlocked = false;

    this.startY = 110;
    this.boxH = 65;
    this.boxW = 500;
    this.boxX = 150;
    this.gap = 10;
  }

  _getArmoryBtnY() {
    return this.startY + this.modes.length * (this.boxH + this.gap) + 10;
  }

  _getStartBtnY() {
    return this._getArmoryBtnY() + 48;
  }

  _getInventory() {
    if (!this._cachedInventory) this._cachedInventory = new Inventory();
    return this._cachedInventory;
  }

  _drawRankBar(ctx) {
    const inventory = this._getInventory();
    if (!inventory) return;
    const rank = inventory.getRank();
    const rankIdx = inventory.getRankIndex();
    const nextRank = CONFIG.RANKS[Math.min(rankIdx + 1, CONFIG.RANKS.length - 1)];
    const isMax = rankIdx >= CONFIG.RANKS.length - 1;
    const stars = parseInt(rank.id.slice(-1)) || 1;

    const rankY = 5;
    const rx = 10, rw = 200;

    // Background
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    this._roundRect(ctx, rx, rankY, rw, 18, 4);
    ctx.fill();
    ctx.stroke();

    // Rank name + stars
    ctx.fillStyle = rank.color;
    ctx.font = '10px "Courier New"';
    ctx.textAlign = 'left';
    ctx.fillText(rank.name, rx + 6, rankY + 10);

    // Stars
    ctx.fillStyle = '#ffd700';
    ctx.font = '8px Arial';
    let starStr = '';
    for (let s = 0; s < stars; s++) starStr += '★';
    for (let s = stars; s < 3; s++) starStr += '☆';
    ctx.fillText(starStr, rx + 6, rankY + 17);

    // Progress bar
    const progX = rx + 80, progW = 115, progH = 3;
    const progress = isMax ? 1 : Math.min(1, (inventory.rankScore - rank.threshold) / (nextRank.threshold - rank.threshold));
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(progX, rankY + 14, progW, progH);
    ctx.fillStyle = rank.color;
    ctx.fillRect(progX, rankY + 14, progW * progress, progH);

    // Score text
    if (!isMax) {
      ctx.fillStyle = '#aaa';
      ctx.font = '8px "Courier New"';
      ctx.textAlign = 'right';
      ctx.fillText(`${inventory.rankScore} / ${nextRank.threshold}`, rx + rw - 4, rankY + 10);
      ctx.textAlign = 'left';
    }
  }

  update(dt, input, scaleRatio = 1) {
    this.background.update(dt);
    this.titleAlpha += 0.8 * dt * this.titleDir;
    if (this.titleAlpha >= 1) this.titleDir = -1;
    if (this.titleAlpha <= 0.3) this.titleDir = 1;

    // 键盘选择
    const up = input.isUp();
    const down = input.isDown_();
    if (up && !this.prevUp) { this.selectedMode = (this.selectedMode - 1 + this.modes.length) % this.modes.length; }
    if (down && !this.prevDown) { this.selectedMode = (this.selectedMode + 1) % this.modes.length; }
    this.prevUp = up;
    this.prevDown = down;

    // 确认弹窗鼠标点击
    if (this.confirmMode) {
      const click = input.getClick();
      if (click) {
        const cx = click.x * scaleRatio;
        const cy = click.y * scaleRatio;
        const W = CONFIG.WIDTH, H = CONFIG.HEIGHT;
        const py = (H - 260) / 2;
        const btnW = 220, btnH = 46, btnX = W / 2 - btnW / 2;
        const startBtnY = py + 158;
        const bBtnW = 140, bBtnH = 36, bBtnX = W / 2 - bBtnW / 2;
        const backBtnY = py + 214;
        // 点击"开始游戏"
        if (cx >= btnX && cx <= btnX + btnW && cy >= startBtnY && cy <= startBtnY + btnH) {
          input.consumeClick();
          this.startClicked = true;
          this.confirmMode = null;
          return;
        }
        // 点击"返回"
        if (cx >= bBtnX && cx <= bBtnX + bBtnW && cy >= backBtnY && cy <= backBtnY + bBtnH) {
          input.consumeClick();
          this.confirmMode = null;
          return;
        }
      }
      return;
    }

    // 鼠标点击选择
    const click = input.getClick();
    if (click && !this.startClicked) {
      // 转换坐标
      const cx = click.x * scaleRatio;
      const cy = click.y * scaleRatio;
      input.consumeClick();

      // 点击军备库按钮
      const armoryBtnY = this._getArmoryBtnY();
      const armoryBoxW = 500;
      const armoryBoxX = 150;
      const armoryBoxH = 40;
      if (cx >= armoryBoxX && cx <= armoryBoxX + armoryBoxW && cy >= armoryBtnY && cy <= armoryBtnY + armoryBoxH) {
        this.goToArmory = true;
        return;
      }

      // 点击模式卡片
      for (let i = 0; i < this.modes.length; i++) {
        const by = this.startY + i * (this.boxH + this.gap);
        if (cx >= this.boxX && cx <= this.boxX + this.boxW && cy >= by && cy <= by + this.boxH) {
          this.selectedMode = i;
          const mode = this.modes[i];
          if (mode.id === 'boss') {
            this.startClicked = true;  // Boss模式直接进入关卡选择
          } else {
            this.confirmMode = mode.id;  // 无尽/限时模式弹出确认弹窗
          }
          break;
        }
      }
    }
  }

  getHoverType(mx, my) {
    if (this.confirmMode) {
      const W = CONFIG.WIDTH, H = CONFIG.HEIGHT;
      const py = (H - 260) / 2;
      const btnW = 220, btnH = 46, btnX = W / 2 - btnW / 2;
      if (mx >= btnX && mx <= btnX + btnW && my >= py + 158 && my <= py + 158 + btnH) return 'pointer';
      const bBtnW = 140, bBtnH = 36, bBtnX = W / 2 - bBtnW / 2;
      if (mx >= bBtnX && mx <= bBtnX + bBtnW && my >= py + 214 && my <= py + 214 + bBtnH) return 'pointer';
      return 'default';
    }
    for (let i = 0; i < this.modes.length; i++) {
      const by = this.startY + i * (this.boxH + this.gap);
      if (mx >= this.boxX && mx <= this.boxX + this.boxW && my >= by && my <= by + this.boxH) {
        return 'pointer';
      }
    }
    const armoryBtnY = this._getArmoryBtnY();
    const armoryBoxW = 500;
    const armoryBoxX = 150;
    const armoryBoxH = 40;
    if (mx >= armoryBoxX && mx <= armoryBoxX + armoryBoxW && my >= armoryBtnY && my <= armoryBtnY + armoryBoxH) return 'pointer';
    const btnY = this._getStartBtnY();
    const btnH = 80;
    if (my >= btnY && my <= btnY + btnH) return 'pointer';
    return 'crosshair';
  }

  draw(ctx, time) {
    this.background.draw(ctx, time);

    // 标题
    ctx.fillStyle = '#00d4ff';
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 25;
    ctx.font = 'bold 28px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('星际防御', CONFIG.WIDTH / 2, 45);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#b44dff';
    ctx.shadowColor = '#b44dff';
    ctx.shadowBlur = 15;
    ctx.font = 'bold 14px "Microsoft YaHei"';
    ctx.fillText('飞机大战', CONFIG.WIDTH / 2, 68);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#888';
    ctx.font = '10px "Courier New"';
    ctx.fillText('STAR DEFENSE', CONFIG.WIDTH / 2, 84);

    // 模式选择
    const startY = this.startY;
    const boxH = this.boxH;
    const boxW = this.boxW;
    const boxX = this.boxX;
    const gap = this.gap;

    this.modes.forEach((mode, i) => {
      const by = startY + i * (boxH + gap);
      const isSelected = i === this.selectedMode;

      // 外框
      ctx.strokeStyle = isSelected ? mode.color : '#333';
      ctx.shadowColor = isSelected ? mode.color : 'transparent';
      ctx.shadowBlur = isSelected ? 12 : 0;
      ctx.lineWidth = isSelected ? 2.5 : 1;
      ctx.fillStyle = isSelected ? `rgba(20,22,40,0.9)` : `rgba(10,12,20,0.6)`;
      this._roundRect(ctx, boxX, by, boxW, boxH, 10);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 图标
      ctx.fillStyle = mode.color;
      ctx.font = 'bold 24px "Courier New"';
      ctx.textAlign = 'left';
      ctx.fillText(mode.icon, boxX + 24, by + 38);

      // 模式名
      ctx.fillStyle = isSelected ? mode.color : '#aaa';
      ctx.font = 'bold 16px "Microsoft YaHei"';
      ctx.fillText(mode.name, boxX + 70, by + 28);

      // 描述
      ctx.fillStyle = '#666';
      ctx.font = '11px "Microsoft YaHei"';
      ctx.fillText(mode.desc, boxX + 70, by + 48);

      // 选中指示器
      if (isSelected) {
        ctx.fillStyle = mode.color;
        ctx.beginPath();
        ctx.moveTo(boxX + 12, by + boxH / 2 - 6);
        ctx.lineTo(boxX + 12, by + boxH / 2 + 6);
        ctx.lineTo(boxX + 22, by + boxH / 2);
        ctx.closePath();
        ctx.fill();
      }
    });

    // 段位进度条
    this._drawRankBar(ctx);

    // 提示
    const armoryBtnY = this._getArmoryBtnY();
    const startBtnY = this._getStartBtnY();

    // 军备库按钮
    const armoryBoxW = 500;
    const armoryBoxX = 150;
    const armoryBoxH = 40;
    ctx.fillStyle = 'rgba(20,22,40,0.8)';
    ctx.strokeStyle = '#b44dff';
    ctx.shadowColor = '#b44dff';
    ctx.shadowBlur = 8;
    ctx.lineWidth = 1.5;
    this._roundRect(ctx, armoryBoxX, armoryBtnY, armoryBoxW, armoryBoxH, 8);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#b44dff';
    ctx.font = 'bold 14px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('🔧 军 备 库', CONFIG.WIDTH / 2, armoryBtnY + 26);
    ctx.textAlign = 'left';

    const tipAlpha = 0.5 + 0.5 * Math.sin(time * 3);
    ctx.fillStyle = `rgba(0,212,255,${tipAlpha})`;
    ctx.font = 'bold 12px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('↑↓ 选择模式  ENTER 开始', CONFIG.WIDTH / 2, startBtnY + 14);

    // 小飞机
    ctx.fillStyle = '#00d4ff';
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(CONFIG.WIDTH / 2, startBtnY + 38);
    ctx.lineTo(CONFIG.WIDTH / 2 - 12, startBtnY + 52);
    ctx.lineTo(CONFIG.WIDTH / 2 - 6, startBtnY + 46);
    ctx.lineTo(CONFIG.WIDTH / 2 + 6, startBtnY + 46);
    ctx.lineTo(CONFIG.WIDTH / 2 + 12, startBtnY + 52);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // 确认弹窗覆盖层
    if (this.confirmMode) {
      this._drawConfirmOverlay(ctx, time);
    }

    ctx.textAlign = 'left';
  }

  _roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  _drawConfirmOverlay(ctx, time) {
    const W = CONFIG.WIDTH, H = CONFIG.HEIGHT;
    const mode = this.confirmMode;

    // 半透明遮罩
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, W, H);

    const modeInfo = mode === 'endless'
      ? { name: '无尽模式', icon: '∞', desc: '存活越久分数越高，挑战极限', color: '#00d4ff' }
      : { name: '限时挑战', icon: '⏱', desc: '2分钟内尽可能获得高分', color: '#ffaa00' };

    const pulse = 0.6 + 0.4 * Math.sin(time * 3);

    // 面板背景
    const pw = 420, ph = 260;
    const px = (W - pw) / 2, py = (H - ph) / 2;
    ctx.fillStyle = 'rgba(10,12,30,0.95)';
    ctx.strokeStyle = modeInfo.color;
    ctx.shadowColor = modeInfo.color;
    ctx.shadowBlur = 15;
    ctx.lineWidth = 2;
    this._roundRect(ctx, px, py, pw, ph, 12);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 图标
    ctx.fillStyle = modeInfo.color;
    ctx.shadowColor = modeInfo.color;
    ctx.shadowBlur = 20;
    ctx.font = '40px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(modeInfo.icon, W / 2, py + 50);
    ctx.shadowBlur = 0;

    // 模式名
    ctx.fillStyle = modeInfo.color;
    ctx.font = 'bold 22px "Microsoft YaHei"';
    ctx.fillText(modeInfo.name, W / 2, py + 80);

    // 描述
    ctx.fillStyle = '#8899aa';
    ctx.font = '13px "Microsoft YaHei"';
    ctx.fillText(modeInfo.desc, W / 2, py + 105);

    // 分隔线
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px + 40, py + 120);
    ctx.lineTo(px + pw - 40, py + 120);
    ctx.stroke();

    // 提示
    ctx.fillStyle = '#ccc';
    ctx.font = '12px "Microsoft YaHei"';
    ctx.fillText('点击下方按钮开始挑战', W / 2, py + 142);

    // 开始游戏按钮
    const btnW = 220, btnH = 46;
    const btnX = W / 2 - btnW / 2, btnY = py + 158;

    ctx.shadowColor = modeInfo.color;
    ctx.shadowBlur = 20 * pulse;
    ctx.fillStyle = modeInfo.color;
    ctx.strokeStyle = modeInfo.color;
    ctx.lineWidth = 2.5;
    this._roundRect(ctx, btnX, btnY, btnW, btnH, 10);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(0,10,30,0.9)';
    this._roundRect(ctx, btnX + 3, btnY + 3, btnW - 6, btnH - 6, 8);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px "Microsoft YaHei"';
    ctx.fillText('开始游戏', W / 2, btnY + 30);

    // 返回按钮
    const bBtnW = 140, bBtnH = 36;
    const bBtnX = W / 2 - bBtnW / 2, bBtnY = py + 214;

    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.5;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    this._roundRect(ctx, bBtnX, bBtnY, bBtnW, bBtnH, 8);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#999';
    ctx.font = 'bold 14px "Microsoft YaHei"';
    ctx.fillText('返  回', W / 2, bBtnY + 24);

    ctx.textAlign = 'left';
  }
}

// 军备库
class ArmoryScene {
  constructor() {
    this.background = new Background();
    this.backHover = false;
    this.msgText = null;
    this.msgTimer = 0;
    this.msgColor = '#00ffcc';
    this.tab = 'armory';
    this.scrollOffset = 0;
  }

  update(dt, input) {
    this.background.update(dt);
    this.msgTimer -= dt;
    if (input) {
      const wheelDelta = input.getWheelDelta();
      if (wheelDelta !== 0) {
        this.scrollOffset += wheelDelta * 30;
        const allAc = Object.keys(CONFIG.AIRCRAFT);
        const skillIds = Object.keys(CONFIG.SHOP_SKILLS);
        const skillStartY = 70 + allAc.length * 34 + 18;
        const totalContentH = skillStartY + skillIds.length * 34 + 30;
        const maxScroll = Math.max(0, totalContentH - CONFIG.HEIGHT);
        this.scrollOffset = Math.max(0, Math.min(this.scrollOffset, maxScroll));
      }
    }
  }

  handleClick(input, inventory, scaleRatio = 1) {
    const click = input.getClick();
    if (!click) return null;

    const mx = click.x * scaleRatio;
    const myRaw = click.y * scaleRatio;
    input.consumeClick();

    // 返回按钮（使用原始坐标，不受滚动影响）
    if (mx >= 10 && mx <= 100 && myRaw >= 5 && myRaw <= 22) return 'back';

    const my = myRaw + this.scrollOffset;

    if (this.tab === 'armory') {

    // 飞机商店 - 零件购买飞机卡片
    const cardW = 500;
    const cardX = (CONFIG.WIDTH - 500) / 2;
    const allAc = Object.keys(CONFIG.AIRCRAFT);
    for (let i = 0; i < allAc.length; i++) {
      const by = 70 + i * 34;
      if (mx >= cardX && mx <= cardX + cardW && my >= by && my <= by + 30) {
        const id = allAc[i];
        const cfg = CONFIG.AIRCRAFT[id];
        if (id === 'fighter') {
          if (inventory.equipAircraft(id)) {
            this._showMsg(`已装备 ${cfg.name}`, '#00d4ff');
          }
        } else if (inventory.aircraft[id]) {
          // 已拥有，装备
          if (inventory.equipAircraft(id)) {
            this._showMsg(`已装备 ${cfg.name}`, '#00d4ff');
          }
        } else {
          // 购买
          if (inventory.buyAircraftWithParts(id)) {
            this._showMsg(`购买成功！获得 ${cfg.name}`, '#ffd700');
            if (this.notifyCallback) this.notifyCallback('✈', '新型飞机！', `${cfg.name} 已解锁`, '#ffd700');
          } else {
            this._showMsg(`零件不足，需要${cfg.parts}零件`, '#ff4444');
          }
        }
        return null;
      }
    }

    // 技能商店 - 金币购买技能卡片（可多次购买）
    const skillIds = Object.keys(CONFIG.SHOP_SKILLS);
    const skillStartY = 70 + allAc.length * 34 + 18;
    for (let i = 0; i < skillIds.length; i++) {
      const by = skillStartY + i * 34;
      if (mx >= cardX && mx <= cardX + cardW && my >= by && my <= by + 30) {
        const id = skillIds[i];
        if (inventory.buyShopSkill(id)) {
          const count = inventory.getShopSkillCount(id);
          this._showMsg(`购买成功！${CONFIG.SHOP_SKILLS[id].name} x${count}`, '#ffd700');
          if (this.notifyCallback) this.notifyCallback(CONFIG.SHOP_SKILLS[id].icon, '技能获得！', `${CONFIG.SHOP_SKILLS[id].name}已解锁`, CONFIG.SHOP_SKILLS[id].color);
        } else {
          this._showMsg(`金币不足，需要${CONFIG.SHOP_SKILLS[id].cost}金币`, '#ff4444');
        }
        return null;
      }
    }
    } // end if tab === 'armory'
    return null;
  }

  _showMsg(msg, color) {
    this.msgText = msg;
    this.msgColor = color;
    this.msgTimer = 2;
  }

  getHoverType(mx, my) {
    if (mx >= 10 && mx <= 100 && my >= 5 && my <= 22) return 'pointer';
    const myAdj = my + this.scrollOffset;
    if (this.tab === 'armory') {
      const cardW = 500;
      const cardX = (CONFIG.WIDTH - 500) / 2;
      const checkRanges = () => {
        const allAc = Object.keys(CONFIG.AIRCRAFT);
        for (let i = 0; i < allAc.length; i++) {
          if (mx >= cardX && mx <= cardX + cardW && myAdj >= 70 + i * 34 && myAdj <= 70 + i * 34 + 30) return true;
        }
        const skillIds = Object.keys(CONFIG.SHOP_SKILLS);
        const skillStartY = 70 + allAc.length * 34 + 18;
        for (let i = 0; i < skillIds.length; i++) {
          if (mx >= cardX && mx <= cardX + cardW && myAdj >= skillStartY + i * 34 && myAdj <= skillStartY + i * 34 + 30) return true;
        }
        return false;
      };
      return checkRanges() ? 'pointer' : 'crosshair';
    }
    return 'crosshair';
  }

  draw(ctx, time, inventory) {
    this.background.draw(ctx, time);

    // 标题
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 15;
    ctx.font = 'bold 22px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('军 备 库', CONFIG.WIDTH / 2, 25);
    ctx.shadowBlur = 0;

    // 返回按钮
    ctx.fillStyle = '#222';
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1;
    ctx.textAlign = 'left';
    this._roundRect(ctx, 10, 5, 90, 17, 5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#e0e8ff';
    ctx.font = '12px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('< 返回', 55, 16);
    ctx.textAlign = 'left';

    // 资源栏
    const rank = inventory.getRank();
    ctx.fillStyle = rank.color;
    ctx.font = 'bold 11px "Courier New"';
    ctx.textAlign = 'right';
    ctx.fillText(`${rank.icon} ${rank.name}`, CONFIG.WIDTH - 10, 13);
    ctx.fillStyle = '#00ffcc';
    ctx.fillText(`🔩${inventory.parts}`, CONFIG.WIDTH - 10, 23);
    ctx.fillStyle = '#ffd700';
    ctx.fillText(`💰${inventory.coins}`, CONFIG.WIDTH - 60, 23);
    ctx.textAlign = 'left';

    if (this.tab === 'armory') {
      this._drawArmoryTab(ctx, inventory);
    }

    // 消息提示
    if (this.msgText && this.msgTimer > 0) {
      const alpha = Math.min(1, this.msgTimer);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = this.msgColor;
      ctx.shadowColor = this.msgColor;
      ctx.shadowBlur = 10;
      ctx.font = 'bold 16px "Courier New"';
      ctx.textAlign = 'center';
      ctx.fillText(this.msgText, CONFIG.WIDTH / 2, CONFIG.HEIGHT - 9);
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  _drawArmoryTab(ctx, inventory) {
    const cardW = 500;
    const cardX = (CONFIG.WIDTH - 500) / 2;

    ctx.save();
    ctx.translate(0, -this.scrollOffset);

    // ---- 飞机商店 ----
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 12px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText('— 飞机商店（零件购买） —', CONFIG.WIDTH / 2, 65);
    ctx.textAlign = 'left';

    const allAc = Object.keys(CONFIG.AIRCRAFT);
    const acSpacing = 34;
    allAc.forEach((id, i) => {
      const cfg = CONFIG.AIRCRAFT[id];
      const owned = id === 'fighter' || (inventory.aircraft[id] || 0) > 0;
      const equipped = inventory.equipped === id;
      const canBuy = id !== 'fighter' && !owned && inventory.parts >= cfg.parts;
      const by = 70 + i * acSpacing;
      const cardH = 30;

      ctx.fillStyle = equipped ? 'rgba(0,40,60,0.9)' : owned ? 'rgba(20,30,20,0.9)' : canBuy ? 'rgba(30,25,15,0.9)' : 'rgba(10,12,20,0.6)';
      ctx.strokeStyle = equipped ? '#00d4ff' : owned ? '#00ffcc' : canBuy ? '#ffd700' : '#444';
      ctx.lineWidth = equipped ? 2 : 1;
      this._roundRect(ctx, cardX, by, cardW, cardH, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = equipped ? '#00d4ff' : '#aaa';
      ctx.font = 'bold 12px "Microsoft YaHei"';
      ctx.fillText(cfg.name, cardX + 10, by + 13);

      ctx.fillStyle = '#888';
      ctx.font = '9px "Microsoft YaHei"';
      const bonus = cfg.bonus;
      let bonusStr = cfg.desc;
      if (bonus.fireRate) bonusStr += ` 射速+${bonus.fireRate}`;
      if (bonus.bulletCount) bonusStr += ` 弹幕+${bonus.bulletCount}`;
      if (bonus.damage) bonusStr += ` 伤害+${bonus.damage}`;
      if (bonus.hp) bonusStr += ` HP+${bonus.hp}`;
      if (bonus.speed) bonusStr += ` 速度+${bonus.speed}`;
      if (bonus.drone) bonusStr += ` 僚机+${bonus.drone}`;
      ctx.fillText(bonusStr, cardX + 10, by + 25);

      ctx.textAlign = 'right';
      if (id === 'fighter') {
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 10px "Microsoft YaHei"';
        ctx.fillText(equipped ? '已装备' : '免费', cardX + cardW - 10, by + 18);
      } else if (owned) {
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 10px "Microsoft YaHei"';
        ctx.fillText(equipped ? '已装备' : '点击装备', cardX + cardW - 10, by + 18);
      } else {
        ctx.fillStyle = canBuy ? '#ffd700' : '#ff4444';
        ctx.font = 'bold 10px "Courier New"';
        ctx.fillText(`${cfg.parts}🔩`, cardX + cardW - 10, by + 18);
      }
      ctx.textAlign = 'left';
    });

    // ---- 技能商店 ----
    const skillIds = Object.keys(CONFIG.SHOP_SKILLS);
    const skillStartY = 70 + allAc.length * acSpacing + 18;
    ctx.fillStyle = '#00d4ff';
    ctx.font = 'bold 12px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText('— 技能商店（金币购买 · 一次性消耗） —', CONFIG.WIDTH / 2, skillStartY - 5);
    ctx.textAlign = 'left';

    skillIds.forEach((id, i) => {
      const cfg = CONFIG.SHOP_SKILLS[id];
      const owned = inventory.hasShopSkill(id);
      const count = inventory.getShopSkillCount(id);
      const canBuy = inventory.coins >= cfg.cost;
      const by = skillStartY + i * 34;

      ctx.fillStyle = owned ? 'rgba(20,30,40,0.9)' : canBuy ? 'rgba(30,25,15,0.9)' : 'rgba(10,12,20,0.6)';
      ctx.strokeStyle = owned ? cfg.color : canBuy ? '#ffd700' : '#444';
      ctx.lineWidth = 1;
      this._roundRect(ctx, cardX, by, cardW, 30, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = owned ? cfg.color : '#aaa';
      ctx.font = 'bold 13px "Courier New"';
      ctx.fillText(`${cfg.icon} ${cfg.name}`, cardX + 10, by + 16);

      ctx.fillStyle = '#888';
      ctx.font = '9px "Courier New"';
      const durationInfo = cfg.duration > 0 ? `持续${cfg.duration}s` : '即时生效';
      ctx.fillText(`${cfg.desc}  |  ${durationInfo}  |  一次性使用`, cardX + 10, by + 24);

      ctx.textAlign = 'right';
      if (owned) {
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 11px "Courier New"';
        ctx.fillText(`拥有 x${count}`, cardX + cardW - 10, by + 17);
      } else {
        ctx.fillStyle = canBuy ? '#ffd700' : '#ff4444';
        ctx.font = 'bold 11px "Courier New"';
        ctx.fillText(`${cfg.cost}💰`, cardX + cardW - 10, by + 17);
      }
      ctx.textAlign = 'left';
    });
    ctx.restore();
  }

  _roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
}

// ==================== 15.5 Boss关卡选择界面 ====================
class BossStageSelect {
  constructor() {
    this.background = new Background();
    this.selectedStage = 1;
    this.goBack = false;
    this.goStart = false;
    this.scrollY = 0;
    this.targetScrollY = 0;
  }

  update(dt, input, inventory, scaleRatio) {
    this.background.update(dt);
    const mx = input.mouse.x * scaleRatio;
    const my = input.mouse.y * scaleRatio;
    const click = input.getClick();
    const totalStages = CONFIG.BOSS_STAGES.length;
    const maxStage = inventory.highestStage;

    // 鼠标滚轮滚动
    const wheelDelta = input.getWheelDelta();
    if (wheelDelta !== 0) {
      this.targetScrollY += wheelDelta * 80;
    }

    // 计算滚动范围
    const rows = Math.ceil(totalStages / 2);
    const totalH = rows * 60 + 144;
    const maxScroll = Math.max(0, totalH - CONFIG.HEIGHT);
    this.targetScrollY = Math.max(0, Math.min(this.targetScrollY, maxScroll));
    this.scrollY = lerp(this.scrollY, this.targetScrollY, 0.1);

    // 点击关卡
    if (click) {
      // 返回按钮
      if (mx >= 20 && mx <= 110 && my >= 4 && my <= 26) {
        input.consumeClick();
        this.goBack = true;
        return;
      }
      // 关卡卡片
      const offsetY = 60 - this.scrollY;
      for (let i = 0; i < totalStages; i++) {
        const col = i % 2;
        const row = Math.floor(i / 2);
        const cx = 220 + col * 190;
        const cy = offsetY + row * 60;
        if (mx >= cx && mx <= cx + 170 && my >= cy && my <= cy + 51) {
          const stageId = i + 1;
          if (stageId <= maxStage + 1) {
            input.consumeClick();
            this.selectedStage = stageId;
            this.goStart = true;
          }
        }
      }
    }
  }

  draw(ctx, time, inventory) {
    this.background.draw(ctx, time);
    const totalStages = CONFIG.BOSS_STAGES.length;
    const maxStage = inventory.highestStage;

    // 返回按钮
    ctx.fillStyle = 'rgba(0,212,255,0.15)';
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 1.5;
    this._roundRect(ctx, 20, 4, 90, 22, 5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#00d4ff';
    ctx.font = 'bold 12px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('← 返回', 65, 19);
    ctx.textAlign = 'left';

    // 标题
    ctx.fillStyle = '#00d4ff';
    ctx.font = 'bold 20px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('Boss 关卡选择', CONFIG.WIDTH / 2, 25);

    // 星级说明
    ctx.fillStyle = '#ffd700';
    ctx.font = '10px "Microsoft YaHei"';
    ctx.fillText('★★★ 30秒内通关  ★★☆ 60秒内通关  ★☆☆ 击败即可', CONFIG.WIDTH / 2, 41);

    // 关卡卡片
    const offsetY = 60 - this.scrollY;
    for (let i = 0; i < totalStages; i++) {
      const stageId = i + 1;
      const cfg = CONFIG.BOSS_STAGES[i];
      const col = i % 2;
      const row = Math.floor(i / 2);
      const cx = 220 + col * 190;
      const cy = offsetY + row * 60;
      const unlocked = stageId <= maxStage + 1;
      const stars = inventory.getStageStars(stageId);

      if (cy < -50 || cy > CONFIG.HEIGHT + 20) continue;

      // 卡片背景
      const alpha = unlocked ? 0.25 : 0.08;
      ctx.fillStyle = `rgba(10,12,22,${alpha + 0.4})`;
      ctx.strokeStyle = unlocked ? cfg.color : '#333';
      ctx.lineWidth = unlocked ? 2 : 1;
      this._roundRect(ctx, cx, cy, 170, 51, 8);

      if (unlocked) {
        ctx.shadowColor = cfg.color;
        ctx.shadowBlur = 8;
      }

      // 关卡编号
      ctx.fillStyle = unlocked ? cfg.color : '#444';
      ctx.font = 'bold 12px "Microsoft YaHei"';
      ctx.textAlign = 'left';
      ctx.fillText(`第${stageId}关`, cx + 10, cy + 14);

      // Boss 名称
      ctx.fillStyle = unlocked ? '#ffffff' : '#555';
      ctx.font = 'bold 11px "Microsoft YaHei"';
      ctx.fillText(cfg.name, cx + 10, cy + 27);

      // 奖励
      ctx.fillStyle = unlocked ? '#ffd700' : '#444';
      ctx.font = '9px "Microsoft YaHei"';
      ctx.fillText(`💰${cfg.id * 50} 🔩${cfg.id * 3}`, cx + 10, cy + 39);

      // 星级
      if (unlocked && stars > 0) {
        const starStr = '★'.repeat(stars) + '☆'.repeat(3 - stars);
        ctx.fillStyle = '#ffd700';
        ctx.font = '14px Arial';
        ctx.textAlign = 'right';
        ctx.fillText(starStr, cx + 160, cy + 14);
      } else if (!unlocked) {
        ctx.fillStyle = '#333';
        ctx.font = '16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🔒', cx + 50, cy + 30);
      } else {
        ctx.fillStyle = '#555';
        ctx.font = '12px Arial';
        ctx.textAlign = 'right';
        ctx.fillText('未挑战', cx + 160, cy + 14);
      }

      ctx.shadowBlur = 0;
    }
  }

  getHoverType(mx, my) {
    if (mx >= 20 && mx <= 110 && my >= 4 && my <= 26) return 'pointer';
    const totalStages = CONFIG.BOSS_STAGES.length;
    const offsetY = 60 - this.scrollY;
    for (let i = 0; i < totalStages; i++) {
      const col = i % 2;
      const row = Math.floor(i / 2);
      const cx = 220 + col * 190;
      const cy = offsetY + row * 60;
      if (mx >= cx && mx <= cx + 170 && my >= cy && my <= cy + 51) return 'pointer';
    }
    return 'default';
  }

  _roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
}

// ==================== 15.6 通知系统 ====================
class NotificationManager {
  constructor() {
    this.queue = [];
  }

  add(icon, title, text, color = '#00d4ff') {
    this.queue.push({ icon, title, text, color, timer: 4, alpha: 0 });
    if (this.queue.length > 5) this.queue.shift();
  }

  update(dt) {
    for (let i = this.queue.length - 1; i >= 0; i--) {
      const n = this.queue[i];
      n.timer -= dt;
      n.alpha = Math.min(n.alpha + dt * 3, 1);
      if (n.timer <= 0) {
        this.queue.splice(i, 1);
      }
    }
  }

  draw(ctx) {
    if (this.queue.length === 0) return;
    const startY = 33;
    this.queue.forEach((n, i) => {
      const y = startY + i * 25;
      const fadeAlpha = n.timer < 1 ? n.timer : 1;
      ctx.save();
      ctx.globalAlpha = n.alpha * fadeAlpha;

      // 背景
      ctx.fillStyle = 'rgba(10,14,30,0.9)';
      ctx.strokeStyle = n.color;
      ctx.lineWidth = 1.5;
      ctx.shadowColor = n.color;
      ctx.shadowBlur = 8;
      const bx = CONFIG.WIDTH / 2 - 140, by = y, bw = 280, bh = 22;
      ctx.beginPath();
      ctx.moveTo(bx + 6, by); ctx.lineTo(bx + bw - 6, by);
      ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + 6);
      ctx.lineTo(bx + bw, by + bh - 6);
      ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - 6, by + bh);
      ctx.lineTo(bx + 6, by + bh);
      ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - 6);
      ctx.lineTo(bx, by + 6);
      ctx.quadraticCurveTo(bx, by, bx + 6, by);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 图标
      ctx.fillStyle = n.color;
      ctx.font = '16px Arial';
      ctx.textAlign = 'left';
      ctx.fillText(n.icon, bx + 10, by + 16);

      // 标题
      ctx.fillStyle = n.color;
      ctx.font = 'bold 12px "Microsoft YaHei"';
      ctx.fillText(n.title, bx + 34, by + 12);

      // 描述
      ctx.fillStyle = '#ccc';
      ctx.font = '11px "Microsoft YaHei"';
      ctx.fillText(n.text, bx + 34, by + 20);

      ctx.textAlign = 'left';
      ctx.restore();
    });
  }
}

// ==================== 16. 游戏主类 ====================
class Game {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');

    // 设置画布大小（2x高清渲染）
    this._pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas.width = Math.round(CONFIG.WIDTH * this._pixelRatio);
    this.canvas.height = Math.round(CONFIG.HEIGHT * this._pixelRatio);
    this._resizeCanvas();

    this.audio = new AudioManager();
    this.input = new InputManager();
    this.input.init(this.canvas);

    this.inventory = new Inventory();
    this.notifications = new NotificationManager();
    this.startScene = new StartScene();
    this.armoryScene = new ArmoryScene();
    this.bossSelectScene = new BossStageSelect();
    this.battleScene = new BattleScene();
    this.battleScene.inventory = this.inventory;
    this.battleScene.notifyCallback = (icon, title, text, color) => this.notify(icon, title, text, color);
    this.armoryScene.notifyCallback = (icon, title, text, color) => this.notify(icon, title, text, color);
    this.currentScene = 'intro';
    this.lastTime = 0;
    this.enterPressed = false;
    this.pausePressed = false;
    this.introTime = 0;
    this._preBattleRankId = null;
  }

  _resizeCanvas() {
    const scale = Math.min(
      window.innerWidth / CONFIG.WIDTH,
      window.innerHeight / CONFIG.HEIGHT
    ) * 0.95;
    this.canvas.style.width = Math.round(CONFIG.WIDTH * scale) + 'px';
    this.canvas.style.height = Math.round(CONFIG.HEIGHT * scale) + 'px';
  }

  _getScaleRatio() {
    return 1; // 鼠标坐标已在_getCanvasPos中转换为CONFIG空间
  }

  start() {
    window.addEventListener('resize', () => this._resizeCanvas());
    this.lastTime = performance.now();
    this._loop(this.lastTime);
  }

  _loop(timestamp) {
    const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
    this.lastTime = timestamp;

    this._handleInput(dt);
    this._update(dt);
    this._draw(timestamp / 1000);

    requestAnimationFrame(t => this._loop(t));
  }

  _handleInput(dt) {
    // 点击canvas初始化音频
    if (this.audio.ctx && this.audio.ctx.state === 'suspended') {
      this.canvas.addEventListener('click', () => this.audio.ensureCtx(), { once: true });
    }

    const enter = this.input.isEnter();
    const pause = this.input.isPause();
    const scaleRatio = this._getScaleRatio();

    if (this.currentScene === 'intro') {
      const click = this.input.getClick();
      if ((enter && !this.enterPressed) || click) {
        if (click) this.input.consumeClick();
        this.currentScene = 'tutorial';
        this.audio.ensureCtx();
      }
    } else if (this.currentScene === 'tutorial') {
      const click = this.input.getClick();
      if ((enter && !this.enterPressed) || click) {
        if (click) this.input.consumeClick();
        this.currentScene = 'start';
      }
    } else if (this.currentScene === 'start') {
      if (this.startScene.goToArmory) {
        this.startScene.goToArmory = false;
        this.currentScene = 'armory';
        this.audio.sfx_click();
      } else if (this.startScene.startClicked) {
        // startClicked 由 StartScene 内部确认弹窗后设置，直接启动战斗
        this.startScene.startClicked = false;
        this.audio.ensureCtx();
        const mode = this.startScene.modes[this.startScene.selectedMode].id;
        if (mode === 'boss') {
          this.currentScene = 'bossselect';
          this.bossSelectScene.goBack = false;
          this.bossSelectScene.goStart = false;
          this.bossSelectScene.selectedStage = this.inventory.bossStage;
        } else {
          this.currentScene = 'battle';
          this.battleScene.inventory = this.inventory;
          this.battleScene.start(mode, this.audio);
          this.audio.sfx_gameStart();
          this.audio.startMusic();
          this._preBattleRankId = this.inventory.getRank().id;
        }
        this.enterPressed = true;
        this.audio.sfx_click();
      } else if (enter && !this.enterPressed) {
        const mode = this.startScene.modes[this.startScene.selectedMode].id;
        if (this.startScene.confirmMode) {
          // 确认弹窗中按Enter = 开始游戏
          this.startScene.startClicked = true;
          this.startScene.confirmMode = null;
        } else if (mode === 'boss') {
          // Boss模式直接进入关卡选择
          this.startScene.startClicked = true;
        } else {
          // 无尽/限时模式：显示确认弹窗
          this.startScene.confirmMode = mode;
        }
        this.enterPressed = true;
        this.audio.sfx_click();
      }
    } else if (this.currentScene === 'bossselect') {
      const bss = this.bossSelectScene;
      if (bss.goBack) {
        bss.goBack = false;
        this.currentScene = 'start';
        this.audio.sfx_click();
      } else if (bss.goStart) {
        bss.goStart = false;
        this.currentScene = 'battle';
        this.inventory.bossStage = bss.selectedStage;
        this.battleScene.inventory = this.inventory;
        this.battleScene.start('boss', this.audio);
        this.audio.sfx_gameStart();
        this.audio.startMusic();
        this._preBattleRankId = this.inventory.getRank().id; // 记录战斗前段位
      }
    } else if (this.currentScene === 'armory') {
      const result = this.armoryScene.handleClick(this.input, this.inventory, scaleRatio);
      if (result === 'back') {
        this.currentScene = 'start';
        this.audio.sfx_click();
      }
    } else if (this.currentScene === 'battle') {
      const bs = this.battleScene;

      // Boss 关卡介绍：ENTER 或点击开始按钮 → 进入攻击介绍界面
      if (bs.bossIntro) {
        const click = this.input.getClick();
        const hitIntro = click ? this._hitRect(click, bs._getBossIntroButtonRect()) : false;
        if ((enter && !this.enterPressed) || hitIntro) {
          if (hitIntro) this.input.consumeClick();
          bs.bossIntro = false;
          bs._bossBriefing = true;
          this.audio.sfx_gameStart();
        }
      }
      // Boss 攻击介绍界面：点击确认 → 开始预BOSS阶段
      if (bs._bossBriefing) {
        const click = this.input.getClick();
        const hitConfirm = click ? this._hitRect(click, bs._getBriefingConfirmRect()) : false;
        if ((enter && !this.enterPressed) || hitConfirm) {
          if (hitConfirm) this.input.consumeClick();
          bs._bossBriefing = false;
          bs._preBossPhase = true;
          bs._preBossTimer = 0;
          bs._bossArrival = false;
          bs._bossArrivalShown = false;
          this.audio.startMusic();
        }
      }

      // 退出确认弹窗
      else if (bs.quitConfirm) {
        if (pause && !this.pausePressed) {
          bs.quitConfirm = false;
        }
        const click = this.input.getClick();
        if (click) {
          if (this._hitRect(click, bs._getQuitContinueRect())) {
            this.input.consumeClick();
            bs.quitConfirm = false;
            this.audio.startMusic();
          } else if (this._hitRect(click, bs._getQuitAbandonRect())) {
            this.input.consumeClick();
            this.currentScene = 'start';
            this.startScene.startClicked = false;
            this.audio.stopMusic();
          }
        }
      }

      // 游戏结束
      else if (bs.gameOver) {
        const click = this.input.getClick();
        // Boss 通关：下一关按钮
        if (bs.mode === 'boss' && bs.bossStageCleared) {
          const hasNext = this.inventory.bossStage <= CONFIG.BOSS_STAGES.length;
          if (hasNext && click && this._hitRect(click, bs._getNextStageButtonRect())) {
            this.input.consumeClick();
            this.currentScene = 'bossselect';
            this.bossSelectScene.goBack = false;
            this.bossSelectScene.goStart = false;
            this.bossSelectScene.selectedStage = this.inventory.bossStage;
            this.audio.stopMusic();
          } else if (click && this._hitRect(click, bs._getReturnButtonSmallRect())) {
            this.input.consumeClick();
            this.currentScene = 'start';
            this.startScene.startClicked = false;
            this.audio.stopMusic();
          } else if (enter && !this.enterPressed) {
            this.currentScene = 'start';
            this.startScene.startClicked = false;
            this.audio.stopMusic();
          }
        } else {
          // 普通模式：返回按钮
          // BOSS模式失败：返回关卡选择
          const hitButton = click ? this._hitRect(click, bs._getReturnButtonRect()) : false;
          if ((enter && !this.enterPressed) || hitButton) {
            if (hitButton) this.input.consumeClick();
            if (bs.mode === 'boss') {
              this.currentScene = 'bossselect';
              this.bossSelectScene.goBack = false;
              this.bossSelectScene.goStart = false;
              this.bossSelectScene.selectedStage = this.inventory.bossStage;
            } else {
              this.currentScene = 'start';
              this.startScene.startClicked = false;
            }
            this.audio.stopMusic();
          }
        }
      }

      // 游戏中：ESC 暂停 / 显示退出确认
      else {
        if (pause && !this.pausePressed) {
          if (bs.paused) {
            bs.paused = false;
          } else {
            bs.paused = true;
            this.audio.stopMusic();
          }
        }
        // 暂停菜单点击
        if (bs.paused) {
          const click = this.input.getClick();
          if (click) {
            if (this._hitRect(click, bs._getPauseResumeRect())) {
              this.input.consumeClick();
              bs.paused = false;
              this.audio.startMusic();
            } else if (this._hitRect(click, bs._getPauseQuitRect())) {
              this.input.consumeClick();
              bs.paused = false;
              bs.quitConfirm = true;
            }
          }
        }
      }
    }

    this.enterPressed = enter;
    this.pausePressed = pause;
  }

  _update(dt) {
    this.notifications.update(dt);
    const scaleRatio = this._getScaleRatio();
    if (this.currentScene === 'intro') {
      this.introTime += dt;
    } else if (this.currentScene === 'bossselect') {
      this.bossSelectScene.update(dt, this.input, this.inventory, scaleRatio);
    } else if (this.currentScene === 'start') {
      const prevMode = this.startScene.selectedMode;
      this.startScene.update(dt, this.input, scaleRatio);
      if (this.startScene.selectedMode !== prevMode) {
        this.audio.sfx_click();
      }
      // 段位晋升检测（只在主界面提示一次）
      if (this._preBattleRankId) {
        const currentRank = this.inventory.getRank();
        if (currentRank && currentRank.id !== this._preBattleRankId) {
          this.notify(currentRank.icon, '段位晋升！', `恭喜达到 ${currentRank.name}`, currentRank.color);
        }
        this._preBattleRankId = null; // 只检查一次
      }
    } else if (this.currentScene === 'armory') {
      this.armoryScene.update(dt, this.input);
    } else if (this.currentScene === 'battle') {
      this.battleScene.update(dt, this.input, this.audio);
    }
  }

  _draw(time) {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    ctx.save();
    ctx.scale(this._pixelRatio, this._pixelRatio);

    if (this.currentScene === 'intro') {
      this._drawIntro(time);
      this.canvas.style.cursor = 'pointer';
    } else if (this.currentScene === 'tutorial') {
      this._drawTutorial(time);
      this.canvas.style.cursor = 'pointer';
    } else if (this.currentScene === 'bossselect') {
      this.bossSelectScene.draw(this.ctx, time, this.inventory);
      const sr = this._getScaleRatio();
      this.canvas.style.cursor = this.bossSelectScene.getHoverType(this.input.mouse.x * sr, this.input.mouse.y * sr);
    } else if (this.currentScene === 'start') {
      this.startScene.draw(this.ctx, time);
      const sr = this._getScaleRatio();
      this.canvas.style.cursor = this.startScene.getHoverType(this.input.mouse.x * sr, this.input.mouse.y * sr);
    } else if (this.currentScene === 'armory') {
      this.armoryScene.draw(this.ctx, time, this.inventory);
      const sr = this._getScaleRatio();
      this.canvas.style.cursor = this.armoryScene.getHoverType(this.input.mouse.x * sr, this.input.mouse.y * sr);
    } else if (this.currentScene === 'battle') {
      this.battleScene.draw(this.ctx, time);
      const sr = this._getScaleRatio();
      const mx = this.input.mouse.x * sr;
      const my = this.input.mouse.y * sr;
      const bs = this.battleScene;
      let cursor = 'crosshair';
      if (bs.bossIntro) {
        cursor = this._hitRect({ x: mx, y: my }, bs._getBossIntroButtonRect()) ? 'pointer' : 'crosshair';
      } else if (bs.paused) {
        if (this._hitRect({ x: mx, y: my }, bs._getPauseResumeRect()) ||
            this._hitRect({ x: mx, y: my }, bs._getPauseQuitRect())) {
          cursor = 'pointer';
        }
      } else if (bs.quitConfirm) {
        if (this._hitRect({ x: mx, y: my }, bs._getQuitContinueRect()) ||
            this._hitRect({ x: mx, y: my }, bs._getQuitAbandonRect())) {
          cursor = 'pointer';
        }
      } else if (bs.gameOver) {
        if (bs.mode === 'boss' && bs.bossStageCleared) {
          if (this._hitRect({ x: mx, y: my }, bs._getNextStageButtonRect()) ||
              this._hitRect({ x: mx, y: my }, bs._getReturnButtonSmallRect())) {
            cursor = 'pointer';
          }
        } else {
          cursor = this._hitRect({ x: mx, y: my }, bs._getReturnButtonRect()) ? 'pointer' : 'crosshair';
        }
      }
      this.canvas.style.cursor = cursor;
    }
    // 通知系统（仅战斗场景）
    if (this.currentScene === 'battle' && !this.battleScene.paused && !this.battleScene.gameOver) {
      this.notifications.draw(this.ctx);
    }
    ctx.restore();
  }

  // 通用矩形命中检测
  _hitRect(click, rect) {
    const scaleRatio = this._getScaleRatio();
    const cx = click.x * scaleRatio;
    const cy = click.y * scaleRatio;
    return cx >= rect.x && cx <= rect.x + rect.w && cy >= rect.y && cy <= rect.y + rect.h;
  }

  notify(icon, title, text, color = '#00d4ff') {
    this.notifications.add(icon, title, text, color);
  }

  _drawIntro(time) {
    const ctx = this.ctx;
    const W = CONFIG.WIDTH, H = CONFIG.HEIGHT;

    // 深空背景
    ctx.fillStyle = '#020410';
    ctx.fillRect(0, 0, W, H);

    // 星星
    const starCount = 80;
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < starCount; i++) {
      const sx = ((i * 7919 + 104729) % W) + Math.sin(time * 0.3 + i * 0.7) * 2;
      const sy = ((i * 6271 + 224737) % H) + Math.cos(time * 0.25 + i * 0.5) * 2;
      const size = (i % 3) === 0 ? 1.5 : 0.8;
      const alpha = 0.4 + 0.6 * Math.sin(time * 2 + i * 1.3);
      ctx.globalAlpha = alpha;
      ctx.fillRect(sx, sy, size, size);
    }
    ctx.globalAlpha = 1;

    const alpha = Math.min(this.introTime / 2, 1);

    // 标题
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#00d4ff';
    ctx.font = 'bold 26px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('银河保卫战', W / 2, 60);
    ctx.shadowBlur = 0;

    // 副标题
    ctx.fillStyle = '#8899aa';
    ctx.font = '13px "Microsoft YaHei"';
    ctx.fillText('GALAXY DEFENDER', W / 2, 78);

    // 分隔线
    ctx.strokeStyle = 'rgba(0,212,255,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W / 2 - 120, 90);
    ctx.lineTo(W / 2 + 120, 90);
    ctx.stroke();

    // 剧情文字
    const lines = [
      '公元 2247 年，人类已迈向星际文明。',
      '',
      '然而，一股神秘的外星势力——「虚空军团」突然降临，',
      '它们的战舰遮天蔽日，意图吞噬整个银河系。',
      '',
      '联合舰队节节败退，地球危在旦夕。',
      '你，作为银河联邦最后的王牌飞行员，',
      '必须驾驶最先进的战机，突破敌军层层防线，',
      '击败虚空霸主，拯救人类文明！',
    ];

    ctx.fillStyle = '#ccddee';
    ctx.font = '13px "Microsoft YaHei"';
    const startY = 108;
    const lineH = 14;
    lines.forEach((line, i) => {
      if (line) {
        ctx.fillText(line, W / 2, startY + i * lineH);
      }
    });

    // 提示文字
    const pulse = 0.6 + 0.4 * Math.sin(time * 3);
    ctx.globalAlpha = alpha * pulse;
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 18px "Microsoft YaHei"';
    ctx.fillText('准备好开始挑战了吗？', W / 2, startY + lines.length * lineH + 47);

    ctx.globalAlpha = alpha * 0.7;
    ctx.fillStyle = '#8899aa';
    ctx.font = '12px "Microsoft YaHei"';
    ctx.fillText('点击屏幕 或 按 ENTER 开始', W / 2, startY + lines.length * lineH + 65);

    ctx.restore();
  }

  _drawTutorial(time) {
    const W = CONFIG.WIDTH, H = CONFIG.HEIGHT;
    const ctx = this.ctx;

    // 星空背景
    ctx.fillStyle = '#000011';
    ctx.fillRect(0, 0, W, H);
    const starCount = 80;
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < starCount; i++) {
      const sx = ((i * 7919 + 104729) % W);
      const sy = ((i * 6271 + 224737) % H);
      const size = (i % 3) === 0 ? 1.5 : 0.8;
      const alpha = 0.3 + 0.5 * Math.sin(time * 2 + i * 1.3);
      ctx.globalAlpha = alpha;
      ctx.fillRect(sx, sy, size, size);
    }
    ctx.globalAlpha = 1;

    // 标题
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#00d4ff';
    ctx.font = 'bold 22px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('操 作 指 南', W / 2, 36);
    ctx.shadowBlur = 0;

    // 分隔线
    ctx.strokeStyle = 'rgba(0,212,255,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W / 2 - 100, 48);
    ctx.lineTo(W / 2 + 100, 48);
    ctx.stroke();

    // 操作按键列表
    const controls = [
      { key: 'W / A / S / D', desc: '控制飞机上下左右移动', color: '#00d4ff' },
      { key: 'Z',              desc: '按住加速移动（1.5倍速度）', color: '#00ffc8' },
      { key: 'Space / J',      desc: '发射子弹', color: '#ffd700' },
      { key: 'B',              desc: '投掷轰炸（消耗轰炸次数）', color: '#ff6b6b' },
      { key: '1 - 5',          desc: '使用商店技能（一次性消耗）', color: '#b44dff' },
      { key: 'Enter',          desc: '确认 / 进入游戏', color: '#00ff88' },
      { key: 'ESC',            desc: '暂停 / 退出当前游戏', color: '#ff8844' },
      { key: '鼠标点击',       desc: '选择模式 / 确认操作', color: '#ffcc00' },
    ];

    const startY = 63;
    const cardH = 31;
    const cardW = 500;
    const cardX = (W - 500) / 2;

    controls.forEach((ctrl, i) => {
      const by = startY + i * (cardH + 4);
      // 卡片背景
      ctx.fillStyle = 'rgba(10,14,30,0.8)';
      ctx.strokeStyle = 'rgba(0,212,255,0.2)';
      ctx.lineWidth = 1;
      this._roundRect(ctx, cardX, by, cardW, cardH, 8);
      ctx.fill();
      ctx.stroke();

      // 按键
      ctx.fillStyle = ctrl.color;
      ctx.shadowColor = ctrl.color;
      ctx.shadowBlur = 8;
      ctx.font = 'bold 14px "Courier New"';
      ctx.textAlign = 'left';
      ctx.fillText(ctrl.key, cardX + 16, by + 13);
      ctx.shadowBlur = 0;

      // 描述
      ctx.fillStyle = '#8899aa';
      ctx.font = '12px "Microsoft YaHei"';
      ctx.fillText(ctrl.desc, cardX + 16, by + 24);
      ctx.textAlign = 'center';
    });

    // 底部提示
    const pulse = 0.6 + 0.4 * Math.sin(time * 3);
    ctx.fillStyle = '#ffd700';
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 16px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('点击屏幕 或 按 ENTER 开始游戏', W / 2, H - 24);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  _roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
}

// ==================== 17. 启动 ====================
const game = new Game();
game.start();
