    ctx.shadowColor = glowColor; ctx.shadowBlur = 20;
    this._drawCore(ctx, color, accent2, time);
  }

  // 第9关：暗影幽魂（幽灵飘忽）
  _drawWraith(ctx, color, glowColor, accent2, bodyColor, darkColor, time) {
    const floatY = Math.sin(time * 2) * 8;
    const alpha2 = 0.6 + 0.4 * Math.sin(time * 3);
    ctx.globalAlpha = alpha2;
    ctx.fillStyle = bodyColor; ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, floatY - 65);
    ctx.bezierCurveTo(-25, floatY - 55, -40, floatY - 30, -38, floatY);
    ctx.bezierCurveTo(-36, floatY + 20, -25, floatY + 40, -15, floatY + 55);
    ctx.lineTo(0, floatY + 60); ctx.lineTo(15, floatY + 55);
    ctx.bezierCurveTo(25, floatY + 40, 36, floatY + 20, 38, floatY);
    ctx.bezierCurveTo(40, floatY - 30, 25, floatY - 55, 0, floatY - 65);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 幽灵眼眸
    ctx.fillStyle = accent2; ctx.shadowColor = accent2; ctx.shadowBlur = 14;
    [-10, 10].forEach(ox => {
      ctx.beginPath(); ctx.arc(ox, floatY - 15, 6, 0, Math.PI, true); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.shadowColor = glowColor; ctx.shadowBlur = 20;
    this._drawCore(ctx, color, accent2, time);
  }

  // 第10关：虚空之神（终极形态）
  _drawOverlord(ctx, color, glowColor, accent2, bodyColor, darkColor, time) {
    // 外圈光环
    const ringCount = 3;
    for (let i = 0; i < ringCount; i++) {
      const r = 55 + i * 10;
      const rot = time * (1 + i * 0.5);
      ctx.strokeStyle = color; ctx.lineWidth = 2 - i * 0.3; ctx.globalAlpha = 0.3 + i * 0.2;
      ctx.beginPath(); ctx.arc(0, 0, r, rot, rot + TAU * 0.7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // 主体（菱形+尖刺）
    ctx.fillStyle = bodyColor; ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.beginPath();
    const spikes = 8;
    for (let i = 0; i < spikes; i++) {
      const a = TAU * i / spikes - Math.PI / 2;
      const outerR = i % 2 === 0 ? 65 : 45;
      const innerR = i % 2 === 0 ? 30 : 20;
      const ox = Math.cos(a) * outerR, oy = Math.sin(a) * outerR;
      if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
      const nx = Math.cos(a + TAU / spikes / 2) * innerR, ny = Math.sin(a + TAU / spikes / 2) * innerR;
      ctx.lineTo(nx, ny);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 尖刺光点
    for (let i = 0; i < 8; i++) {
      const a = TAU * i / 8 - Math.PI / 2;
      const r = 65;
      ctx.fillStyle = accent2; ctx.shadowColor = accent2; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 4, 0, TAU); ctx.fill();
    }
    ctx.shadowColor = glowColor; ctx.shadowBlur = 20;
    this._drawCore(ctx, color, accent2, time);
  }
}

// ==================== 12.5 掉落物 ====================
class DropItem extends Entity {
  constructor() {
    super();
    this.w = 20; this.h = 20;
    this.dropType = 'part'; // 'part' | 'weapon' | 'coin'
    this.dropId = '';
    this.amount = 0;
    this.dColor = '#00ffcc';
    this.label = '';
    this.lifeTimer = 10;
  }
  reset() {
    this.alive = false;
    this.x = 0; this.y = 0;
    this.dropType = 'part';
    this.dropId = '';
    this.amount = 0;
    this.dColor = '#00ffcc';
    this.label = '';
    this.lifeTimer = 10;
  }
  init(type, id, amount, x, y, color, label) {
    this.dropType = type;
    this.dropId = id;
    this.amount = amount;
    this.x = x;
    this.y = y;
    this.w = 20; this.h = 20;
    this.dColor = color;
    this.label = label;
    this.lifeTimer = 10;
    this.alive = true;
  }
  update(dt) {
    this.y += CONFIG.DROP_SPEED * dt;
    this.lifeTimer -= dt;
    if (this.y > CONFIG.HEIGHT - 72 || this.lifeTimer <= 0) this.alive = false;
  }
  draw(ctx, time) {
    if (!this.alive) return;
    const flicker = this.lifeTimer < 3 && Math.floor(time * 6) % 2 === 0;
    if (flicker) return;
    ctx.fillStyle = this.dColor;
    ctx.shadowColor = this.dColor;
    ctx.shadowBlur = 10;
    ctx.font = 'bold 16px "Courier New"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.label, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'start';
  }
}

// ==================== 13. 背景 ====================
class Background {
  constructor() {
    // 远景星星
    this.stars = [];
    for (let i = 0; i < CONFIG.STAR_COUNT; i++) {
      this.stars.push({
        x: rand(0, CONFIG.WIDTH),
        y: rand(0, CONFIG.HEIGHT),
        size: rand(0.5, 2.5),
        speed: rand(15, 50),
        alpha: rand(0.3, 1),
        twinkleSpeed: rand(2, 6),
        twinkleOffset: rand(0, TAU),
        color: ['#c8dcff', '#ffe8c8', '#ffc8c8', '#c8ffd4', '#d4c8ff'][randInt(0, 4)],
      });
    }

    // 流星
    this.shootingStars = [];
    this._spawnShootingStar();

    // 星云
    this.nebulae = [];
    for (let i = 0; i < 6; i++) {
      this.nebulae.push({
        x: rand(0, CONFIG.WIDTH),
        y: rand(0, CONFIG.HEIGHT),
        r: rand(60, 140),
        color: ['#2a0a5e', '#0a2a5e', '#2a0a4e', '#1a0a4e', '#0a1a3e', '#3a0a3e'][i],
        speed: rand(4, 15),
      });
    }

    // 星球
    this.planets = [];
    const planetDefs = [
      { r: 55, color: '#e87830', glow: '#ff9944', type: 'gas_giant',   ring: true,  ringColor: '#dda060', ringAlpha: 0.25 },
      { r: 38, color: '#4488cc', glow: '#66aadd', type: 'ice',         ring: false, craters: true },
      { r: 45, color: '#887766', glow: '#aa9988', type: 'rocky',       ring: false, craters: true },
      { r: 28, color: '#88cc44', glow: '#aadd66', type: 'forest',      ring: false, craters: false },
      { r: 65, color: '#cc6644', glow: '#dd8866', type: 'lava',        ring: false, lavaCracks: true },
      { r: 50, color: '#9988cc', glow: '#bbaadd', type: 'gas_giant',   ring: true,  ringColor: '#aa99cc', ringAlpha: 0.2 },
    ];
    planetDefs.forEach((def, i) => {
      this.planets.push({
        x: rand(0, CONFIG.WIDTH),
        y: rand(-300, CONFIG.HEIGHT + 200),
        r: def.r,
        color: def.color,
        glow: def.glow,
        type: def.type,
        ring: def.ring || false,
        ringColor: def.ringColor || '',
        ringAlpha: def.ringAlpha || 0,
        lavaCracks: def.lavaCracks || false,
        speed: rand(3, 10),
        rotation: rand(0, TAU),
        rotSpeed: rand(0.02, 0.08),
        craters: def.craters ? this._genCraters(def.r) : [],
        atmosphereAlpha: rand(0.08, 0.18),
      });
    });
  }

  _genCraters(r) {
    const craters = [];
    const count = randInt(3, 7);
    for (let i = 0; i < count; i++) {
      craters.push({
        angle: rand(0, TAU),
        dist: rand(r * 0.15, r * 0.7),
        r: rand(r * 0.06, r * 0.18),
        alpha: rand(0.15, 0.35),
      });
    }
    return craters;
  }

  _spawnShootingStar() {
    this.shootingStars.push({
      x: rand(CONFIG.WIDTH * 0.2, CONFIG.WIDTH),
      y: rand(-50, CONFIG.HEIGHT * 0.3),
      vx: rand(-150, -40),
      vy: rand(80, 200),
      life: rand(0.6, 1.5),
      maxLife: 0,
      alpha: rand(0.5, 1),
    });
    this.shootingStars[this.shootingStars.length - 1].maxLife =
      this.shootingStars[this.shootingStars.length - 1].life;
  }

  update(dt) {
    // 星星
    this.stars.forEach(s => {
      s.y += s.speed * dt;
      if (s.y > CONFIG.HEIGHT + 5) { s.y = -5; s.x = rand(0, CONFIG.WIDTH); }
    });

    // 星云
    this.nebulae.forEach(n => {
      n.y += n.speed * dt;
      if (n.y > CONFIG.HEIGHT + n.r) { n.y = -n.r; n.x = rand(0, CONFIG.WIDTH); }
    });

    // 星球
    this.planets.forEach(p => {
      p.y += p.speed * dt;
      p.rotation += p.rotSpeed * dt;
      if (p.y > CONFIG.HEIGHT + p.r * 2) {
        p.y = -p.r * 2;
        p.x = rand(0, CONFIG.WIDTH);
      }
    });

    // 流星
    this.shootingStars.forEach(s => {
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.life -= dt;
    });
    this.shootingStars = this.shootingStars.filter(s => s.life > 0);
    if (this.shootingStars.length < 2 && Math.random() < 0.003) {
      this._spawnShootingStar();
    }
  }

  draw(ctx, time) {
    // 底色
    const bgGrad = ctx.createLinearGradient(0, 0, 0, CONFIG.HEIGHT);
    bgGrad.addColorStop(0, '#05050f');
    bgGrad.addColorStop(0.5, '#0a0818');
    bgGrad.addColorStop(1, '#0c0a20');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

    // 星云
    this.nebulae.forEach(n => {
      const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
      grad.addColorStop(0, n.color);
      grad.addColorStop(0.6, 'transparent');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(n.x - n.r, n.y - n.r, n.r * 2, n.r * 2);
    });

    // 星球
    this.planets.forEach(p => this._drawPlanet(ctx, p, time));

    // 星星
    this.stars.forEach(s => {
      const alpha = s.alpha * (0.6 + 0.4 * Math.sin(time * s.twinkleSpeed + s.twinkleOffset));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
      // 亮星加十字光晕
      if (s.size > 1.8 && alpha > 0.7) {
        ctx.globalAlpha = alpha * 0.3;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(s.x - s.size * 3, s.y);
        ctx.lineTo(s.x + s.size * 3, s.y);
        ctx.moveTo(s.x, s.y - s.size * 3);
        ctx.lineTo(s.x, s.y + s.size * 3);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    });

    // 流星
    this.shootingStars.forEach(s => {
      const alpha = s.life / s.maxLife * s.alpha;
      const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 0.02, s.y - s.vy * 0.02);
      grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
      grad.addColorStop(0.3, `rgba(200,220,255,${alpha * 0.6})`);
      grad.addColorStop(1, 'rgba(200,220,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * 0.04, s.y - s.vy * 0.04);
      ctx.stroke();
      // 流星头部亮点
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 1.5, 0, TAU);
      ctx.fill();
    });

    // 扫描线
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    for (let y = 0; y < CONFIG.HEIGHT; y += 4) {
      ctx.fillRect(0, y, CONFIG.WIDTH, 1);
    }
  }

  _drawPlanet(ctx, p, time) {
    ctx.save();
    ctx.translate(p.x, p.y);

    // 大气光晕
    const atmoGrad = ctx.createRadialGradient(0, 0, p.r * 0.85, 0, 0, p.r * 1.35);
    atmoGrad.addColorStop(0, 'transparent');
    atmoGrad.addColorStop(0.5, p.glow);
    atmoGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = atmoGrad;
    ctx.globalAlpha = p.atmosphereAlpha;
    ctx.beginPath();
    ctx.arc(0, 0, p.r * 1.35, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;

    // 光环（土星环）
    if (p.ring) {
      ctx.save();
      ctx.rotate(Math.PI * 0.22);
      ctx.scale(1, 0.25);
      ctx.globalAlpha = p.ringAlpha;
      ctx.strokeStyle = p.ringColor;
      ctx.lineWidth = p.r * 0.22;
      ctx.beginPath();
      ctx.arc(0, 0, p.r * 1.3, 0, TAU);
      ctx.stroke();
      // 内环
      ctx.globalAlpha = p.ringAlpha * 0.6;
      ctx.lineWidth = p.r * 0.08;
      ctx.beginPath();
      ctx.arc(0, 0, p.r * 1.1, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // 球体
    const bodyGrad = ctx.createRadialGradient(-p.r * 0.25, -p.r * 0.3, p.r * 0.05, 0, 0, p.r);
    bodyGrad.addColorStop(0, p.glow);
    bodyGrad.addColorStop(0.5, p.color);
    bodyGrad.addColorStop(1, 'rgba(5,5,10,0.9)');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.arc(0, 0, p.r, 0, TAU);
    ctx.fill();

    // 陨石坑
    if (p.craters && p.craters.length > 0) {
      p.craters.forEach(c => {
        const cx = Math.cos(c.angle + p.rotation) * c.dist;
        const cy = Math.sin(c.angle + p.rotation) * c.dist;
        ctx.fillStyle = `rgba(0,0,0,${c.alpha})`;
        ctx.beginPath();
        ctx.arc(cx, cy, c.r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = `rgba(255,255,255,${c.alpha * 0.3})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.arc(cx + c.r * 0.1, cy - c.r * 0.1, c.r * 0.85, 0, TAU);
        ctx.stroke();
      });
    }

    // 熔岩裂缝
    if (p.lavaCracks) {
      ctx.strokeStyle = '#ff4400';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#ff4400';
      ctx.shadowBlur = 6;
      ctx.globalAlpha = 0.6 + 0.2 * Math.sin(time * 2 + p.rotation);
      for (let i = 0; i < 5; i++) {
        const a = p.rotation + TAU / 5 * i;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * p.r * 0.15, Math.sin(a) * p.r * 0.15);
        const len = p.r * rand(0.3, 0.7);
        ctx.lineTo(Math.cos(a + rand(-0.15, 0.15)) * len, Math.sin(a + rand(-0.15, 0.15)) * len);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    // 气态巨行星条纹
    if (p.type === 'gas_giant') {
      ctx.globalAlpha = 0.12;
      for (let i = -4; i <= 4; i++) {
        const sy = i * p.r * 0.18;
        const w = Math.sqrt(p.r * p.r - sy * sy) * 2;
        ctx.fillStyle = i % 2 === 0 ? '#fff' : '#000';
        ctx.fillRect(-w / 2, sy - p.r * 0.06, w, p.r * 0.12);
      }
      ctx.globalAlpha = 1;
    }

    // 高光
    const highlightGrad = ctx.createRadialGradient(-p.r * 0.3, -p.r * 0.35, 0, -p.r * 0.3, -p.r * 0.35, p.r * 0.5);
    highlightGrad.addColorStop(0, 'rgba(255,255,255,0.12)');
    highlightGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = highlightGrad;
    ctx.beginPath();
    ctx.arc(0, 0, p.r, 0, TAU);
    ctx.fill();

    ctx.restore();
  }
}

// ==================== 14. HUD ====================
class HUD {
  draw(ctx, state) {
    const { score, combo, highScore, player, boss, gameTime, difficulty, mode, timeLimit, inventory, bossBattleStart } = state;

    // 顶部信息栏背景
    const topBarH = 28;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, CONFIG.WIDTH, topBarH);

    // 模式标签
    const modeNames = { endless: '无尽', timed: '限时', boss: 'BOSS' };
    const modeColors = { endless: '#00d4ff', timed: '#ffaa00', boss: '#b44dff' };
    ctx.fillStyle = modeColors[mode] || '#00d4ff';
    ctx.font = 'bold 10px "Microsoft YaHei"';
    ctx.textAlign = 'left';
    ctx.fillText(`[${modeNames[mode]}]`, 8, 12);

    ctx.fillStyle = '#e0e8ff';
    ctx.font = '11px "Courier New"';
    ctx.fillText(`⭐ ${score.toLocaleString()}`, 8, 24);
    if (combo > 1) {
      ctx.fillStyle = '#ffaa00';
      ctx.fillText(`连击 x${combo}`, 130, 24);
    }

    // 限时模式倒计时
    if (mode === 'timed') {
      const remain = Math.ceil(timeLimit);
      const timerColor = remain <= 10 ? '#ff2d55' : remain <= 30 ? '#ffaa00' : '#00ffcc';
      ctx.fillStyle = timerColor;
      ctx.font = 'bold 13px "Courier New"';
      ctx.textAlign = 'center';
      const min = Math.floor(remain / 60);
      const sec = remain % 60;
      ctx.fillText(`${min}:${sec.toString().padStart(2, '0')}`, CONFIG.WIDTH / 2, 24);
    }

    // Boss 模式战斗计时
    if (mode === 'boss' && bossBattleStart > 0) {
      const btElapsed = (performance.now() - bossBattleStart) / 1000;
      const btColor = btElapsed <= 30 ? '#00ffcc' : btElapsed <= 60 ? '#ffaa00' : '#ff2d55';
      ctx.fillStyle = btColor;
      ctx.font = 'bold 13px "Courier New"';
      ctx.textAlign = 'center';
      ctx.fillText(`${btElapsed.toFixed(1)}s`, CONFIG.WIDTH / 2, 24);
    }

    ctx.fillStyle = '#888';
    ctx.textAlign = 'right';
    ctx.fillText(`最高: ${highScore.toLocaleString()}`, CONFIG.WIDTH - 8, 24);
    ctx.textAlign = 'left';

    // Boss 血条（醒目大号）
    if (boss && boss.alive && !boss.entering) {
      const barW = CONFIG.WIDTH - 40, barH = 14;
      const bx = 20, by = 36;

      // 背景
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(bx, by - 6, barW, barH + 14);

      // Boss 名称和HP数值
      const bossName = boss.name || 'BOSS';
      ctx.fillStyle = boss.color || '#b44dff';
      ctx.font = 'bold 11px "Courier New"';
      ctx.textAlign = 'left';
      ctx.fillText(`${bossName}`, bx + 4, by - 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px "Courier New"';
      ctx.fillText(`HP ${Math.ceil(boss.hp)} / ${boss.maxHp}`, bx + barW - 4, by - 2);

      // 血条外框
      const ratio = boss.hp / boss.maxHp;
      ctx.fillStyle = '#111';
      ctx.strokeStyle = boss.color || '#b44dff';
      ctx.shadowColor = boss.color || '#b44dff';
      ctx.shadowBlur = 10;
      ctx.lineWidth = 2;
      ctx.fillRect(bx, by, barW, barH);
      ctx.strokeRect(bx, by, barW, barH);
      ctx.shadowBlur = 0;

      // 血条填充
      const barColor = ratio > 0.66 ? '#00ff66' : ratio > 0.33 ? '#ffaa00' : '#ff2d55';
      const grad = ctx.createLinearGradient(bx, by, bx, by + barH);
      grad.addColorStop(0, barColor);
      grad.addColorStop(1, ratio > 0.66 ? '#00aa44' : ratio > 0.33 ? '#cc7700' : '#cc0000');
      ctx.fillStyle = grad;
      ctx.fillRect(bx, by, barW * ratio, barH);

      // 血条内部高光
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(bx, by, barW * ratio, barH / 2);

      // 阶段阈值标记线
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = 'rgba(255,215,0,0.6)';
      ctx.lineWidth = 1;
      // 66% 线（第1阶段，狂暴）
      const line66 = bx + barW * 0.66;
      ctx.beginPath(); ctx.moveTo(line66, by); ctx.lineTo(line66, by + barH); ctx.stroke();
      // 33% 线（第2阶段，濒死）
      const line33 = bx + barW * 0.33;
      ctx.beginPath(); ctx.moveTo(line33, by); ctx.lineTo(line33, by + barH); ctx.stroke();
      ctx.setLineDash([]);

      // 阶段标注
      ctx.fillStyle = 'rgba(255,215,0,0.8)';
      ctx.font = '8px "Courier New"';
      ctx.textAlign = 'center';
      ctx.fillText('P1', line66, by + barH + 7);
      ctx.fillText('P2', line33, by + barH + 7);

      // 阶段信息
      ctx.fillStyle = '#e0e8ff';
      ctx.font = 'bold 10px "Courier New"';
      ctx.fillText(`阶段 ${boss.phase}`, CONFIG.WIDTH / 2, by + barH + 7);
      ctx.textAlign = 'left';
    }

    // 底部状态栏
    const by = CONFIG.HEIGHT - 72;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, by, CONFIG.WIDTH, 72);

    // 宇宙边界线
    ctx.strokeStyle = 'rgba(0, 212, 255, 0.5)';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(0, by);
    ctx.lineTo(CONFIG.WIDTH, by);
    ctx.stroke();
    ctx.shadowBlur = 0;

    this._drawPlayerBar(ctx, player, 'P1', 8, by);

    // 商店技能栏（底部，1行×6列：数字键1-5 + 轰炸B）
    if (inventory) {
      const shopSkillIds = Object.keys(CONFIG.SHOP_SKILLS);
      const totalSlots = 6; // 5个技能 + 1个轰炸
      const cols = 6, rows = 1;
      const slotW = 48, slotH = 30, slotGap = 4;
      const panelW = cols * slotW + (cols - 1) * slotGap + 16;
      const panelH = rows * slotH + (rows - 1) * slotGap + 16;
      const panelX = CONFIG.WIDTH - panelW - 4;
      const panelY = by + 13;

      // 技能使用提示（前5秒显示）
      if (gameTime < 5) {
        ctx.fillStyle = 'rgba(255,215,0,0.8)';
        ctx.font = '9px "Microsoft YaHei"';
        ctx.textAlign = 'right';
        ctx.fillText('按 1-5 使用技能 | B 轰炸 | Z 加速', CONFIG.WIDTH - 10, panelY - 2);
      }

      // 面板背景
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.strokeStyle = 'rgba(0,212,255,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(panelX, panelY, panelW, panelH, 6);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      // 绘制所有6个槽位：前5个技能 + 1个轰炸
      for (let i = 0; i < totalSlots; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const sx = panelX + 8 + col * (slotW + slotGap);
        const sy = panelY + 8 + row * (slotH + slotGap);
        const isBomb = i === 5;

        let cfg, owned, charge, isReady, isActive, color;
        if (isBomb) {
          cfg = { icon: '💣', key: 'B', color: '#ffaa00' };
          owned = player.bombs > 0;
          charge = player.bombs;
          isReady = owned;
          isActive = false;
          color = '#ffaa00';
        } else {
          const skillId = shopSkillIds[i];
          cfg = CONFIG.SHOP_SKILLS[skillId];
          charge = inventory.getShopSkillCount(skillId);
          owned = charge > 0;
          isReady = owned;
          isActive = player.shopSkillActive === skillId;
          color = cfg.color;
        }

        // 发光效果
        if (isReady) {
          const pulse = Math.sin(performance.now() / 500) * 0.3 + 0.7;
          ctx.shadowColor = color;
          ctx.shadowBlur = 8 * pulse;
        }

        // 槽背景
        ctx.fillStyle = isActive ? 'rgba(0,212,255,0.3)' : 'rgba(0,0,0,0.5)';
        ctx.strokeStyle = owned ? (isReady ? color : '#555') : '#333';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(sx, sy, slotW, slotH, 5);
        ctx.fill();
        ctx.stroke();

        // 图标
        ctx.fillStyle = owned ? (isReady ? '#fff' : '#666') : '#333';
        ctx.font = '16px Arial';
        ctx.fillText(cfg.icon, sx + slotW / 2, sy + 14);

        // 快捷键
        ctx.fillStyle = owned ? (isReady ? color : '#555') : '#333';
        ctx.font = 'bold 9px "Courier New"';
        ctx.fillText(cfg.key, sx + slotW / 2, sy + 26);

        // 剩余次数（仅非轰炸显示）
        if (!isBomb && charge > 0) {
          ctx.fillStyle = color;
          ctx.font = 'bold 8px "Courier New"';
          ctx.fillText(`x${charge}`, sx + slotW - 10, sy + 7);
        } else if (!isBomb) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(sx, sy, slotW, slotH);
        }
        // 轰炸显示数量
        if (isBomb) {
          ctx.fillStyle = color;
          ctx.font = 'bold 8px "Courier New"';
          ctx.fillText(`x${charge}`, sx + slotW - 10, sy + 7);
        }
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
      }
    }
  }

  _drawPlayerBar(ctx, player, label, ox, by) {
    if (!player || !player.alive) {
      ctx.fillStyle = '#ff2d55';
      ctx.font = '11px "Courier New"';
      ctx.fillText(`${label} 阵亡`, ox + 10, by + 11);
      return;
    }
    const hpBarW = 90, hpBarH = 6;
    const hpx = ox + 18, hpy = by + 6;

    ctx.fillStyle = label === 'P1' ? '#00d4ff' : '#00ffcc';
    ctx.font = '11px "Courier New"';
    ctx.fillText(label, ox + 10, by + 8);

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(hpx, hpy, hpBarW, hpBarH);
    ctx.fillStyle = player.hp / player.maxHp > 0.3 ? '#00ff66' : '#ff2d55';
    ctx.fillRect(hpx, hpy, hpBarW * (player.hp / player.maxHp), hpBarH);

    // 护盾
    if (player.shieldHp > 0) {
      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(hpx, hpy + 5, hpBarW, 3);
      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(hpx, hpy + 5, hpBarW * (player.shieldHp / 3), 3);
    }

    ctx.fillStyle = '#00d4ff';
    ctx.font = '10px "Courier New"';
    ctx.fillText(`Lv.${player.fireLevel}`, hpx, hpy + 13);
    if (player.drones > 0) {
      ctx.fillStyle = '#b44dff';
      ctx.fillText(`+${player.drones}`, hpx + 60, hpy + 13);
    }
  }
}

// ==================== 15. 场景 ====================
class BattleScene {
  constructor() {
    this.player = new Player();
    this.bullets = [];
    this.enemies = [];
    this.particles = [];
    this.floatingTexts = [];
    this.drops = [];
    this.background = new Background();
    this.hud = new HUD();
    this.boss = null;
    this.score = 0;
    this.highScore = parseInt(localStorage.getItem('planeGameHighScore') || '0');
    this.combo = 0;
    this.comboTimer = 0;
    this.gameTime = 0;
    this.difficulty = 1;
    this.enemySpawnTimer = 0;
    this.bossTimer = 0;
    this.paused = false;
    this.gameOver = false;
    this.killCount = 0;
    this.mode = 'endless';
    this.timeLimit = 120;
    this.win = false;
    this.backClicked = false;
    this.bossIntro = false;   // Boss 模式开局展示
    this.quitConfirm = false;  // 退出确认弹窗
    this._bossStars = 0;
    this._bossBattleStart = 0; // Boss 战斗开始时间
    this._bossBattleTime = 0;  // Boss 通关用时（秒）
    this._explosionPhase = 0;  // 爆炸动画阶段
    this._explosionType = '';  // death / victory
    this._explosionCenter = null;  // 爆炸中心坐标
    this._bossRewardCoins = 0;
    this._bossRewardParts = 0;
    this.inventory = null; // 由 Game 注入

    // 对象池
    this.bulletPool = new ObjectPool(() => new Bullet(), b => b.reset());
    this.enemyPool = new ObjectPool(() => new Enemy(), e => e.reset());
    this.particlePool = new ObjectPool(() => new Particle(), p => p.reset());
    this.dropPool = new ObjectPool(() => new DropItem(), d => d.reset());
  }

  start(mode = 'endless', audio = null) {
    this.mode = mode;
    this.player.reset();
    this.player.applyUpgrades(this.inventory);
    this.bullets = [];
    this.enemies = [];
    this.particles = [];
    this.floatingTexts = [];
    this.drops = [];
    this.boss = null;
    this.bosses = [];
    this.score = 0;
    this.combo = 0;
    this.comboTimer = 0;
    this.gameTime = 0;
    this.difficulty = 1;
    this.enemySpawnTimer = 0;
    this.bossTimer = 0;
    this.paused = false;
    this.gameOver = false;
    this.win = false;
    this.killCount = 0;
    this.timeLimit = 120;
    this.bossStageCleared = false;
    this.bossIntro = false;
    this._bossBriefing = false;
    this.quitConfirm = false;
    this._bossStars = 0;
    this._bossBattleStart = 0;
    this._bossBattleTime = 0;
    this._explosionPhase = 0;
    this._explosionType = '';
    this._explosionCenter = null;
    this._bossRewardCoins = 0;
    this._bossRewardParts = 0;
    this._bossArrival = false;
    this._bossArrivalTimer = 0;
    this._bossArrivalShown = false;
    this._preBossPhase = false;
    this._preBossTimer = 0;

    if (mode === 'timed') {
      this.timeLimit = 120;
    } else if (mode === 'boss') {
      this.bossIntro = true;
      this._bossBriefing = false;
      this._preBossPhase = false;
      this._bossArrival = false;
      this._bossArrivalShown = false;
    }
  }

  update(dt, input, audio) {
    // 爆炸动画阶段：冻结游戏逻辑，只更新粒子
    if (this._explosionPhase > 0) {
      this._explosionPhase -= dt;
      // 更新粒子
      this.particles.forEach(p => { if (p.alive) p.update(dt); });
      this._cleanup();
      if (this.screenShake > 0) this.screenShake -= dt;
      if (this._explosionPhase <= 0) {
        this.gameOver = true;
      }
      return;
    }

    if (this.paused || this.gameOver || this.bossIntro || this._bossBriefing || this.quitConfirm) return;

    this.gameTime += dt;
    this.difficulty = Math.floor(this.gameTime / CONFIG.DIFFICULTY_INTERVAL) + 1;
    this.comboTimer -= dt;
    if (this.comboTimer <= 0) this.combo = 0;

    // Boss模式：前5秒出小兵，然后BOSS降临（只触发一次）
    if (this.mode === 'boss' && this._preBossPhase && !this._bossArrival) {
      this._preBossTimer += dt;
      this._spawnPreBossEnemies(dt);
      if (this._preBossTimer >= 5) {
        this._preBossPhase = false; // 防止重复触发
        this._bossArrival = true;
        this._bossArrivalTimer = 0;
        this.screenShake = 1.0;
        this._spawnStageBoss(audio);
      }
    }
    // Boss降临特效计时
    if (this._bossArrival) {
      this._bossArrivalTimer += dt;
      if (this._bossArrivalTimer >= 2.5) {
        this._bossArrival = false;
        this._bossArrivalShown = true;
      }
    }

    // 限时模式倒计时
    if (this.mode === 'timed') {
      this.timeLimit -= dt;
      if (this.timeLimit <= 0) {
        this.timeLimit = 0;
        this.gameOver = true;
        this.win = true;
        if (this.score > this.highScore) {
          this.highScore = this.score;
          localStorage.setItem('planeGameHighScore', this.highScore);
        }
        audio.stopMusic();
        return;
      }
    }

    // 背景
    this.background.update(dt);

    // P1 玩家
    this.player.update(dt, input);

    // 核爆技能
    if (this.player._nukeTriggered) {
      this.player._nukeTriggered = false;
      audio.sfx_bomb();
      this.enemies.forEach(e => {
        if (!e.isBoss) {
          this._spawnExplosion(e.x, e.y, e.color, 8);
          this.score += e.score;
          e.alive = false;
        }
      });
      // Boss 受伤
      if (this.boss && this.boss.alive) {
        this.boss.takeDamage(50);
        this._spawnExplosion(this.boss.x, this.boss.y, '#ff0000', 40);
      }
      // 清除敌弹
      this.bullets.forEach(b => { if (!b.isPlayer) b.alive = false; });
    }

    // P1 射击
    if (this.player.alive && input.isFire() && this.player.canFire()) {
      this.player.resetFireTimer();
      this._spawnPlayerBullets(this.player);
      audio.sfx_shoot();
    }

    // P1 僚机
    if (this.player.alive) this._updateDrones(this.player, audio);

    // P1 炸弹
    if (this.player.alive && (input.isBomb() || input.isBombKey()) && this.player.bombs > 0) {
      this.player.bombs--;
      this._useBomb(audio);
    }

    // 技能快捷键
    if (this.player.alive && this.inventory && this.inventory.unlockedSkills.length > 0) {
      for (const skillId of this.inventory.unlockedSkills) {
        const cfg = CONFIG.SKILLS[skillId];
        if (cfg && input.isSkillKey(cfg.key)) {
          if (this.player.tryUseSkill(skillId, this.inventory, audio)) {
            this._spawnFloatingText(this.player.x, this.player.y - 30, cfg.name, '#ffd700');
          }
        }
      }
    }

    // 商店技能快捷键（数字键1-5）- 一次性消耗
    if (this.player.alive && this.inventory) {
      for (const skillId of Object.keys(CONFIG.SHOP_SKILLS)) {
        const cfg = CONFIG.SHOP_SKILLS[skillId];
        if (cfg && input.isShopSkillKey(cfg.key) && this.inventory.hasShopSkill(skillId)) {
          if (this.player.tryUseShopSkill(skillId, this.inventory, audio)) {
            this._spawnFloatingText(this.player.x, this.player.y - 30, cfg.name + '!', cfg.color);
          }
        }
      }
    }

    // 生成敌机（Boss 模式跳过）
    if (this.mode !== 'boss') {
      this._spawnEnemies(dt);
    }

    // Boss 计时（非 Boss 模式）
    if (this.mode !== 'boss') {
      if (!this.boss || !this.boss.alive) {
        this.bossTimer += dt;
        if (this.bossTimer >= CONFIG.BOSS_INTERVAL) {
          this.bossTimer = 0;
          this._spawnBoss(audio);
        }
      }
    }

    // 更新所有实体
    this._updateEntities(dt, audio);

    // 碰撞检测
    this._checkCollisions(audio);

    // 清理
    this._cleanup();
  }

  _spawnPlayerBullets(player) {
    const baseDamage = (1 + player.totalDamage) * player.powerMultiplier;
    const critDmg = player.critChance > 0 && Math.random() < player.critChance ? player.critMultiplier : 1;
    const dmg = baseDamage * critDmg;
    const points = player.getBulletSpawnPoints();
    points.forEach(([px, py]) => {
      const b = this.bulletPool.get();
      b.init(px, py, 0, -CONFIG.BULLET_SPEED_PLAYER, true, dmg, false, 4, 10);
      if (critDmg > 1) b.color = '#ffd700';
      this.bullets.push(b);
    });
    // 军备升级额外弹幕 + 段位额外弹幕
    const spreadMult = player._spreadActive ? 2 : 1;
    const totalExtra = player.totalBulletCount * spreadMult;
    for (let i = 0; i < totalExtra; i++) {
      const spread = (i % 2 === 0 ? 1 : -1) * Math.ceil((i + 1) / 2) * 8;
      const b = this.bulletPool.get();
      b.init(player.x + spread, player.y - 20, 0, -CONFIG.BULLET_SPEED_PLAYER, true, dmg, false, 4, 10);
      if (critDmg > 1) b.color = '#ffd700';
      this.bullets.push(b);
    }
    // 火力5级激光
    if (player.fireLevel >= 5) {
      const laser = this.bulletPool.get();
      laser.init(player.x, player.y - 120, 0, 0, true, baseDamage * 0.5, false, 4, 240);
      laser.laser = true;
      laser.laserEndX = player.x;
      laser.laserEndY = player.y;
      laser.damage = baseDamage * 0.5;
      this.bullets.push(laser);
    }
  }

  _updateDrones(player, audio) {
    const dronePositions = player.getDronePositions();
    const baseDamage = (1 + player.totalDamage) * player.powerMultiplier;
    dronePositions.forEach(([dx, dy]) => {
      if (Math.random() < 0.5) {
        const b = this.bulletPool.get();
        b.init(dx, dy - 6, 0, -CONFIG.BULLET_SPEED_PLAYER, true, baseDamage, false, 3, 6);
        b.color = '#b44dff';
        this.bullets.push(b);
        audio.sfx_droneShoot();
      }
    });
  }

  _spawnEnemies(dt) {
    if (this.boss && this.boss.alive) return;
    const intervals = [2.2, 1.8, 1.5, 1.2, 1.0, 0.8];
    const idx = clamp(this.difficulty - 1, 0, intervals.length - 1);

    this.enemySpawnTimer -= dt;
    if (this.enemySpawnTimer <= 0) {
      this.enemySpawnTimer = intervals[idx];

      const x = rand(30, CONFIG.WIDTH - 30);
      const y = rand(-20, -80);

      // 分裂敌机出现概率（难度3+）
      if (this.difficulty >= 3 && Math.random() < 0.08) {
        const e = this.enemyPool.get();
        e.initAsSplitter(x, y, this.difficulty);
        this.enemies.push(e);
        return;
      }

      // 随机选择敌人类型
      const types = ['normal', 'normal', 'normal', 'fast', 'tank'];
      if (this.difficulty >= 3) types.push('zigzag', 'zigzag');
      if (this.difficulty >= 5) types.push('tank', 'tank');
      const type = types[Math.floor(Math.random() * types.length)];

      const count = (type === 'normal') ? randInt(1, Math.min(1 + this.difficulty, 5)) : 1;
      for (let i = 0; i < count; i++) {
        const enemy = this.enemyPool.get();
        enemy.init(x + i * 10, y - i * 15, this.difficulty, type);
        this.enemies.push(enemy);
      }
    }
  }

  _spawnBoss(audio) {
    audio.sfx_bossWarning();
    this.boss = new Boss();
    this.boss.init();
    // 清除场上敌机
    this.enemies.forEach(e => { e.alive = false; });
    this._bossBattleStart = performance.now();
  }

  // Boss 关卡模式：生成关卡 Boss
  _spawnPreBossEnemies(dt) {
    // 预Boss阶段每1.5秒出一波小兵
    this.enemySpawnTimer += dt;
    if (this.enemySpawnTimer >= 1.5) {
      this.enemySpawnTimer = 0;
      const types = ['normal', 'fast', 'normal', 'tank'];
      const type = types[Math.floor(Math.random() * types.length)];
      const count = 2 + Math.floor(this._preBossTimer);
      for (let i = 0; i < count; i++) {
        const enemy = this.enemyPool.get();
        const x = 60 + Math.random() * (CONFIG.WIDTH - 120);
        enemy.init(x, -30 - i * 20, this.difficulty, type);
        this.enemies.push(enemy);
      }
    }
  }

  _bossSpawnMinion(boss) {
    // Boss生小兵：从Boss位置生成2-3个小飞机
    const count = boss.phase === 3 ? 4 : boss.phase === 2 ? 3 : 2;
    const types = ['small', 'small', 'fast'];
    for (let i = 0; i < count; i++) {
      const enemy = this.enemyPool.get();
      const type = types[i % types.length];
      enemy.init(boss.x + (Math.random() - 0.5) * 60, boss.y + 30, this.difficulty, type);
      enemy.vy = 40 + Math.random() * 60;
      this.enemies.push(enemy);
    }
  }

  _spawnStageBoss(audio) {
    if (!this.inventory) return;
    const stageCfg = this.inventory.getBossStageConfig();
    if (!stageCfg) return;
    if (audio) audio.sfx_bossWarning();
    
    const bossCount = stageCfg.bosses || 1;
    this.bosses = []; // 多Boss数组
    
    for (let i = 0; i < bossCount; i++) {
      const boss = new Boss();
      boss.init();
      boss.hp = stageCfg.hp;
      boss.maxHp = stageCfg.hp;
      boss.color = stageCfg.color;
      boss.shape = stageCfg.shape;
      boss.name = stageCfg.name;
      boss.stageId = stageCfg.id;
      boss.bossIndex = i;
      boss.bossCount = bossCount;
      // 多Boss时偏移位置
      if (bossCount > 1) {
        boss.y = -80 - i * 36;
        boss.enterDelay = i * 0.5;
      }
      this.bosses.push(boss);
      this.enemies.push(boss); // 确保Boss在敌机列表中渲染
    }
    
    this.boss = this.bosses[0]; // 兼容旧代码
    // 清除场上敌机（保留Boss）
    this.enemies.forEach(e => { if (!e.isBoss) e.alive = false; });
    this._bossBattleStart = performance.now();
    this._bossArrival = true; // 触发入场特效
    this._bossArrivalTimer = 0;
    this.screenShake = 0.8;
  }

  _useBomb(audio, player = null) {
    audio.sfx_bomb();
    // 清屏
    this.enemies.forEach(e => {
      if (!e.isBoss) {
        this._spawnExplosion(e.x, e.y, e.color, 10);
        this.score += e.score;
        e.alive = false;
      }
    });
    // Boss 受伤
    if (this.boss && this.boss.alive) {
      this.boss.takeDamage(20);
      this._spawnExplosion(this.boss.x, this.boss.y, '#ffaa00', 30);
    }
    // 清除敌弹
    this.bullets.forEach(b => { if (!b.isPlayer) b.alive = false; });
    // 屏幕震动效果
    this.screenShake = 0.2;
  }

  _updateEntities(dt, audio) {
    // 子弹
    this.bullets.forEach(b => {
      if (!b.alive) return;
      b.update(dt);
      if (b.tracking) b._trackTarget = this.player;
      // 激光持续跟随
      if (b.laser) {
        b.x = this.player.x;
        b.y = this.player.y - 200;
        b.laserEndX = this.player.x;
        b.laserEndY = this.player.y;
      }
    });

    // 敌机（时间减速效果）
    const slowDt = this.player.slowActive ? dt * 0.4 : dt;
    this.enemies.forEach(e => {
      if (!e.alive) return;
      e.update(slowDt, this.player);
      // 敌机射击
      if (e.canFire() && !e.isBoss) {
        e.resetFireTimer();
        this._enemyFire(e, audio);
      }
    });

    // Boss（也受减速影响，支持多Boss + 生小兵）
    const bosses = this.bosses && this.bosses.length > 0 ? this.bosses : (this.boss ? [this.boss] : []);
    let anyBossAlive = false;
    bosses.forEach(boss => {
      if (!boss || !boss.alive) return;
      anyBossAlive = true;
      boss.update(slowDt, this.player);
      if (boss.canFire()) {
        boss.resetFireTimer();
        this._bossFire(boss, audio);
      }
      // Boss生小兵
      if (boss.canSpawnMinion()) {
        boss.resetSpawnTimer();
        this._bossSpawnMinion(boss);
      }
    });
    // 更新this.boss引用
    if (bosses.length > 0) this.boss = bosses.find(b => b.alive) || null;

    // 掉落物
    this.drops.forEach(d => { if (d.alive) { d.update(dt); if (this.player.magnetActive) this._magnetPull(d, dt); } });

    // 粒子
    this.particles.forEach(p => { if (p.alive) p.update(dt); });

    // 浮动文字
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const ft = this.floatingTexts[i];
      ft.life -= dt;
      ft.y -= 40 * dt;
      ft.alpha = Math.max(0, ft.life / 1.5);
      if (ft.life <= 0) { this.floatingTexts.splice(i, 1); }
    }

    // 屏幕震动衰减
    if (this.screenShake > 0) this.screenShake -= dt;
  }

  _enemyFire(enemy, audio) {
    // 普通敌人根据难度发射多弹
    if (enemy.type === 'normal' || enemy.type === 'small') {
      const bulletCount = this.difficulty >= 5 ? 3 : this.difficulty >= 3 ? 2 : 1;
      if (bulletCount === 1) return; // 难度低时不发射
      audio.sfx_enemyFire();
      const angle = Math.atan2(this.player.y - enemy.y, this.player.x - enemy.x);
      const spreadDeg = 20;
      for (let i = 0; i < bulletCount; i++) {
        const a = angle + (i - (bulletCount - 1) / 2) * (spreadDeg / Math.max(1, bulletCount - 1)) * Math.PI / 180;
        const b = this.bulletPool.get();
        b.init(enemy.x, enemy.y + enemy.h / 2, Math.cos(a) * CONFIG.BULLET_SPEED_ENEMY * 0.7, Math.sin(a) * CONFIG.BULLET_SPEED_ENEMY * 0.7, false, 1, false, 5, 5);
        this.bullets.push(b);
      }
      return;
    }
    if (enemy.type === 'fast' || enemy.type === 'rusher') {
      audio.sfx_enemyFire();
      const angle = Math.atan2(this.player.y - enemy.y, this.player.x - enemy.x);
      const b = this.bulletPool.get();
      b.init(enemy.x, enemy.y + enemy.h / 2, Math.cos(angle) * CONFIG.BULLET_SPEED_ENEMY * 0.7, Math.sin(angle) * CONFIG.BULLET_SPEED_ENEMY * 0.7, false, 1, false, 6, 6);
      this.bullets.push(b);
      return;
    }
    // 坦克和蛇形扇形弹幕 - 更多子弹，更慢速度
    const count = enemy.type === 'tank' ? 5 : enemy.type === 'elite' ? 5 : 4;
    const spread = enemy.type === 'tank' ? 60 : enemy.type === 'elite' ? 70 : 55;
    const angle = Math.atan2(this.player.y - enemy.y, this.player.x - enemy.x);
    for (let i = 0; i < count; i++) {
      const a = angle + (i - (count - 1) / 2) * (spread / (count - 1)) * Math.PI / 180;
      const b = this.bulletPool.get();
      b.init(enemy.x, enemy.y + enemy.h / 2, Math.cos(a) * CONFIG.BULLET_SPEED_ENEMY * 0.7, Math.sin(a) * CONFIG.BULLET_SPEED_ENEMY * 0.7, false, 1, false, 5, 5);
      this.bullets.push(b);
    }
  }

  _bossFire(boss, audio) {
    audio.sfx_bossFire();
    const count = boss.phase === 3 ? 5 : boss.phase === 2 ? 4 : 3;
    const spread = boss.phase === 3 ? 50 : boss.phase === 2 ? 48 : 45;
    const angle = Math.atan2(this.player.y - boss.y, this.player.x - boss.x);
    for (let i = 0; i < count; i++) {
      const a = angle + (i - (count - 1) / 2) * (spread / (count - 1)) * Math.PI / 180;
      const b = this.bulletPool.get();
      b.init(boss.x, boss.y + 50, Math.cos(a) * CONFIG.BULLET_SPEED_ENEMY * 0.75, Math.sin(a) * CONFIG.BULLET_SPEED_ENEMY * 0.75, false, 1, false, 5, 5);
      this.bullets.push(b);
    }

    // 无人机（仅阶段3，可被击毁）
    if (boss.phase >= 3) {
      const count = boss.phase === 3 ? 2 : 0;
      for (let i = 0; i < count; i++) {
        const e = this.enemyPool.get();
        if (!e) continue;
        e.init(boss.x + rand(-30, 30), boss.y + 40, this.difficulty, 'drone');
        e.movePattern = 'drone';
        this.enemies.push(e);
      }
    }
  }

  _checkCollisions(audio) {
    // 玩家子弹 vs 敌机
    for (const b of this.bullets) {
      if (!b.alive || !b.isPlayer) continue;
      for (const e of this.enemies) {
        if (!e.alive || e.isBoss) continue;
        if (b.collidesWith(e)) {
          b.alive = false;
          e.takeDamage(b.damage);
          if (!e.alive) {
            this._onEnemyKilled(e, audio);
          } else {
            audio.sfx_enemyHit();
          }
          break;
        }
      }
      // 玩家子弹 vs Boss（支持多Boss）
      const bosses = this.bosses && this.bosses.length > 0 ? this.bosses : (this.boss ? [this.boss] : []);
      bosses.forEach(boss => {
        if (b.alive && boss && boss.alive && b.collidesWith(boss)) {
          b.alive = false;
          boss.takeDamage(b.damage);
          this._spawnExplosion(b.x, b.y, '#ffaa00', 2);
          audio.sfx_enemyHit();
          if (!boss.alive) {
            this._onBossKilled(audio, boss);
          }
        }
      });
    }

    // 敌机子弹/碰撞 vs 玩家
    const checkPlayerHit = (player, label) => {
      if (!player.alive) return;
      // 敌弹
      for (const b of this.bullets) {
        if (!b.alive || b.isPlayer) continue;
        if (b.collidesWith(player)) {
          b.alive = false;
          player.takeDamage(b.damage);
          audio.sfx_hit();
          this._spawnExplosion(b.x, b.y, '#ff4444', 5);
          if (!player.alive) this._onPlayerDeath(audio);
        }
      }
      // 敌机碰撞
      for (const e of this.enemies) {
        if (!e.alive || e.isBoss) continue;
        if (e.collidesWith(player)) {
          e.alive = false;
          this._spawnExplosion(e.x, e.y, e.color, 10);
          player.takeDamage(1);
          audio.sfx_hit();
          if (!player.alive) this._onPlayerDeath(audio);
        }
      }
      // 掉落物拾取
      for (const d of this.drops) {
        if (!d.alive) continue;
        if (d.collidesWith(player)) {
          d.alive = false;
          this._collectDrop(d, audio);
        }
      }
    };

    checkPlayerHit(this.player, 'P1');
  }

  _onEnemyKilled(enemy, audio) {
    audio.sfx_explosion();
    this._spawnExplosion(enemy.x, enemy.y, enemy.color, 15);
    this.score += enemy.score;
    this.killCount++;
    this.combo++;
    this.comboTimer = 2;
    if (this.combo > 1) {
      this.score += Math.floor(enemy.score * 0.1 * (this.combo - 1));
      audio.sfx_combo();
    }

    // 分裂敌机：死亡时生成小敌机
    if (enemy.isSplitter && enemy.splitsOnDeath) {
      for (let i = 0; i < enemy.splitCount; i++) {
        const e = this.enemyPool.get();
        if (e) {
          const angle = (TAU / enemy.splitCount) * i + Math.random() * 0.5;
          const speed = this.difficulty > 1 ? 120 * (1 + this.difficulty * 0.1) : 120;
          e.init(
            enemy.x + Math.cos(angle) * 20,
            enemy.y + Math.sin(angle) * 20,
            this.difficulty,
            'normal',
            Math.cos(angle) * speed,
            Math.sin(angle) * speed
          );
          this.enemies.push(e);
        }
      }
      this._spawnFloatingText(enemy.x, enemy.y, '分裂!', '#ff4444');
    }

    // 军备掉落（生成物理掉落物）
    if (this.mode === 'timed') {
      // 限时模式：掉落金币
      if (Math.random() < CONFIG.COIN_DROP_RATE) {
        this._spawnDrop('coin', '', 1, enemy.x, enemy.y, '#ffd700', '💰');
      }
    }
    // 零件掉落（所有模式）- 降低至15%
    if (Math.random() < 0.15) {
      this._spawnDrop('part', '', 1, enemy.x, enemy.y, '#00ffcc', '🔩');
    }
  }

  _spawnDrop(type, id, amount, x, y, color, label) {
    const d = this.dropPool.get();
    d.init(type, id, amount, x, y, color, label);
    this.drops.push(d);
  }

  _collectDrop(drop, audio) {
    if (!this.inventory) return;
    switch (drop.dropType) {
      case 'part':
        this.inventory.addParts(drop.amount);
        this._spawnFloatingText(drop.x, drop.y, `+${drop.amount}零件`, '#00ffcc');
        break;
      case 'coin':
        this.inventory.addCoins(drop.amount);
        this._spawnFloatingText(drop.x, drop.y, `+1金币`, '#ffd700');
        break;
    }
    audio.sfx_powerup();
  }

  _spawnFloatingText(x, y, text, color) {
    this.floatingTexts.push({ x, y, text, color, life: 1.5, alpha: 1 });
  }

  _onBossKilled(audio, deadBoss = null) {
    audio.sfx_bossExplosion();
    if (!deadBoss) deadBoss = this.boss;
    this.score += 5000;
    // 大爆炸
    const bx = deadBoss ? deadBoss.x : CONFIG.WIDTH / 2;
    const by = deadBoss ? deadBoss.y : 60;
    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        this._spawnExplosion(
          bx + rand(-30, 30),
          by + rand(-30, 30),
          i === 0 ? '#ffaa00' : i === 1 ? '#ff2d55' : '#b44dff',
          25
        );
      }, i * 300);
    }

    // 检查是否所有Boss都死了
    const allBossesDead = !this.bosses || this.bosses.length === 0 || this.bosses.every(b => !b.alive);
    if (!allBossesDead) return; // 还有Boss活着，不触发通关

    this.boss = null;
    this.bosses = [];

    // 清除场上所有敌机（带爆炸效果）
    this.enemies.forEach(e => {
      if (e.alive) {
        this._spawnExplosion(e.x, e.y, '#ff6600', 8);
        e.alive = false;
      }
    });
    // 清除场上所有敌方子弹
    this.bullets.forEach(b => { if (b.isEnemy) b.alive = false; });

    // Boss 关卡模式：通关奖励
    if (this.mode === 'boss' && this.inventory) {
      const stageCfg = this.inventory.getBossStageConfig();
      const elapsed = (performance.now() - this._bossBattleStart) / 1000;
      this._bossBattleTime = elapsed;
      // 星级判定：基于通关时间
      // 30秒内 = 3星，60秒内 = 2星，超过60秒 = 1星
      const stars = elapsed <= 30 ? 3 : elapsed <= 60 ? 2 : 1;
      this._bossStars = stars;
      // 金币和零件奖励：关卡越高、星级越高，奖励越多
      const baseCoins = stageCfg.id * 50;
      const baseParts = stageCfg.id * 3;
      const rewardCoins = baseCoins * stars;
      const rewardParts = baseParts * stars;
      this.inventory.addCoins(rewardCoins);
      this.inventory.addParts(rewardParts);
      this._bossRewardCoins = rewardCoins;
      this._bossRewardParts = rewardParts;
      this._spawnFloatingText(deadBoss.x, deadBoss.y - 40, `+${rewardCoins}💰 +${rewardParts}🔩`, '#ffd700');
      const starStr = '★'.repeat(stars) + '☆'.repeat(3 - stars);
      this._spawnFloatingText(deadBoss.x, deadBoss.y - 60, `${starStr}`, '#ffd700');
      // 推进关卡
      this.inventory.clearBossStage(stageCfg.id, stars);
      // 通知
      if (this.notifyCallback) {
        this.notifyCallback('🏆', '关卡通关！', `第${stageCfg.id}关 ${stageCfg.name} ${starStr}`, stageCfg.color);
        this.notifyCallback('💰', '通关奖励！', `+${rewardCoins}金币 +${rewardParts}零件`, '#ffd700');
      }
      // 段位积分
      this.inventory.addRankScore(this.score);
      this.bossStageCleared = true;
      this.win = true;
      this._createBigExplosion(deadBoss.x, deadBoss.y, stageCfg.color, 80);
      this._explosionPhase = 3.0;  // 延长爆炸时间
      this._explosionType = 'victory';
      audio.stopMusic();
    } else {
      // 段位积分（非 Boss 模式）
      if (this.inventory) {
        this.inventory.addRankScore(this.score);
      }
    }
    // 掉落零件和金币
    if (deadBoss) {
      for (let i = 0; i < 3; i++) {
        this._spawnDrop('part', '', 2, deadBoss.x + rand(-40, 40), deadBoss.y + rand(-40, 40), '#00ffcc', '🔩');
      }
      for (let i = 0; i < 2; i++) {
        this._spawnDrop('coin', '', 1, deadBoss.x + rand(-40, 40), deadBoss.y + rand(-40, 40), '#ffd700', '💰');
      }
    }
  }

  _onPlayerDeath(audio) {
    audio.sfx_playerDie();
    // 壮观爆炸动画
    this._createBigExplosion(this.player.x, this.player.y, '#00d4ff', 60);
    this._explosionPhase = 2.0; // 2秒爆炸动画
    this._explosionType = 'death';
    audio.sfx_gameOver();
    if (this.score > this.highScore) {
      this.highScore = this.score;
      localStorage.setItem('planeGameHighScore', this.highScore);
    }
    // 段位积分（死亡也记录）
    if (this.inventory) {
      this.inventory.addRankScore(this.score);
    }
    audio.stopMusic();
  }

  _magnetPull(entity, dt) {
    if (!this.player.alive) return;
    const angle = Math.atan2(this.player.y - entity.y, this.player.x - entity.x);
    const speed = 200;
    entity.x += Math.cos(angle) * speed * dt;
    entity.y += Math.sin(angle) * speed * dt;
  }

  _spawnExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      if (this.particles.length >= CONFIG.MAX_PARTICLES) break;
      const angle = rand(0, TAU);
      const speed = rand(50, 250);
      const life = rand(0.2, 0.7);
      const particle = this.particlePool.get();
      particle.init(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, life, color, rand(2, 5));
      this.particles.push(particle);
    }
  }

  _createBigExplosion(x, y, color, count) {
    // 多波粒子爆炸，更壮观
    this._spawnExplosion(x, y, '#ffffff', count * 0.5);          // 白色闪光
    this._spawnExplosion(x, y, color, count);
    setTimeout(() => { this._spawnExplosion(x + rand(-20, 20), y + rand(-20, 20), '#ffaa00', count * 0.4); }, 100);
    setTimeout(() => { this._spawnExplosion(x + rand(-30, 30), y + rand(-30, 30), '#ff2d55', count * 0.35); }, 200);
    setTimeout(() => { this._spawnExplosion(x + rand(-40, 40), y + rand(-40, 40), '#ffffff', count * 0.25); }, 350);
    setTimeout(() => { this._spawnExplosion(x + rand(-35, 35), y + rand(-35, 35), color, count * 0.3); }, 500);
    setTimeout(() => { this._spawnExplosion(x + rand(-25, 25), y + rand(-25, 25), '#ffd700', count * 0.2); }, 700);
    setTimeout(() => { this._spawnExplosion(x + rand(-20, 20), y + rand(-20, 20), '#ffffff', count * 0.15); }, 900);
    this.screenShake = Math.max(this.screenShake || 0, 1.2);
    // 存储爆炸中心用于绘制冲击波
    this._explosionCenter = { x, y, color };
  }

  _cleanup() {
    this.bullets = this.bullets.filter(b => { if (b.alive) return true; this.bulletPool.release(b); return false; });
    this.enemies = this.enemies.filter(e => { if (e.alive) return true; this.enemyPool.release(e); return false; });
    this.particles = this.particles.filter(p => { if (p.alive) return true; this.particlePool.release(p); return false; });
    this.drops = this.drops.filter(d => { if (d.alive) return true; this.dropPool.release(d); return false; });
  }

  draw(ctx, time) {
    ctx.save();
    // 屏幕震动
    if (this.screenShake > 0) {
      const sx = rand(-3, 3) * this.screenShake * 10;
      const sy = rand(-3, 3) * this.screenShake * 10;
      ctx.translate(sx, sy);
    }

    this.background.draw(ctx, time);

    // 掉落物
    this.drops.forEach(d => { if (d.alive) d.draw(ctx, time); });

    // 敌机
    this.enemies.forEach(e => { if (e.alive) e.draw(ctx, time); });

    // Boss
    // Boss（渲染所有Boss）
    if (this.bosses && this.bosses.length > 0) {
      this.bosses.forEach(boss => { if (boss.alive) boss.draw(ctx, time); });
    } else if (this.boss && this.boss.alive) {
      this.boss.draw(ctx, time);
    }

    // 玩家
    this.player.draw(ctx, time);
    this._drawPlayerDrones(ctx, this.player);

    // 分身
    if (this.player.cloneTimer > 0) {
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.translate(this.player.cloneX, this.player.cloneY);
      ctx.shadowColor = '#00d4ff';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#0a0a2e';
      ctx.strokeStyle = '#00d4ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(-15, 16);
      ctx.lineTo(-8, 6);
      ctx.lineTo(8, 6);
      ctx.lineTo(15, 16);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // 子弹
    this.bullets.forEach(b => {
      if (!b.alive) return;
      if (b.laser) {
        ctx.strokeStyle = '#00d4ff';
        ctx.shadowColor = '#00d4ff';
        ctx.shadowBlur = 16;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y - b.h / 2);
        ctx.lineTo(b.x, b.y + b.h / 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      } else {
        b.draw(ctx);
      }
    });

    // 粒子
    this.particles.forEach(p => { if (p.alive) p.draw(ctx); });

    // 浮动文字
    this.floatingTexts.forEach(ft => {
      ctx.save();
      ctx.globalAlpha = ft.alpha;
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 14px "Courier New"';
      ctx.textAlign = 'center';
      ctx.shadowColor = ft.color;
      ctx.shadowBlur = 6;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.shadowBlur = 0;
      ctx.restore();
    });

    ctx.restore();

    // HUD
    this.hud.draw(ctx, {
      score: this.score,
      combo: this.combo,
      highScore: this.highScore,
      player: this.player,
      boss: this.boss,
      gameTime: this.gameTime,
      difficulty: this.difficulty,
      mode: this.mode,
      timeLimit: this.timeLimit,
      inventory: this.inventory,
      bossBattleStart: this._bossBattleStart,
    });

    // Boss 关卡介绍
    if (this.bossIntro) {
      this._drawBossIntro(ctx);
    }

    // Boss 攻击介绍
    if (this._bossBriefing) {
      this._drawBossBriefing(ctx);
    }

    // Boss降临特效
    if (this._bossArrival) {
      this._drawBossArrival(ctx, time);
    }

    // 退出确认
    if (this.quitConfirm) {
      this._drawQuitConfirm(ctx);
    }

    // 爆炸动画阶段特效：屏幕闪白 + 冲击波
    if (this._explosionPhase > 0 && this._explosionCenter) {
      const progress = 1 - (this._explosionPhase / (this._explosionType === 'victory' ? 3.0 : 2.0));
      const { x, y, color } = this._explosionCenter;

      // 屏幕闪白（逐渐减弱）
      const flashAlpha = Math.max(0, (1 - progress) * 0.8);
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

      // 冲击波环（多个同心圆向外扩散）
      for (let ring = 0; ring < 3; ring++) {
        const ringDelay = ring * 0.15;
        const ringProgress = Math.max(0, Math.min(1, (progress - ringDelay) / 0.7));
        if (ringProgress > 0) {
          const radius = ringProgress * 250;
          const ringAlpha = (1 - ringProgress) * 0.6;
          ctx.strokeStyle = color;
          ctx.globalAlpha = ringAlpha;
          ctx.lineWidth = 4 * (1 - ringProgress);
          ctx.shadowColor = color;
          ctx.shadowBlur = 20 * (1 - ringProgress);
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, TAU);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
      }
      ctx.globalAlpha = 1;
    }

    // 暂停
    if (this.paused) {
      this._drawPauseMenu(ctx);
    }

    // 结束
    if (this.gameOver) {
      let title, titleColor, subtitle;
      if (this.mode === 'boss' && this.bossStageCleared) {
        const stageCfg = this.inventory.getBossStageConfig();
        title = '关卡通关！';
        titleColor = '#ffd700';
        const stars = this._bossStars || 1;
        const starStr = '★'.repeat(stars) + '☆'.repeat(3 - stars);
        const starDescs = {
          1: '★☆☆ 通关时间较长',
          2: '★★☆ 快速通关（60秒内）',
          3: '★★★ 极速通关（30秒内）',
        };
        const rc = this._bossRewardCoins || 0;
        const rp = this._bossRewardParts || 0;
        const nextStage = this.inventory.bossStage;
        const nextCfg = CONFIG.BOSS_STAGES[nextStage - 1];
        subtitle = `击败 ${stageCfg.name}\n${starStr}  ${starDescs[stars]}\n通关用时: ${this._bossBattleTime.toFixed(1)}秒  |  奖励: +${rc}💰 +${rp}🔩\n${nextCfg ? '下一关: ' + nextCfg.name : '全部通关!'}\n得分: ${this.score.toLocaleString()}`;
        this._drawBossVictoryOverlay(ctx, title, subtitle, titleColor);
      } else if (this.mode === 'boss') {
        title = '挑战失败';
        titleColor = '#ff2d55';
        subtitle = `得分: ${this.score.toLocaleString()}  最高: ${this.highScore.toLocaleString()}`;
        this._drawOverlay(ctx, title, subtitle, titleColor);
      } else if (this.win) {
        title = '时间到！';
        titleColor = '#ffaa00';
        subtitle = `得分: ${this.score.toLocaleString()}  击杀: ${this.killCount}  最高: ${this.highScore.toLocaleString()}`;
        this._drawOverlay(ctx, title, subtitle, titleColor);
      } else {
        title = 'GAME OVER';
        titleColor = '#ff2d55';
        subtitle = `得分: ${this.score.toLocaleString()}  击杀: ${this.killCount}  最高: ${this.highScore.toLocaleString()}`;
        this._drawOverlay(ctx, title, subtitle, titleColor);
      }
      // Boss 通关：显示下一关和返回两个按钮
      if (this.mode === 'boss' && this.bossStageCleared) {
        const hasNext = this.inventory && this.inventory.bossStage <= CONFIG.BOSS_STAGES.length;
        if (hasNext) this._drawNextStageButton(ctx);
        this._drawReturnButtonSmall(ctx);
      } else {
        this._drawReturnButton(ctx, this.mode === 'boss' ? '返回关卡选择' : '返回主界面');
      }
    }
  }

  _drawPlayerDrones(ctx, player) {
    const dronePositions = player.getDronePositions();
    dronePositions.forEach(([dx, dy]) => {
      ctx.fillStyle = '#b44dff';
      ctx.shadowColor = '#b44dff';
      ctx.shadowBlur = 8;
      ctx.fillRect(dx - 6, dy - 6, 12, 12);
      ctx.strokeStyle = '#b44dff';
      ctx.lineWidth = 1;
      ctx.strokeRect(dx - 6, dy - 6, 12, 12);
      ctx.shadowBlur = 0;
    });
  }

  _drawOverlay(ctx, title, subtitle, titleColor = '#ff2d55') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

    ctx.fillStyle = titleColor;
    ctx.shadowColor = titleColor;
    ctx.shadowBlur = 20;
    ctx.font = 'bold 36px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(title, CONFIG.WIDTH / 2, 130);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#e0e8ff';
    ctx.font = '14px "Microsoft YaHei"';
    const lines = subtitle.split('\n');
    const lineSpacing = 18;
    lines.forEach((line, i) => {
      ctx.fillText(line, CONFIG.WIDTH / 2, 180 + i * lineSpacing);
    });
    ctx.textAlign = 'left';
  }

  _drawBossVictoryOverlay(ctx, title, subtitle, titleColor) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

    // 标题 - 放在上方
    ctx.fillStyle = titleColor;
    ctx.shadowColor = titleColor;
    ctx.shadowBlur = 25;
    ctx.font = 'bold 32px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(title, CONFIG.WIDTH / 2, 70);
    ctx.shadowBlur = 0;

    // 内容行 - 居中排列
    const lines = subtitle.split('\n');
    const startY = 110;
    const lineSpacing = 18;
    lines.forEach((line, i) => {
      // 星级行用金色
      if (line.includes('★')) {
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 18px "Microsoft YaHei"';
      } else if (line.includes('奖励')) {
        ctx.fillStyle = '#ffd700';
        ctx.font = '14px "Microsoft YaHei"';
      } else if (line.includes('下一关') || line.includes('全部通关')) {
        ctx.fillStyle = '#00ffcc';
        ctx.font = '14px "Microsoft YaHei"';
      } else {
        ctx.fillStyle = '#e0e8ff';
        ctx.font = '14px "Microsoft YaHei"';
      }
      ctx.fillText(line, CONFIG.WIDTH / 2, startY + i * lineSpacing);
    });
    ctx.textAlign = 'left';
  }

  _getReturnButtonRect() {
    const bw = 240, bh = 42;
    const bx = (CONFIG.WIDTH - bw) / 2;
    const by = 340;
    return { x: bx, y: by, w: bw, h: bh };
  }

  _drawReturnButton(ctx, text = '返回主界面') {
    const r = this._getReturnButtonRect();
    const now = performance.now() / 1000;
    const pulse = Math.sin(now * 3) * 0.3 + 0.7;

    // 按钮外发光
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 15 * pulse;
    ctx.fillStyle = 'rgba(0,212,255,0.15)';
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 2;
    this._roundRect(ctx, r.x, r.y, r.w, r.h, 8);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 按钮文字
    ctx.fillStyle = '#00d4ff';
    ctx.font = 'bold 18px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(text, r.x + r.w / 2, r.y + 27);
    ctx.textAlign = 'left';

    // 提示文字
    ctx.fillStyle = 'rgba(224,232,255,0.5)';
    ctx.font = '12px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('或按 ENTER', r.x + r.w / 2, r.y + r.h + 15);
    ctx.textAlign = 'left';
  }
